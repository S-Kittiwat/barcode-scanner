<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%23f1f5f9'/%3E%3Crect x='11' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='14.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3Crect x='17' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='20.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocScan — ติดตามเอกสาร</title>
<script src="config.js"></script>
<link rel="stylesheet" href="css/auth.css">
<style>/* กล่องแจ้งข้อผิดพลาด ต้องมีเสมอ
   ไม่งั้นข้อความผิดพลาดจะไม่แสดงอะไรเลย */
.alert{display:none;background:rgba(248,113,113,.1);border:1px solid var(--danger);
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13px}
.alert.on{display:block}


  body{display:block;padding:0;align-items:stretch}
  .wrap{max-width:1340px;margin:0 auto;padding:22px 24px 90px}

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20}
  .topbar .back{color:var(--accent);text-decoration:none;font-size:13.5px}
  .tb-title{border-left:1px solid var(--border);padding-left:18px}
  .tb-name{font-size:16px;font-weight:600}
  .tb-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .tb-user{margin-left:auto;text-align:right;font-size:12.5px}
  .tb-site{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

  /* ช่องค้นหาเป็นพระเอกของหน้านี้ */
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:22px;margin-bottom:16px}
  .srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sbox{flex:1;min-width:280px;position:relative}
  .sbox input{width:100%;background:var(--surface2);border:1.5px solid var(--accent);
    border-radius:10px;color:var(--text);font-family:var(--mono);font-size:19px;
    padding:15px 15px 15px 48px;letter-spacing:.05em;outline:none}
  .sbox .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
  .btn{border:none;border-radius:var(--rs);padding:14px 24px;font-family:var(--font);
    font-size:14.5px;font-weight:600;cursor:pointer;background:var(--accent);color:#0f172a}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);
    font-weight:400;padding:10px 16px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  /* ตะกร้า */
.csum .cw{color:var(--warn)} .csum .cbad{color:var(--danger)}
.cfoot .btn{width:100%;padding:11px}
body.cart-on .wrap{padding-right:324px}

/* กล่องวางรายการ */
#dlgPaste{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);padding:22px;max-width:520px;width:92vw;margin:auto;inset:0}
#dlgPaste::backdrop{background:rgba(15,23,42,.82)}
#pasteBox{width:100%;height:210px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);font-family:var(--mono);font-size:13.5px;
  padding:12px;resize:vertical;line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.7}
  .hint code{font-family:var(--mono);color:var(--accent);background:var(--surface2);
    padding:1px 7px;border-radius:4px;cursor:pointer}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;
    padding-top:16px;border-top:1px solid var(--border)}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11.5px;color:var(--muted)}
  .fld select,.fld input{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:13px;padding:8px 11px}

  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
  .kpi .n{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.15}
  .kpi .k{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .kpi.bad{border-color:rgba(248,113,113,.5)} .kpi.bad .n{color:var(--danger)}
  .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--success)}
  .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--accent)}

  .rhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .rhead h2{font-size:14px;font-weight:600}
  .rhead .c{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  .rhead .r{margin-left:auto;display:flex;gap:10px;align-items:center}

  .tw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--surface2);
    border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr.main{cursor:pointer}
  tbody tr.main:hover td{background:var(--surface2)}
  tbody tr.main.open td{background:var(--surface2)}
  .mono{font-family:var(--mono)}
  .ref{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.03em}
  .sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}

  .pill{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 9px;
    border-radius:11px;border:1px solid;white-space:nowrap}
  .p-ok{color:var(--success);border-color:var(--success)}
  .p-warn{color:var(--warn);border-color:var(--warn)}
  .p-bad{color:var(--danger);border-color:var(--danger)}
  .p-mute{color:var(--muted);border-color:var(--border)}

  /* จุดบอกความคืบหน้า อ่านเร็วกว่าตัวหนังสือเมื่อกวาดสายตาทั้งตาราง */
  .flow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
  .dot.on{background:var(--success)} .dot.now{background:var(--accent)}
  .dot.late{background:var(--danger)}

  .detail td{background:#16202f;padding:0}
  .dwrap{padding:20px 24px;display:grid;gap:26px;grid-template-columns:1.15fr 1fr}
  .dsec h4{font-size:11px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);margin-bottom:11px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13px}
  .kv .k{color:var(--muted)}
  .tl{border-left:2px solid var(--border);padding-left:16px;margin-left:5px}
  .ev{position:relative;padding-bottom:15px;font-size:12.5px}
  .ev:last-child{padding-bottom:0}
  .ev::before{content:'';position:absolute;left:-22px;top:4px;width:9px;height:9px;
    border-radius:50%;background:var(--success);border:2px solid var(--bg)}
  .ev .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ev .who{font-size:11.5px;color:var(--muted)}
  .boxcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
    padding:13px 15px;margin-top:12px;display:flex;gap:13px;align-items:center}
  .boxcard img{width:62px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0;
    cursor:zoom-in;border:1px solid var(--border)}
  .boxcard .ph{width:62px;height:62px;border-radius:6px;background:var(--bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:21px}
  .boxcard .bid{font-family:var(--mono);font-size:14px;font-weight:700}
  .boxcard .bl{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
  .dacts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .dacts a{text-decoration:none;display:inline-block}

  .empty{color:var(--muted);font-size:13.5px;padding:34px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--r);line-height:1.8}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
  @media (max-width:980px){ .dwrap{grid-template-columns:1fr} th:nth-child(3),td:nth-child(3){display:none} }

/* ── หน้าติดตามเอกสาร ── */

.tab b{margin-left:6px;font-family:var(--mono)}
.grow{flex:1}
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:38px;text-align:center;color:var(--muted);font-size:13.5px}

.chk{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.ref{font-family:var(--mono);font-size:13.5px;font-weight:600}
.sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.sub.note{color:var(--text);opacity:.75;font-style:italic}
.bad{color:var(--danger)} .warn{color:var(--warn)} .ok{color:var(--success)}
tr.lv-over td{background:rgba(248,113,113,.07)}
tr.lv-over td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr.lv-critical td:first-child{box-shadow:inset 3px 0 0 var(--warn)}


#dlgReason{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);padding:20px;max-width:560px;width:94vw;
  margin:auto;inset:0;max-height:90vh;overflow:auto}
#dlgReason::backdrop{background:rgba(15,23,42,.82)}
 .rs-gl.bad{color:var(--danger)}
 .rs-gl.muted{color:var(--muted)}
.rs-fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.rs-fld input,.rs-fld select{width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--rs);color:var(--text);
  padding:9px 11px;font-family:var(--font);font-size:13px}
.rs-act .hint{margin-right:auto;text-align:left}


/* ── หน้ารับเอกสารเป็นชุด ── */
.scanbox{background:var(--surface);border:2px solid var(--accent);
  border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.scanbox.done{border-color:var(--success)}
.scan-l{font-size:12.5px;color:var(--muted);margin-bottom:7px}
#scanInput{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:14px 16px;
  font-family:var(--mono);font-size:19px;letter-spacing:.05em}
#scanInput:focus{outline:2px solid var(--accent);outline-offset:1px}

/* หัวชุดเป็นข้อมูลอ้างอิง ไม่ใช่สาระของหน้า
   ย่อให้แน่นเพื่อให้รายการที่ต้องตรวจได้พื้นที่มากที่สุด */
.bhead{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bid{font-family:var(--mono);font-size:23px;font-weight:700}
/* ข้อมูลชุดเรียงต่อกันในบรรทัดเดียว ไม่แยกเป็นตาราง */
.bmeta{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;
  font-size:12px;color:var(--muted)}
.bmeta b{color:var(--text);font-weight:600}
.bk{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bv{font-size:13.5px;font-weight:600;margin-top:2px}

.prog{height:5px;width:120px;background:var(--surface2);
  border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--success);
  transition:width .2s ease;width:0}
.progtxt{font-family:var(--mono);font-size:12.5px;font-weight:600}
/* แถบความคืบหน้ากับตัวเลขอยู่ติดกัน และดันไปชิดขวา */
.bprog{display:flex;align-items:center;gap:8px;margin-left:auto}

.ilist{max-height:44vh;overflow:auto;border:1px solid var(--border);border-radius:var(--rs)}
/* คอลัมน์ตัวเลขจัดกลาง อ่านง่ายกว่าชิดซ้าย */
.ilist th.c,.ilist td.c{text-align:center}
/* ปุ่มเอาออก — เล็กและไม่เด่น เพราะเป็นทางถอย ไม่ใช่งานหลัก */
.xbtn{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:13px;padding:2px 5px;line-height:1}
.xbtn:hover{color:var(--danger)}
.ilist table{margin:0}
.ilist thead th{position:sticky;top:0;background:var(--surface2);z-index:1}
tr.got td{background:rgba(52,211,153,.09)}
tr.got td:first-child{box-shadow:inset 3px 0 0 var(--success)}
.mark{font-size:15px;width:22px;display:inline-block;text-align:center}
.extra-row td{background:rgba(96,165,250,.09)}
.extra-row td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

.toast2{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:200;
  border-radius:var(--r);padding:13px 24px;font-size:15px;font-weight:600;
  opacity:0;pointer-events:none;transition:.16s;font-family:var(--mono)}
.toast2.on{opacity:1;transform:translate(-50%,0)}
.toast2.ok{background:var(--success);color:#0f172a}
.toast2.bad{background:var(--danger);color:#fff}
.toast2.warn{background:var(--warn);color:#0f172a}

.actbar{position:fixed;left:0;right:0;bottom:0;z-index:130;
  background:var(--surface);border-top:1px solid var(--border);
  padding:12px 88px 12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bldtag{position:fixed;right:8px;bottom:6px;z-index:5;font-family:var(--mono);
  font-size:10px;color:var(--muted);opacity:.5;pointer-events:none}
@media print{.bldtag{display:none}}
/* ── ขั้นตรวจเอกสาร ── */
.vhead{display:flex;align-items:flex-start;gap:14px;margin:18px 0 12px}
.vh-t{font-size:15px;font-weight:600}
.vlist{display:flex;flex-direction:column;gap:9px}

/* สรุปผลการยิง — ต้องเห็นก่อนกดยืนยัน
   ถ้าอยู่ท้ายหน้า คนจะเลื่อนผ่านแล้วไม่เห็น */
.vsum{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.sm-it{border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;
  font-size:13px;line-height:1.6}
.sm-it.ok{border-color:rgba(52,211,153,.45)}
.sm-it.bad{border-color:var(--danger);background:rgba(248,113,113,.08)}
.sm-it.warn{border-color:var(--warn);background:rgba(251,191,36,.08)}
.sm-l{font-family:var(--mono);font-size:11.5px;margin-top:5px;line-height:1.8}
.sm-n{font-size:11px;color:var(--muted);margin-top:5px}
.sm-it input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:6px 9px;
  font-family:var(--font);font-size:12.5px}

.vrow{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px}
.vrow.pass{border-color:rgba(52,211,153,.5)}
.vrow.fix{border-color:var(--warn)}

.vr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vr-ref{font-family:var(--mono);font-size:15px;font-weight:700}
.vr-bc{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.vr-act{margin-left:auto;display:flex;gap:7px}

/* 8 ช่องเรียงบรรทัดเดียว — Account No. แคบเพราะเป็นตัวเลขสั้น
   ที่เหลือแบ่งพื้นที่เท่ากัน เพราะเป็นชื่อยาว */
.vr-data{display:grid;
  grid-template-columns:64px 1fr 64px 1fr 1fr 84px 78px 78px 62px 62px;
  gap:9px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.vr-data>div{min-width:0}
.vd-v{overflow-wrap:anywhere}
@media (max-width:1100px){
  .vr-data{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
}
.vd-k{font-size:10px;color:var(--muted);text-transform:uppercase}
.vd-v{font-size:13px;font-weight:600;margin-top:2px}

/* ช่องแก้ไข — โผล่เฉพาะเมื่อกดว่าไม่ตรง */
.vr-edit{margin-top:11px;padding-top:11px;border-top:1px solid var(--warn)}
.vr-edit .eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:9px;margin-bottom:9px}
.vr-edit label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px}
.vr-edit input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:6px 9px;
  font-family:var(--font);font-size:12.5px}
.vr-edit input.changed{border-color:var(--warn)}
/* ช่องค้นหา — พิมพ์กรองรายการได้ */
.cbo{position:relative}
/* ไม่วาดลูกศรเอง เพราะเบราว์เซอร์วาดให้อยู่แล้วเมื่อช่องผูกกับ datalist
   ถ้าวาดซ้ำจะเห็นลูกศรสองอันซ้อนกัน */
.cbo-in{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:6px 9px;
  font-family:var(--font);font-size:12.5px}
.cbo-in:focus{border-color:var(--accent);outline:none}
/* ค่าที่พิมพ์เองยังไม่เคยมีในทะเบียน ต้องตรวจก่อนนำไปใช้จริง */
.cbo-warn{font-size:10px;color:var(--warn);margin-top:3px}

.btn.sm{padding:5px 11px;font-size:12px}
/* ลิงก์ที่ใช้เป็นปุ่ม ต้องจัดกึ่งกลางเองเพราะ a ไม่ใช่ flex โดยปริยาย */
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;
  border:1px solid var(--border);color:var(--muted)}
.tag.ok{border-color:var(--success);color:var(--success)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="home.html">← หน้าหลัก</a>
  <div class="tb-title">
    <div class="tb-name">รับเอกสารเป็นชุด</div>
    <div class="tb-sub" id="scopeInfo">ยิงบาร์โค้ดบนใบปะหน้าเพื่อเริ่ม</div>
  </div>
  <div class="tb-user">
    <span id="who">—</span>
    <div class="tb-site" id="whoSite"></div>
  </div>
</div>

<div class="wrap">
  <div class="alert bad" id="alert"></div>

  <div class="scanbox" id="scanBox">
    <div class="scan-l" id="scanLabel">① ยิงบาร์โค้ดบนใบปะหน้า</div>
    <input id="scanInput" placeholder="B26082701" autocomplete="off" autocapitalize="off">
  </div>

  <div id="batchArea" style="display:none">
    <div class="bhead">
      <div class="bid" id="bId">—</div>

      <!-- ข้อมูลชุดเรียงต่อกัน ไม่แยกเป็นตาราง
           เป็นข้อมูลอ้างอิงที่ดูผ่าน ๆ ไม่ใช่สิ่งที่ต้องอ่านทุกช่อง -->
      <div class="bmeta">
        <span id="bWhen">—</span>
        <span>จาก <b id="bFrom">—</b></span>
        <span>โดย <b id="bBy">—</b></span>
        <span id="bChannel">—</span>
        <span><b id="bCount">—</b></span>
      </div>

      <div class="bprog">
        <div class="prog"><i id="progBar"></i></div>
        <span class="progtxt" id="progTxt">0 / 0</span>
      </div>

      <button class="btn ghost sm" id="btnCancel">ยกเลิกชุดนี้</button>
    </div>

    <div class="ilist" id="ilist"></div>

    <!-- ขั้นตรวจเอกสารจริง
         เอกสารตัวจริงเป็นหลักฐาน ถ้าข้อมูลในระบบไม่ตรง แก้ตามกระดาษได้ทันที -->
    <div id="verifyBox" style="display:none">
      <div class="vhead">
        <div>
          <div class="vh-t">② ตรวจเอกสารจริงกับข้อมูลในระบบ</div>
          <div class="hint" id="vhCount">—</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:7px">
          <!-- ต้องมีทางกลับไปยิงเพิ่ม ไม่งั้นเจอใบตกหล่นแล้วต้องเริ่มใหม่ทั้งชุด -->
          <button class="btn ghost" id="btnBackScan">← กลับไปยิงเพิ่ม</button>
          <button class="btn ghost" id="btnAllPass">ผ่านทั้งหมด</button>
        </div>
      </div>
      <div class="vsum" id="vSummary"></div>
      <div class="vlist" id="vlist"></div>
    </div>
  </div>
</div>

<div class="toast2" id="toast2"></div>

<div class="actbar" id="actBar" style="display:none">
  <span class="hint" id="actInfo">—</span>
  <div class="grow"></div>
  <button class="btn ghost" id="btnToVerify">ตรวจเอกสาร →</button>
  <button class="btn" id="btnFinish" style="display:none">ยืนยันรับเอกสาร</button>
</div>

<script type="module">

import { authFetch, requireAuth, logout } from './js/auth.js';
/* installNav และ guardPage อยู่ใน nav.js ไม่ใช่ auth.js
   เขียนผิดไฟล์ทำให้โมดูลพังทั้งก้อน หน้าจึงว่างเปล่าเงียบ ๆ */
import { installNav, guardPage } from './js/nav.js';
import { installSupport, installErrorCapture } from './js/support.js';
import { installRefBar } from './js/refstatus.js';

const API = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);

const session = requireAuth();
if (session) {
  if (!guardPage(session)) throw new Error('no access');
  installNav(session, { onLogout: () => logout(API) });
  $('who').textContent = session.empName || session.empId || '';
  $('whoSite').textContent = session.site || '';

  /* ของเสริมต้องไม่ทำให้หน้าหลักพัง
     เดิมวางไว้ก่อนแสดงชื่อผู้ใช้ ถ้าตัวใดตัวหนึ่งพัง
     ทั้งหน้าจะหยุดตั้งแต่ต้น และไม่มีอะไรบอกว่าเพราะอะไร */
  try {
    installErrorCapture();
    installSupport(session, call);
  } catch (e) {
    console.error('[DocScan] ติดตั้งส่วนเสริมไม่สำเร็จ', e);
  }
}

async function call(action, payload = {}, timeoutMs) {
  try {
    return await authFetch(API, { action, ...payload },
      timeoutMs ? { timeoutMs } : undefined);
  } catch (err) {
    if (err.code === 'auth_required') { alert('เซสชันหมดอายุ'); location.href = 'login.html'; }
    throw err;
  }
}

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* แถบสถานะข้อมูลอ้างอิง — ต้องรู้ก่อนเริ่มทำอะไร
   ว่าข้อมูลมีไหม เก่าแค่ไหน และเชื่อมเซิร์ฟเวอร์ได้ไหม */
try { installRefBar(call); }
catch (e) { console.error('[DocScan] แถบสถานะติดตั้งไม่สำเร็จ', e); }

/** วันที่พร้อมเวลา — ใช้กับเวลาที่เกิดเหตุการณ์ เช่นเวลาส่งชุด */
function fmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleString('th-TH', { day:'2-digit', month:'short', year:'2-digit',
                                     hour:'2-digit', minute:'2-digit' });
}

/** วันที่อย่างเดียว — ใช้กับวันที่บนเอกสาร
    ซึ่งไม่มีเวลาอยู่แล้ว แสดง 00:00 ไปก็ไม่มีความหมาย */
function fmtDay(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' });
}

const CHANNEL_LABEL = {
  company_van: 'รถบริษัท', courier: 'ขนส่งเอกชน',
  post: 'ไปรษณีย์', hand: 'คนถือไปเอง'
};

/* ---------- สถานะ ---------- */
let batch = null, items = [];
const got = new Set();       // ที่ยิงแล้วและอยู่ในชุด
const extra = [];            // ที่ยิงแล้วแต่ไม่อยู่ในชุด

/* ช่องยิงต้องมีโฟกัสตลอด คนใช้เครื่องยิงบาร์โค้ดซึ่งพิมพ์เข้าช่องที่โฟกัสอยู่
   ถ้าโฟกัสหลุด การยิงจะหายไปเงียบ ๆ แล้วคนไม่รู้ว่าใบนั้นตกหล่น */
function keepFocus() {
  const el = $('scanInput');
  if (document.activeElement !== el) el.focus();
}
setInterval(keepFocus, 400);
document.addEventListener('click', () => setTimeout(keepFocus, 40));

function toast(msg, kind) {
  const el = $('toast2');
  el.textContent = msg;
  el.className = 'toast2 on ' + (kind || 'ok');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1600);
}

function beep(ok) {
  /* เสียงต่างกันระหว่างสำเร็จกับผิดพลาด
     คนยิงเอกสารจะมองรายการอยู่ ไม่ได้มองข้อความบนจอตลอด */
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = ok ? 880 : 240;
    g.gain.value = 0.07;
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, ok ? 90 : 220);
  } catch (e) {}
}

/* ---------- ยิงบาร์โค้ด ---------- */
$('scanInput').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = $('scanInput').value.trim().toUpperCase();
  $('scanInput').value = '';
  if (!v) return;

  if (!batch) await openBatch(v);
  else scanItem(v);
});

/* ---------- เปิดชุด ---------- */
async function openBatch(id) {
  $('scanInput').disabled = true;
  try {
    const r = await call('shipOpenBatch', { batch_id: id }, 45000);
    if (r.status !== 'ok') { beep(false); alert(r.message || 'เปิดชุดไม่สำเร็จ'); return; }

    batch = r.batch;
    items = r.items || [];
    got.clear();
    extra.length = 0;

    /* ใบที่รับไปแล้วจากที่อื่น ให้ติ๊กไว้เลย ไม่ต้องให้ยิงซ้ำ
       แต่ยังนับรวมเพื่อให้ยอดตรงกับใบปะหน้า */
    items.forEach(it => { if (it.already_received) got.add(it.ref_no.toUpperCase()); });

    $('bId').textContent = batch.batch_id;
    $('bWhen').textContent = 'ส่งเมื่อ ' + fmt(batch.created_at);
    $('bFrom').textContent = batch.from_site || '—';
    $('bBy').textContent = batch.created_name || '—';
    $('bChannel').textContent = (CHANNEL_LABEL[batch.channel] || batch.channel || '—') +
      (batch.vehicle ? ' · ' + batch.vehicle : '');
    $('bCount').textContent = items.length + ' ใบ';

    $('scanLabel').textContent = '② ยิงบาร์โค้ดบนเอกสารทีละใบ';
    $('scanInput').placeholder = 'เช่น 990ECB';
    $('batchArea').style.display = '';
    $('actBar').style.display = 'flex';
    $('scopeInfo').textContent = 'ชุด ' + batch.batch_id + ' · จาก ' + (batch.from_site || '—');

    beep(true);
    toast('เปิดชุด ' + batch.batch_id + ' · ' + items.length + ' ใบ');
    render();
  } catch (e) {
    beep(false);
    alert('เปิดชุดไม่สำเร็จ: ' + (e.message || e));
  } finally {
    $('scanInput').disabled = false;
    keepFocus();
  }
}

/* ---------- ยิงทีละใบ ---------- */
function scanItem(v) {
  /* คนยิงบาร์โค้ดจากกระดาษ แต่ชุดเก็บเป็นเลข Reference
     ต้องเทียบทั้งสองอย่าง ไม่งั้นยิงบาร์โค้ดแล้วขึ้นว่าไม่อยู่ในชุด
     ทั้งที่หน้าจอแสดงบาร์โค้ดตัวนั้นอยู่ */
  const hit = items.find(it =>
    String(it.ref_no || '').trim().toUpperCase() === v ||
    String(it.barcode || '').trim().toUpperCase() === v);

  if (hit) {
    // เก็บเป็นเลข Reference เสมอ เพื่อให้เทียบกับชุดได้ตรง
    const key = String(hit.ref_no).trim().toUpperCase();
    if (got.has(key)) { beep(false); toast('ยิงซ้ำ ' + v, 'warn'); return; }
    got.add(key);
    beep(true);
    toast('รับ ' + v + '  (' + got.size + '/' + items.length + ')');
  } else {
    if (extra.indexOf(v) >= 0) { beep(false); toast('ยิงซ้ำ ' + v, 'warn'); return; }
    /* มาผิดชุด — รับไว้แล้วทำเครื่องหมาย ดีกว่าปฏิเสธแล้วเอกสารตกหล่น */
    extra.push(v);
    beep(true);
    toast(v + ' ไม่อยู่ในชุดนี้ — รับไว้แล้ว', 'warn');
  }
  render();
}

/* ---------- แสดงผล ---------- */
function render() {
  const done = got.size;
  const pct = items.length ? Math.round(done / items.length * 100) : 0;
  $('progBar').style.width = pct + '%';
  $('progTxt').textContent = done + ' / ' + items.length +
    (extra.length ? '   (+' + extra.length + ' ไม่อยู่ในชุด)' : '');
  $('scanBox').classList.toggle('done', done === items.length && items.length > 0);

  const missing = items.length - done;
  $('actInfo').textContent = missing
    ? 'ยังไม่ได้ยิง ' + missing + ' ใบ — ถ้าจบตอนนี้จะถือว่าไม่มาในชุดนี้'
    : 'ยิงครบทุกใบแล้ว';

  const rows = items.map(it => {
    const k = it.ref_no.toUpperCase();
    const on = got.has(k);
    return `<tr class="${on ? 'got' : ''}">
      <td><span class="mark">${on ? '✓' : '·'}</span></td>
      <td><div class="ref">${esc(it.barcode || it.ref_no)}</div>
          <div class="hint">${esc(it.ref_no)}</div></td>
      <td>${esc(it.item_name || '—')}</td>
      <td>${esc(it.transfer_from || '—')}</td>
      <td>${esc(it.transfer_to || '—')}</td>
      <td class="c">${esc(it.sent_qty || '—')}</td>
      <td class="c">${on
        ? `<button class="xbtn" data-undo="${esc(it.ref_no)}" title="เอาออก">✕</button>`
        : ''}</td>
    </tr>`;
  }).concat(extra.map(x => `<tr class="extra-row">
      <td><span class="mark">+</span></td>
      <td><div class="ref">${esc(x)}</div></td>
      <td colspan="4" class="hint">ไม่อยู่ในรายการชุดนี้ — รับไว้แล้ว</td>
    <td class="c"><button class="xbtn" data-undox="${esc(x)}" title="เอาออก">✕</button></td>
    </tr>`));

  $('ilist').innerHTML = '<table><thead><tr>' +
    '<th style="width:38px"></th><th style="width:140px">บาร์โค้ด / Reference</th>' +
    '<th style="width:130px">ประเภท</th>' +
    '<th style="width:150px">โอนจาก</th>' +
    '<th>ปลายทาง</th>' +
    '<th style="width:80px" class="c">จำนวนพาเลท</th>' +
    '<th style="width:34px"></th>' +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';

  /* เอาใบที่ยิงผิดออกได้ ก่อนกดจบการรับ
     ถ้าไม่ให้ลบ คนจะต้องเริ่มชุดใหม่ทั้งหมดเพราะยิงผิดใบเดียว */
  $('ilist').querySelectorAll('[data-undo]').forEach(function (b) {
    b.addEventListener('click', function () {
      got.delete(String(b.dataset.undo).trim().toUpperCase());
      delete verifyState[keyOf(b.dataset.undo)];
      render();
    });
  });
  $('ilist').querySelectorAll('[data-undox]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = extra.indexOf(b.dataset.undox);
      if (i >= 0) extra.splice(i, 1);
      render();
    });
  });
}

/* ---------- จบการรับ ---------- */

/* ---------- ขั้นตรวจเอกสารจริง ---------- */
/* เอกสารตัวจริงเป็นหลักฐาน ถ้าข้อมูลในระบบไม่ตรง ให้แก้ตามกระดาษ
   ตรวจทุกใบ เพราะถ้าปล่อยผ่านแล้วผิด จะไปพบตอนที่แก้ยากกว่ามาก */

var verifyState = {};    // ref → 'pass' | 'fix' | undefined
var recvNote = '';       // หมายเหตุที่ปลายทางแจ้งกลับต้นทาง

/* คีย์เดียวกันทุกที่ ไม่งั้น got กับ verifyState จะนับไม่ตรงกัน
   แล้วปุ่มยืนยันจะกดไม่ได้ทั้งที่ตรวจครบแล้ว */
function keyOf(v) { return String(v == null ? '' : v).trim().toUpperCase(); }

/* รายชื่อคู่ค้าและขนส่งจากไฟล์อ้างอิง
   ให้เลือกแทนพิมพ์เอง เพราะพิมพ์ผิดตัวเดียวก็กลายเป็นคนละราย
   แล้วรายงานจะแยกกันโดยไม่มีใครสังเกต */
var partyData = null;

async function loadParties() {
  if (partyData) return partyData;
  try {
    console.log('[DocScan] กำลังขอรายชื่อ…');
    const r = await call('refPartyList', {}, 60000);
    console.log('[DocScan] เซิร์ฟเวอร์ตอบ', r);
    if (r && r.status === 'ok') {
      partyData = r;
      const n = (r.parties || []).length;
      console.log('[DocScan] รายชื่อ', n, 'ราย · ขนส่ง',
        (r.transporters || []).length, '· ทะเบียน', (r.plates || []).length);

      /* รายชื่อว่างแปลว่ายังไม่ได้สร้าง party_list หรืออ่านไฟล์ไม่ได้
         ต้องบอก ไม่งั้นคนจะเห็นแค่ช่องพิมพ์เปล่าแล้วไม่รู้ว่าทำไม */
      if (!n) {
        toast('ยังไม่มีรายชื่อให้เลือก — พิมพ์เองได้', 'warn');
      }
    } else {
      toast('โหลดรายชื่อไม่สำเร็จ — พิมพ์เองได้', 'warn');
    }
  } catch (e) {
    console.error('[DocScan] โหลดรายชื่อไม่สำเร็จ', e);
    toast('โหลดรายชื่อไม่สำเร็จ — พิมพ์เองได้', 'warn');
  }
  return partyData;
}

/** ช่องที่ให้แก้ได้ตอนตรวจ — เฉพาะที่อ่านได้จากเอกสารจริง */
/* 8 ข้อที่ต้องตรวจกับเอกสารจริง เรียงตามที่อยู่บนกระดาษ
   เพื่อให้ตากวาดจากบนลงล่างได้โดยไม่ต้องกระโดดไปมา */
var FIX_FIELDS = [
  { k: 'origin_acc',       label: 'ต้นทาง', pairWith: 'transfer_from' },
  { k: 'transfer_from',    label: 'โอนจาก', list: 'parties', pairCode: 'origin_acc' },
  { k: 'dest_acc',         label: 'ปลายทาง', pairWith: 'transfer_to' },
  { k: 'transfer_to',      label: 'โอนไป', list: 'parties', pairCode: 'dest_acc' },
  { k: 'transporter_name', label: 'บริษัทขนส่ง', list: 'transporters' },
  /* ทะเบียนรถไม่มีรายการให้เลือก เพราะเปลี่ยนทุกเที่ยว
     รายการเก่าจะยาวขึ้นเรื่อยและไม่ช่วยให้กรอกเร็วขึ้น */
  { k: 'plate_number',     label: 'ทะเบียนรถ' },
  { k: 'doc_date',         label: 'วันส่ง', type: 'date' },
  { k: 'received_date',    label: 'วันรับ', type: 'date' },
  /* จำนวนพาเลทสำคัญที่สุด เพราะเป็นตัวที่ใช้วางบิล
     ถ้าผิดแล้วไม่จับ จะกลายเป็นข้อพิพาทภายหลัง */
  { k: 'sent_qty',         label: 'จำนวนส่ง' },
  { k: 'received_qty',     label: 'จำนวนรับ' }
];


async function goVerify() {
  var scanned = items.filter(function (it) { return got.has(String(it.ref_no).trim().toUpperCase()); });
  if (!scanned.length) { alert('ยังไม่ได้ยิงเอกสารสักใบ'); return; }

  $('scanBox').style.display = 'none';
  $('ilist').style.display = 'none';
  $('verifyBox').style.display = '';
  $('btnToVerify').style.display = 'none';
  $('btnFinish').style.display = '';

  /* แสดงตารางทันที ไม่รอรายชื่อ
   *
   * รายชื่อใช้เฉพาะตอนกด "ไม่ตรง — แก้" ซึ่งเป็นส่วนน้อย
   * ถ้ารอก่อนแสดง คนต้องรอทุกครั้งทั้งที่ส่วนใหญ่แค่กดผ่าน
   */
  renderVerify();

  // โหลดรายชื่อเบื้องหลัง พอมาถึงค่อยเติมให้
  loadParties().then(function () {
    /* วาดใหม่เสมอเมื่อรายชื่อมาถึง
     *
     * เดิมวาดเฉพาะตอนมีแถวที่กำลังแก้อยู่ แต่ตอนนั้นยังไม่มีใครกดแก้
     * พอกดทีหลัง editHtml เห็น partyData แล้วก็จริง
     * แต่ตัวเลือกถูกสร้างตอนวาดแถว ซึ่งเกิดก่อนรายชื่อมา
     * จึงไม่มีรายการให้เลือก
     */
    if (partyData) renderVerify();
  });
}

function renderVerify() {
  var scanned = items.filter(function (it) { return got.has(String(it.ref_no).trim().toUpperCase()); });
  var done = scanned.filter(function (it) { return verifyState[keyOf(it.ref_no)]; }).length;

  /* สรุปให้เห็นก่อนกดยืนยัน ว่าชุดนี้ครบไหม ขาดใบไหน เกินใบไหน
     ถ้าไม่บอก คนจะกดยืนยันโดยไม่รู้ว่าขาด แล้วไปพบทีหลังว่าตามไม่ได้ */
  var missing = items.filter(function (it) {
    return !got.has(String(it.ref_no).trim().toUpperCase());
  });

  $('vhCount').textContent = 'ตรวจแล้ว ' + done + ' จาก ' + scanned.length + ' ใบ' +
    (done < scanned.length ? ' — ต้องตรวจให้ครบก่อนยืนยัน' : ' ✓');
  /* กดได้เมื่อตรวจครบทุกใบที่ยิงมา
     ใบที่ขาดไม่นับ เพราะไม่ได้อยู่ในมือให้ตรวจ */
  $('btnFinish').disabled = scanned.length > 0 && done < scanned.length;

  renderSummary(scanned, missing);

  $('vlist').innerHTML = scanned.map(vrowHtml).join('');

  $('vlist').querySelectorAll('[data-pass]').forEach(function (b) {
    b.addEventListener('click', function () {
      verifyState[keyOf(b.dataset.pass)] = 'pass';
      renderVerify();
    });
  });
  $('vlist').querySelectorAll('[data-fix]').forEach(function (b) {
    b.addEventListener('click', function () {
      verifyState[keyOf(b.dataset.fix)] = 'fix';
      renderVerify();
    });
  });
  $('vlist').querySelectorAll('[data-save]').forEach(function (b) {
    b.addEventListener('click', function () { saveFix(b.dataset.save); });
  });

  /* ยกเลิกการแก้ — กลับไปสถานะยังไม่ตรวจ
     ไม่ใช่ทำเครื่องหมายว่าผ่าน เพราะยังไม่ได้ตรวจจริง */
  $('vlist').querySelectorAll('[data-cancelfix]').forEach(function (b) {
    b.addEventListener('click', function () {
      delete verifyState[keyOf(b.dataset.cancelfix)];
      renderVerify();
    });
  });

  installCombos();
}

/** สรุปผลการยิง — ครบไหม ขาดใบไหน เกินใบไหน */
function renderSummary(scanned, missing) {
  var box = $('vSummary');
  if (!box) return;

  var parts = [];

  parts.push('<div class="sm-it ok"><b>ยิงแล้ว ' + scanned.length + ' ใบ</b>' +
    ' จากที่ต้นทางส่งมา ' + items.length + ' ใบ</div>');

  if (missing.length) {
    parts.push('<div class="sm-it bad"><b>ขาด ' + missing.length + ' ใบ</b>' +
      '<div class="sm-l">' +
      missing.map(function (m) {
        return esc(m.barcode || m.ref_no);
      }).join(' · ') + '</div>' +
      '<div class="sm-n">ใบเหล่านี้จะกลับไปเป็นค้างที่ต้นทาง เพื่อให้มีคนตามต่อ</div>' +
    '</div>');
  }

  if (extra.length) {
    parts.push('<div class="sm-it warn"><b>ไม่อยู่ในชุดนี้ ' + extra.length + ' ใบ</b>' +
      '<div class="sm-l">' + extra.map(esc).join(' · ') + '</div>' +
      '<div class="sm-n">รับไว้แล้วและบันทึกว่ามาผิดชุด ' +
      'ถ้าใบไหนไม่มีในระบบเลย จะแจ้งหลังกดยืนยัน</div>' +
    '</div>');
  }

  if (!missing.length && !extra.length) {
    parts.push('<div class="sm-it ok">ครบถ้วนตรงตามชุด ไม่มีขาดไม่มีเกิน</div>');
  }

  /* ให้ปลายทางเขียนถึงต้นทางได้ เช่นเอกสารเปียก ตราประทับจาง
     สิ่งที่ระบบตรวจไม่ได้แต่คนเห็นกับตา */
  if (missing.length || extra.length) {
    parts.push('<div class="sm-it">' +
      '<b>แจ้งกลับต้นทาง</b>' +
      '<input id="recvNote" placeholder="เช่น เอกสาร 2 ใบเปียก อ่านเลขไม่ออก" ' +
        'value="' + esc(recvNote) + '" style="margin-top:6px">' +
    '</div>');
  }

  box.innerHTML = parts.join('');

  var nEl = $('recvNote');
  if (nEl) nEl.addEventListener('input', function () { recvNote = nEl.value; });
}

function vrowHtml(it) {
  var st = verifyState[keyOf(it.ref_no)] || '';

  var data = FIX_FIELDS.map(function (f) {
    var v = it[f.k];
    if (f.type === 'date' && v) v = fmtDay(v);
    return [f.label, v];
  }).map(function (p) {
    return '<div><div class="vd-k">' + esc(p[0]) + '</div>' +
           '<div class="vd-v">' + esc(p[1] || '—') + '</div></div>';
  }).join('');

  var edit = st === 'fix' ? editHtml(it) : '';

  return '<div class="vrow ' + st + '">' +
    '<div class="vr-top">' +
      '<div>' +
        '<div class="vr-ref">' + esc(it.ref_no) + '</div>' +
        '<div class="vr-bc">บาร์โค้ด ' + esc(it.barcode || '—') + '</div>' +
      '</div>' +
      (st === 'pass' ? '<span class="tag ok">ตรวจแล้ว ตรงกัน</span>' : '') +
      (st === 'fix' ? '<span class="tag warn">กำลังแก้</span>' : '') +
      '<div class="vr-act">' +
        /* ลิงก์ไฟล์สแกน เปิดแท็บใหม่เพื่อไม่ให้เสียการตรวจที่ค้างอยู่
           ไม่มีไฟล์ก็ไม่แสดงปุ่ม ดีกว่าปุ่มที่กดแล้วไม่เกิดอะไร */
        (it.pdf_url
          ? '<a class="btn ghost sm" href="' + esc(it.pdf_url) + '" ' +
            'target="_blank" rel="noopener">ดูไฟล์</a>' : '') +
        (st === 'pass' ? '' :
          '<button class="btn sm" data-pass="' + esc(it.ref_no) + '">ตรงกัน ✓</button>') +
        (st === 'fix' ? '' :
          '<button class="btn ghost sm" data-fix="' + esc(it.ref_no) + '">ไม่ตรง — แก้</button>') +
      '</div>' +
    '</div>' +
    '<div class="vr-data">' + data + '</div>' +
    edit +
  '</div>';
}

function editHtml(it) {
  var f = FIX_FIELDS.map(function (x) {
    var v = it[x.k] || '';
    if (x.type === 'date' && v) v = fmtDateInput(v);

    /* ช่องธรรมดา หรือรายชื่อยังโหลดไม่เสร็จ
       ให้พิมพ์ไปก่อนได้ ดีกว่าค้างรอ */
    if (!x.list || !partyData) {
      return '<div>' +
        '<label>' + esc(x.label) + '</label>' +
        '<input data-ref="' + esc(it.ref_no) + '" data-f="' + x.k + '" ' +
          (x.type === 'date' ? 'placeholder="วว/ดด/ปปปป" ' : '') +
          'value="' + esc(v) + '">' +
      '</div>';
    }

    /* ช่องที่มีรายการ ใช้ dropdown จริง ไม่ใช่ช่องพิมพ์อิสระ
     *
     * เลือก "ไม่มีในรายการ" ถึงจะพิมพ์เองได้
     * และระบบจะทำเครื่องหมายไว้ว่าค่านี้คนพิมพ์เอง
     * เพื่อให้ตรวจก่อนนำไปใช้จริงว่าชื่อถูกต้องหรือแค่ยังไม่มีในทะเบียน
     */
    /* ช่องค้นหา — พิมพ์กรองรายการได้ ไม่ต้องเลื่อนหาในพันกว่ารายการ
     *
     * ยังแยกได้ว่าเลือกจากรายการหรือพิมพ์เอง
     * เพราะการเลือกจะตั้งค่าใน data-picked ส่วนการพิมพ์ไม่ตั้ง
     */
    /* ใช้ datalist ของเบราว์เซอร์
     *
     * เคยเขียนเมนูเองแล้วเจอปัญหาวาดไม่ขึ้นซึ่งหาสาเหตุไม่พบ
     * datalist เบราว์เซอร์วาดให้เอง อยู่นอกโครงหน้าทั้งหมด
     * จึงไม่มีทางถูกตัดหรือถูกบัง และพิมพ์กรองได้ในตัว
     *
     * ยังแยกได้ว่าเลือกจากรายการหรือพิมพ์เอง
     * เพราะตอนบันทึกเทียบค่ากับรายการเต็มอยู่แล้ว
     */
    var opts = listOf(x.list);
    var inList = !v || !!opts.known[v];
    var listId = 'dl-' + x.list;

    return '<div class="cbo">' +
      '<label>' + esc(x.label) + '</label>' +
      '<input class="cbo-in" data-ref="' + esc(it.ref_no) + '" ' +
        'data-sel="' + x.k + '" ' +
        'data-list="' + esc(x.list) + '" ' +
        (x.pairCode ? 'data-paircode="' + x.pairCode + '" ' : '') +
        'list="' + listId + '" autocomplete="off" ' +
        'placeholder="พิมพ์เพื่อค้น หรือพิมพ์เอง" ' +
        'value="' + esc(v) + '">' +
      (inList ? '' :
        '<div class="cbo-warn">พิมพ์เอง — ไม่มีในรายการ</div>') +
    '</div>';
  }).join('');

  return '<div class="vr-edit">' +
    '<div class="hint" style="margin-bottom:9px">' +
      'แก้ตามเอกสารตัวจริง — ระบบจะบันทึกว่าใครแก้และแก้จากอะไร</div>' +
    '<div class="eg">' + f + '</div>' +
    '<button class="btn sm" data-save="' + esc(it.ref_no) + '">บันทึกการแก้ไข</button>' +
    /* ต้องมีทางถอย คนกดผิดแล้วติดอยู่ในโหมดแก้ไม่ได้ */
    '<button class="btn ghost sm" data-cancelfix="' + esc(it.ref_no) + '" ' +
      'style="margin-left:7px">ยกเลิก</button>' +
  '</div>';
}

/* ---------- ช่องค้นหา ---------- */
/* พิมพ์แล้วกรองรายการทันที ไม่ต้องเลื่อนหาในพันกว่ารายการ
   เลือกจากเมนูถือว่า "เลือก" พิมพ์แล้วไม่เลือกถือว่า "พิมพ์เอง" */

/* สร้างรายการครั้งเดียวต่อการเปิดหน้า
 *
 * 625 รายการต้องต่อสตริงและให้เบราว์เซอร์ parse ~20-50 ms
 * ถ้าสร้างใหม่ทุกครั้งที่วาดแถว จะช้าสะสม
 * เพราะกด "ตรงกัน" ทีละใบ 40 ใบ = สร้างใหม่ 40 รอบ
 *
 * รายการไม่เปลี่ยนระหว่างใช้งาน จึงสร้างครั้งเดียวพอ
 */
var datalistsBuilt = false;

function buildDatalists() {
  if (datalistsBuilt || !partyData) return;

  ['parties', 'transporters'].forEach(function (kind) {
    var id = 'dl-' + kind;
    if (document.getElementById(id)) return;

    var opts = listOf(kind);
    if (!opts.length) return;

    var dl = document.createElement('datalist');
    dl.id = id;
    dl.innerHTML = opts.map(function (o) {
      /* value คือค่าที่จะถูกกรอกลงช่อง ต้องเป็นชื่อล้วน
         label แสดงประกอบให้เห็นรหัสด้วย */
      return '<option value="' + esc(o.value) + '">' +
             esc(o.label) + '</option>';
    }).join('');
    document.body.appendChild(dl);
  });

  datalistsBuilt = true;
  console.log('[DocScan] สร้างรายการแล้ว');
}

function installCombos() {
  buildDatalists();

  var els = $('vlist').querySelectorAll('.cbo-in');
  console.log('[DocScan] ติดตั้งช่องค้นหา', els.length, 'ช่อง',
    'รายชื่อ', partyData ? (partyData.parties || []).length : 'ยังไม่มา');

  els.forEach(function (el) {
    var box = el.parentNode;

    function sync() {
      var opts = listOf(el.dataset.list);
      var v = el.value.trim();
      var known = !v || !!opts.known[v];

      // เตือนว่าค่านี้ไม่มีในรายการ ต้องตรวจก่อนนำไปใช้
      var w = box.querySelector('.cbo-warn');
      if (known) { if (w) w.remove(); }
      else if (!w) {
        w = document.createElement('div');
        w.className = 'cbo-warn';
        w.textContent = 'พิมพ์เอง — ไม่มีในรายการ';
        box.appendChild(w);
      }

      /* เลือกชื่อคู่ค้าแล้วเติมรหัสให้เอง
         คนจำรหัสไม่ได้อยู่แล้ว และกรอกเองมีโอกาสผิด */
      if (known && v && el.dataset.paircode && partyData) {
        var p = (partyData.parties || []).find(function (x) { return x.name === v; });
        if (p && p.code) {
          var codeEl = $('vlist').querySelector(
            '[data-ref="' + el.dataset.ref + '"][data-f="' + el.dataset.paircode + '"]');
          if (codeEl && codeEl.value !== p.code) {
            codeEl.value = p.code;
            codeEl.classList.add('changed');
          }
        }
      }
    }

    el.addEventListener('input', sync);
    el.addEventListener('change', sync);
    el.addEventListener('blur', sync);
  });
}


/* เก็บผลไว้ เพราะ sync() เรียกทุกครั้งที่กดแป้น
   ถ้าสร้าง array 530 ตัวใหม่ทุกตัวอักษร จะหน่วงเห็นได้ */
var _listCache = {};

/** รายการตัวเลือกของแต่ละช่อง */
function listOf(kind) {
  if (!partyData) return [];
  if (_listCache[kind]) return _listCache[kind];
  var out;
  if (kind === 'parties') {
    out = (partyData.parties || []).map(function (p) {
      // แสดงรหัสประกอบ เพราะรหัสซ้ำกันได้ระหว่างสาขา
      return { value: p.name, label: p.code ? p.code + ' — ' + p.name : p.name };
    });
  } else {
    out = (partyData[kind] || []).map(function (x) {
      return { value: x, label: x };
    });
  }

  /* เก็บชุดชื่อไว้ด้วย เพื่อตรวจว่ารู้จักไหมโดยไม่ต้องวนทั้ง array
     การวน 530 ตัวทุกครั้งที่กดแป้นทำให้พิมพ์แล้วหน่วง */
  out.known = {};
  out.forEach(function (o) { out.known[o.value] = 1; });

  _listCache[kind] = out;
  return out;
}

/* ช่องกรอกวันที่ใช้รูปแบบ dd/mm/yyyy
   เดิมใช้ <input type="date"> ซึ่งแสดงตามภาษาของเครื่อง
   เครื่องภาษาอังกฤษจะขึ้น mm/dd/yyyy แล้วคนไทยอ่านสลับ */
function fmtDateInput(v) {
  var d = new Date(v);
  if (isNaN(d.getTime())) return '';
  var p = function (x) { return (x < 10 ? '0' : '') + x; };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
}

/** dd/mm/yyyy → yyyy-mm-dd ก่อนส่งเซิร์ฟเวอร์ */
function toIsoDate(v) {
  var t = String(v || '').trim();
  if (!t) return '';
  var m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return t;
  var y = Number(m[3]);
  // ปีไทยแปลงเป็นสากล ไม่งั้นจะกลายเป็นปี 2600 กว่า
  if (y > 2400) y -= 543;
  var p = function (x) { return x.length < 2 ? '0' + x : x; };
  return y + '-' + p(m[2]) + '-' + p(m[1]);
}

async function saveFix(ref) {
  var it = items.find(function (x) { return x.ref_no === ref; });
  if (!it) return;

  var fields = {};
  var typed = [];      // ช่องที่คนพิมพ์เอง ไม่ได้เลือกจากรายการ
  var changed = 0;

  /* อ่านจาก dropdown ก่อน ถ้าเลือก "ไม่มีในรายการ" ค่อยเอาจากช่องพิมพ์
     และจำไว้ว่าช่องไหนพิมพ์เอง เพื่อให้ตรวจย้อนหลังได้ว่า
     ชื่อนั้นถูกต้องจริง หรือแค่ยังไม่มีในทะเบียน */
  var rowBox = $('vlist').querySelectorAll('[data-ref="' + ref + '"]');
  var picked = {};

  rowBox.forEach(function (el) {
    if (el.dataset.sel) {
      var v = el.value.trim();
      if (!v) return;
      picked[el.dataset.sel] = v;

      /* ไม่ได้เลือกจากเมนู และค่านั้นไม่มีในรายการ = พิมพ์เอง
         ต้องบันทึกไว้ให้ตรวจก่อนนำไปใช้จริง */
      var opts = listOf(el.parentNode.dataset.list);
      if (!opts.known[v]) typed.push(el.dataset.sel);

    } else if (el.dataset.f) {
      picked[el.dataset.f] = el.value.trim();
    }
  });

  Object.keys(picked).forEach(function (k) {
    var was = String(it[k] || '');
    var fd = FIX_FIELDS.find(function (f) { return f.k === k; });
    if (fd && fd.type === 'date' && was) was = fmtDateInput(was);
    if (picked[k] === was.trim()) return;
    /* ส่งวันที่เป็นรูปแบบสากล ไม่ใช่ dd/mm/yyyy ที่คนกรอก
       ไม่งั้นชีตจะตีความผิดว่าเดือนคือวัน */
    fields[k] = (fd && fd.type === 'date') ? toIsoDate(picked[k]) : picked[k];
    changed++;
  });

  if (!changed) { alert('ยังไม่ได้แก้อะไร'); return; }

  var reason = prompt('แก้ ' + changed + ' ช่องของ ' + ref + '\n\n' +
    'ระบุเหตุผลสั้น ๆ (เช่น เอกสารจริงระบุจำนวน 9 ไม่ใช่ 7)');
  if (reason === null) return;

  try {
    var r = await call('docFixOnReceive',
      { ref_no: ref, fields: fields, reason: reason.trim(),
        typed_fields: typed }, 60000);
    if (!r || r.status !== 'ok') { alert((r && r.message) || 'แก้ไม่สำเร็จ'); return; }

    // อัปข้อมูลในหน้าให้ตรงกับที่บันทึกไป
    Object.keys(fields).forEach(function (k) { it[k] = fields[k]; });
    verifyState[keyOf(ref)] = 'pass';
    renderVerify();
    toast('แก้ ' + ref + ' แล้ว');
  } catch (e) {
    alert('แก้ไม่สำเร็จ: ' + (e.message || e));
  }
}

$('btnAllPass').addEventListener('click', function () {
  var scanned = items.filter(function (it) { return got.has(String(it.ref_no).trim().toUpperCase()); });
  var left = scanned.filter(function (it) { return !verifyState[keyOf(it.ref_no)]; });
  if (!left.length) return;

  /* ถามก่อนเสมอ เพราะการกดผ่านรวดเดียวคือการรับรองว่าดูครบทุกใบแล้ว
     ถ้าไม่ได้ดูจริงแล้วข้อมูลผิด จะไปพบตอนที่แก้ยากกว่ามาก */
  if (!confirm('ยืนยันว่าตรวจเอกสารจริงครบ ' + left.length + ' ใบแล้ว\n' +
      'และข้อมูลในระบบตรงกับเอกสารทุกใบ')) return;

  left.forEach(function (it) { verifyState[keyOf(it.ref_no)] = 'pass'; });
  renderVerify();
});

$('btnFinish').addEventListener('click', async () => {
  if (!batch) return;

  const missing = items.filter(it => !got.has(it.ref_no.toUpperCase()));

  /* บอกให้ชัดว่าใบที่ขาดจะไปไหนต่อ
     ไม่ใช่แค่ถามว่าแน่ใจไหม ซึ่งไม่ช่วยให้ตัดสินใจได้ */
  let msg = 'จบการรับชุด ' + batch.batch_id + '\n\n' +
            'รับแล้ว ' + got.size + ' ใบ';
  if (extra.length) msg += '\nไม่อยู่ในชุดแต่รับไว้ ' + extra.length + ' ใบ';
  if (missing.length) {
    msg += '\n\nไม่มาในชุดนี้ ' + missing.length + ' ใบ:\n' +
           missing.slice(0, 10).map(m => '  ' + m.ref_no).join('\n') +
           (missing.length > 10 ? '\n  และอีก ' + (missing.length - 10) : '') +
           '\n\nใบเหล่านี้จะกลับไปเป็นค้างที่ต้นทาง เพื่อให้มีคนตามต่อ';
  }
  if (!confirm(msg)) return;

  const btn = $('btnFinish');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try {
    const r = await call('shipReceiveBatch', {
      batch_id: batch.batch_id,
      received: [...got].concat(extra),
      note: recvNote.trim()
    }, 120000);

    if (r.status !== 'ok') { alert(r.message || 'บันทึกไม่สำเร็จ'); return; }

    let done = 'บันทึกแล้ว\n\nรับ ' + r.received + ' ใบ';
    if (r.extra && r.extra.length) done += '\nไม่อยู่ในชุด ' + r.extra.length + ' ใบ';
    if (r.extra_not_found && r.extra_not_found.length) {
      done += '\nไม่พบในระบบ ' + r.extra_not_found.length + ' ใบ: ' +
              r.extra_not_found.slice(0, 5).join(', ');
    }
    if (r.missing && r.missing.length) {
      done += '\nส่งกลับไปค้างที่ต้นทาง ' + r.missing_marked + ' ใบ';
    }
    alert(done);
    reset();
  } catch (e) {
    alert('บันทึกไม่สำเร็จ: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = 'จบการรับ';
  }
});

$('btnCancel').addEventListener('click', () => {
  if (got.size || extra.length) {
    if (!confirm('ยกเลิกชุดนี้\n\nที่ยิงไปแล้ว ' + (got.size + extra.length) +
                 ' ใบจะไม่ถูกบันทึก')) return;
  }
  reset();
});

function reset() {
  batch = null; items = []; got.clear(); extra.length = 0;
  $('batchArea').style.display = 'none';
  $('actBar').style.display = 'none';
  $('scanBox').classList.remove('done');
  $('scanLabel').textContent = '① ยิงบาร์โค้ดบนใบปะหน้า';
  $('scanInput').placeholder = 'B26082701';
  $('scopeInfo').textContent = 'ยิงบาร์โค้ดบนใบปะหน้าเพื่อเริ่ม';
  keepFocus();
}

keepFocus();

/* เปิดชุดให้เลยถ้ามาจากหน้าชุดที่จะมาถึง
   คนกดปุ่มรับเอกสารแล้วไม่ต้องยิงใบปะหน้าซ้ำ */
try {
  var qsBatch = new URLSearchParams(location.search).get('b');
  if (qsBatch) openBatch(qsBatch.trim().toUpperCase());
} catch (e) {
  console.error('[DocScan] เปิดชุดจากลิงก์ไม่สำเร็จ', e);
}

</script>
