<style>/* กล่องแจ้งข้อผิดพลาด ต้องมีเสมอ

.tabs{display:flex;gap:7px;flex-wrap:wrap}

<script type="module">

import { authFetch, requireAuth, installNav, guardPage, logout } from './js/auth.js?v=2.15.1';
import { STAGES, REASON_GROUPS, reasonsFor, actionOf } from './js/stages.js?v=2.15.1';

const API = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);

const session = requireAuth();
if (session) {
  if (!guardPage(session)) throw new Error('no access');
  installNav(session, { onLogout: () => logout(API) });
  $('who').textContent = session.empName || session.empId || '';
  $('whoSite').textContent = session.site || '';
}

async function call(action, payload = {}, timeoutMs) {
  try {
    return await authFetch(API, { action, ...payload },
      timeoutMs ? { timeoutMs } : undefined);
  } catch (err) {
    if (err.code === 'auth_required') { alert('เซสชันหมดอายุ'); location.href = 'login.html'; }
    throw err;
  }
}

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' });
}

/* ---------- สถานะหน้า ---------- */
let allRows = [], summary = {}, curStage = 'all';
const selected = new Set();

const STAGE_LABEL = {};
STAGES.forEach(s => { STAGE_LABEL[s.key] = s; });

const LEVEL = {
  over:     { label: 'เกินกำหนด', cls: 'bad' },
  critical: { label: 'ใกล้ครบ',   cls: 'warn' },
  warn:     { label: 'เฝ้าระวัง', cls: 'warn' },
  ok:       { label: 'ปกติ',      cls: 'ok' }
};

/* ---------- โหลด ---------- */
async function load() {
  $('view').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  try {
    const r = await call('docsFollowup', {}, 60000);
    if (r.status !== 'ok') throw new Error(r.message || 'โหลดไม่สำเร็จ');

    allRows = r.rows || [];
    summary = r.summary || {};
    selected.clear();

    $('scopeInfo').textContent = r.scope === 'all'
      ? 'ดูได้ทุกไซต์' : ('เฉพาะไซต์ ' + (r.scope || '—'));

    renderCards();
    renderTabs();
    render();
    if (r.truncated) {
      showAlert('แสดง 500 รายการแรกจากทั้งหมด ' + r.total + ' รายการ');
    }
  } catch (e) {
    $('view').innerHTML = '';
    showAlert('โหลดไม่สำเร็จ: ' + (e.message || e));
  }
}

function showAlert(m) {
  $('alert').textContent = m;
  $('alert').className = 'alert bad on';
}

/* ---------- สรุปด้านบน ---------- */
function renderCards() {
  const over = allRows.filter(r => r.level === 'over').length;
  const crit = allRows.filter(r => r.level === 'critical').length;
  const answered = allRows.filter(r => r.reason).length;

  /* ตัวเลขที่ต้องเห็นก่อนคือ "เกินกำหนดแล้วกี่ใบ"
     ไม่ใช่ยอดรวม เพราะยอดรวมไม่บอกว่าต้องทำอะไร */
  $('cards').innerHTML = `
    <div class="card bad">
      <div class="cnum">${over}</div>
      <div class="clab">เกินกำหนดแล้ว</div>
    </div>
    <div class="card warn">
      <div class="cnum">${crit}</div>
      <div class="clab">ใกล้ครบกำหนด</div>
    </div>
    <div class="card">
      <div class="cnum">${allRows.length}</div>
      <div class="clab">ค้างทั้งหมด</div>
    </div>
    <div class="card ok">
      <div class="cnum">${answered}</div>
      <div class="clab">ระบุเหตุผลแล้ว</div>
    </div>`;
}

/* ---------- แท็บตามขั้นตอน ---------- */
function renderTabs() {
  const counts = { all: allRows.length };
  allRows.forEach(r => { counts[r.stage] = (counts[r.stage] || 0) + 1; });

  const tabs = [{ key: 'all', label: 'ทั้งหมด' }]
    .concat(STAGES.filter(s => !s.optional && counts[s.key])
      .map(s => ({ key: s.key, label: s.label, owner: s.ownerLabel })));

  if (!counts[curStage]) curStage = 'all';

  $('tabs').innerHTML = tabs.map(t =>
    `<button class="tab${curStage === t.key ? ' on' : ''}" data-s="${t.key}">
       ${esc(t.label)}<b>${counts[t.key] || 0}</b>
     </button>`).join('');

  $('tabs').querySelectorAll('[data-s]').forEach(el =>
    el.addEventListener('click', () => { curStage = el.dataset.s; renderTabs(); render(); }));
}

/* ---------- ตาราง ---------- */
function shown() {
  return curStage === 'all' ? allRows : allRows.filter(r => r.stage === curStage);
}

function render() {
  const rows = shown();
  $('cnt').textContent = rows.length + ' รายการ';

  if (!rows.length) {
    $('view').innerHTML = '<div class="empty">ไม่มีเอกสารค้างในกลุ่มนี้</div>';
    updateSelBar();
    return;
  }

  $('view').innerHTML = '<div class="tw"><table><thead><tr>' +
    '<th style="width:34px"><input type="checkbox" class="chk" id="selAll"></th>' +
    '<th style="width:150px">Reference</th>' +
    '<th style="width:190px">ค้างที่ขั้น</th>' +
    '<th style="width:96px">ค้างมาแล้ว</th>' +
    '<th>ปลายทาง</th>' +
    '<th style="width:230px">เหตุผลที่ระบุไว้</th>' +
    '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table></div>';

  $('view').querySelectorAll('.rowchk').forEach(cb =>
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(cb.dataset.ref); else selected.delete(cb.dataset.ref);
      updateSelBar();
    }));

  $('selAll').addEventListener('change', () => {
    const on = $('selAll').checked;
    rows.forEach(r => { if (on) selected.add(r.ref_no); else selected.delete(r.ref_no); });
    $('view').querySelectorAll('.rowchk').forEach(cb => { cb.checked = on; });
    updateSelBar();
  });

  updateSelBar();
}

function rowHtml(r) {
  const st = STAGE_LABEL[r.stage] || { label: r.stage, ownerLabel: '' };
  const lv = LEVEL[r.level] || LEVEL.ok;

  const age = r.days == null ? '—'
    : `<b class="${lv.cls}">${r.days} วัน</b>` +
      (r.due ? `<div class="sub">กำหนด ${r.due} วัน</div>` : '');

  const reason = r.reason
    ? `<div class="rtag">${esc(r.reason_label || r.reason)}</div>` +
      `<div class="sub">${esc(r.reason_by || '')} · ${fmt(r.reason_at)}` +
      (r.snooze_until ? ` · ถามใหม่ ${fmt(r.snooze_until)}` : '') + '</div>' +
      (r.reason_note ? `<div class="sub note">${esc(r.reason_note)}</div>` : '')
    : '<span class="sub">ยังไม่ได้ระบุ</span>';

  return `<tr class="lv-${r.level}">
    <td><input type="checkbox" class="chk rowchk" data-ref="${esc(r.ref_no)}"${
      selected.has(r.ref_no) ? ' checked' : ''}></td>
    <td><div class="ref">${esc(r.ref_no)}</div>
        <div class="sub">${fmt(r.doc_date)}</div></td>
    <td>${esc(st.label)}<div class="sub">${esc(st.ownerLabel || '')}</div></td>
    <td>${age}</td>
    <td>${esc(r.dest_warehouse || r.transfer_to || '—')}
        <div class="sub">${esc(r.site || '')}</div></td>
    <td>${reason}</td>
  </tr>`;
}

/* ---------- เลือกหลายรายการ ---------- */
function updateSelBar() {
  const n = selected.size;
  $('selBar').classList.toggle('on', n > 0);
  $('selCount').textContent = 'เลือก ' + n + ' รายการ';
  const all = $('selAll');
  if (all) {
    const rows = shown();
    const k = rows.filter(r => selected.has(r.ref_no)).length;
    all.checked = k > 0 && k === rows.length;
    all.indeterminate = k > 0 && k < rows.length;
  }
}

$('btnSelNone').addEventListener('click', () => {
  selected.clear();
  $('view').querySelectorAll('.rowchk').forEach(cb => { cb.checked = false; });
  updateSelBar();
});

/* ---------- ระบุเหตุผล ---------- */
let pickedReason = null;

$('btnReason').addEventListener('click', () => {
  const refs = [...selected];
  if (!refs.length) return;

  /* เหตุผลที่เลือกได้ขึ้นกับขั้นที่ค้าง
     ถ้าเลือกข้ามขั้นมา จะไม่รู้ว่าควรแสดงชุดไหน จึงต้องให้เลือกทีละขั้น */
  const stages = new Set(allRows.filter(r => selected.has(r.ref_no)).map(r => r.stage));
  if (stages.size > 1) {
    alert('เลือกข้ามขั้นตอนอยู่ ' + stages.size + ' ขั้น\n\n' +
          'เหตุผลของแต่ละขั้นไม่เหมือนกัน กรุณาเลือกทีละขั้น\n' +
          'กดแท็บด้านบนเพื่อกรองก่อน');
    return;
  }

  const stage = [...stages][0];
  const st = STAGE_LABEL[stage] || {};
  pickedReason = null;

  $('rsSub').textContent = refs.length + ' รายการ · ค้างที่ "' +
    (st.label || stage) + '" · ผู้รับผิดชอบ ' + (st.ownerLabel || '—');

  $('rsGroups').innerHTML = reasonsFor(stage).map(g => `
    <div class="rs-g">
      <div class="rs-gl ${g.color}">${esc(g.label)}</div>
      ${g.reasons.map(r => `
        <button class="rs-r" data-r="${esc(r.key)}" data-a="${esc(r.action)}"
                data-g="${esc(g.key)}" data-l="${esc(r.label)}">
          ${esc(r.label)}
        </button>`).join('')}
    </div>`).join('');

  $('rsGroups').querySelectorAll('[data-r]').forEach(b =>
    b.addEventListener('click', () => {
      $('rsGroups').querySelectorAll('[data-r]').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      pickedReason = { reason: b.dataset.r, action: b.dataset.a,
                       group: b.dataset.g, label: b.dataset.l, stage };
      $('rsSnoozeBox').style.display = b.dataset.a === 'snooze' ? '' : 'none';
      $('rsEffect').textContent = effectText(b.dataset.a);
      $('rsSave').disabled = false;
    }));

  $('rsNote').value = '';
  $('rsEffect').textContent = '';
  $('rsSave').disabled = true;
  $('dlgReason').showModal();
});

/** บอกล่วงหน้าว่าเลือกแล้วจะเกิดอะไร ไม่ให้เดา */
function effectText(action) {
  if (action === 'close')   return 'จะปิดเอกสารนี้ ไม่นับใน SLA อีก';
  if (action === 'snooze')  return 'จะซ่อนไว้จนถึงวันที่กำหนด แล้วกลับมาถามใหม่';
  if (action === 'fix')     return 'จะขึ้นในรายการที่ต้องแก้ข้อมูลย้อนหลัง';
  if (action === 'reissue') return 'จะขึ้นในรายการที่ต้องขอเอกสารใหม่';
  return '';
}

$('rsClose').addEventListener('click', () => $('dlgReason').close());
$('rsCancel').addEventListener('click', () => $('dlgReason').close());

$('rsSave').addEventListener('click', async () => {
  if (!pickedReason) return;
  const refs = [...selected];
  const btn = $('rsSave');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';

  try {
    const r = await call('docsSetException', {
      refs,
      stage: pickedReason.stage,
      reason: pickedReason.reason,
      reason_label: pickedReason.label,
      group: pickedReason.group,
      action: pickedReason.action,
      note: $('rsNote').value.trim(),
      snooze_days: Number($('rsSnooze').value) || 7
    }, 60000);

    if (r.status !== 'ok') { alert(r.message || 'บันทึกไม่สำเร็จ'); return; }

    $('dlgReason').close();
    let msg = 'บันทึก ' + r.saved + ' รายการ';
    if (r.closed) msg += ' · ปิดเอกสาร ' + r.closed + ' ใบ';
    alert(msg);
    await load();
  } catch (e) {
    alert('บันทึกไม่สำเร็จ: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = 'บันทึก';
  }
});

/* ---------- ส่งออก ---------- */
$('btnExcel').addEventListener('click', async () => {
  const rows = shown();
  if (!rows.length) { alert('ไม่มีข้อมูลให้ส่งออก'); return; }

  if (!window.XLSX) {
    try { await loadScript('vendor/xlsx.full.min.js'); }
    catch (e) { alert('โหลดตัวสร้างไฟล์ Excel ไม่ได้'); return; }
  }

  const COLS = [
    ['ref_no', 'Reference'], ['barcode', 'บาร์โค้ด'], ['doc_date', 'วันที่เอกสาร'],
    ['stage_label', 'ค้างที่ขั้น'], ['owner_label', 'ผู้รับผิดชอบ'],
    ['days', 'ค้างมาแล้ว (วัน)'], ['due', 'กำหนด (วัน)'], ['over', 'เกินมา (วัน)'],
    ['site', 'ไซต์'], ['dest_warehouse', 'ปลายทาง'],
    ['reason_label', 'เหตุผล'], ['reason_note', 'หมายเหตุ'],
    ['reason_by', 'ผู้ระบุ'], ['reason_at', 'ระบุเมื่อ']
  ];

  const body = rows.map(r => {
    const st = STAGE_LABEL[r.stage] || {};
    const o = { ...r, stage_label: st.label || r.stage, owner_label: st.ownerLabel || '' };
    return COLS.map(c => o[c[0]] == null ? '' : o[c[0]]);
  });

  const ws = XLSX.utils.aoa_to_sheet([COLS.map(c => c[1])].concat(body));
  ws['!cols'] = COLS.map((c, i) => {
    const len = Math.max(c[1].length, ...body.map(r => String(r[i] || '').length));
    return { wch: Math.min(Math.max(len + 2, 9), 40) };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'เอกสารค้าง');
  XLSX.writeFile(wb, 'followup-' + new Date().toISOString().slice(0, 10) + '.xlsx');
});

function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = rej;
    document.head.appendChild(el);
  });
}

$('btnReload').addEventListener('click', load);
load();
</script>
