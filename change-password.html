<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DocScan — เปลี่ยนรหัสผ่าน</title>
<script src="config.js?v=2.14.0"></script>
<link rel="stylesheet" href="css/auth.css?v=2.14.0">
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5">
        <rect x="3" y="4" width="3" height="16" rx="1"/><rect x="8" y="4" width="1.5" height="16" rx="0.5"/>
        <rect x="11" y="4" width="3" height="16" rx="1"/><rect x="16" y="4" width="1.5" height="16" rx="0.5"/>
        <rect x="19" y="4" width="2" height="16" rx="1"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">DocScan</div>
      <div class="brand-sub">Pallet Tracking System</div>
    </div>
  </div>

  <div class="box">
    <div class="alert" id="alert"></div>

    <div class="stage on" id="stage1">
      <div class="box-title">เปลี่ยนรหัสผ่าน</div>
      <div class="box-sub" id="who"></div>

      <div class="alert info" id="forced">
        นี่เป็นรหัสผ่านที่ผู้ดูแลตั้งให้ กรุณาตั้งรหัสใหม่ก่อนเริ่มใช้งาน
      </div>

      <div class="field">
        <label class="label" for="oldPw">รหัสผ่านเดิม</label>
        <input class="input" id="oldPw" type="password" autocomplete="current-password"
               placeholder="กรอกรหัสผ่านเดิม">
      </div>

      <div class="divider"></div>

      <div class="field">
        <label class="label" for="password">รหัสผ่านใหม่</label>
        <input class="input" id="password" type="password" autocomplete="new-password"
               placeholder="อย่างน้อย 8 ตัว มีตัวอักษรและตัวเลข">
        <div class="pw-meter" id="pwMeter"><i></i></div>
        <div class="pw-hint" id="pwHint">ต้องยาวอย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข</div>
      </div>
      <div class="field">
        <label class="label" for="password2">ยืนยันรหัสผ่านใหม่</label>
        <input class="input" id="password2" type="password" autocomplete="new-password"
               placeholder="พิมพ์รหัสผ่านอีกครั้ง">
        <div class="err" id="e_password"></div>
      </div>

      <button class="submit-btn" id="btnSave" disabled>บันทึกรหัสผ่านใหม่ →</button>
      <div class="links" id="skipLinks">
        <a class="link" id="backLink" href="batch.html">← กลับหน้าหลัก</a>
      </div>
    </div>

    <div class="stage" id="stage2">
      <div class="box-title">เปลี่ยนรหัสผ่านเรียบร้อย</div>
      <div class="box-sub">ครั้งต่อไปให้เข้าสู่ระบบด้วยรหัสผ่านใหม่</div>
      <a class="submit-btn" id="goHome" href="batch.html"
         style="display:block;text-align:center;text-decoration:none;line-height:1.4">
        เริ่มใช้งาน
      </a>
    </div>
  </div>

  <div class="footer">Palletmanagement@brs-group.com</div>
</div>

<script type="module">
import { requireAuth, changePassword, checkPasswordStrength, loadSession } from './js/auth.js?v=2.14.0';

const API_URL = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);

const session = requireAuth();
if (session) {
  const home = session.role === 'delivery' ? 'delivery.html'
             : session.role === 'admin' ? 'home.html' : 'batch.html';
  $('backLink').href = home;
  $('goHome').href = home;
  $('who').textContent = session.empName + ' (' + session.empId + ') · ' + session.site;

  // ถูกบังคับเปลี่ยน — ซ่อนทางออก ไม่ให้ข้ามไปหน้าอื่นก่อนตั้งรหัสใหม่
  if (session.mustChangePassword) {
    $('forced').classList.add('on');
    $('skipLinks').style.display = 'none';
  }
}

function alertMsg(msg, kind = 'bad') {
  const a = $('alert'); a.textContent = msg; a.className = 'alert ' + kind + ' on';
}

$('password').addEventListener('input', () => {
  const v = $('password').value;
  const r = checkPasswordStrength(v);
  $('pwMeter').className = 'pw-meter' + (r.ok ? ' ok' : '');
  $('pwMeter').firstElementChild.style.width =
    (r.ok ? 100 : Math.min(100, Math.round(v.length / 12 * 100))) + '%';
  $('pwHint').textContent = v
    ? (r.ok ? 'รหัสผ่านใช้ได้' : r.message)
    : 'ต้องยาวอย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข';
  check();
});
['oldPw', 'password2'].forEach(id => $(id).addEventListener('input', check));

function check() {
  $('btnSave').disabled = !(
    $('oldPw').value &&
    checkPasswordStrength($('password').value).ok &&
    $('password').value === $('password2').value
  );
}

async function save() {
  $('alert').className = 'alert';
  $('e_password').textContent = '';

  if ($('password').value !== $('password2').value) {
    $('e_password').textContent = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
    return;
  }
  if ($('password').value === $('oldPw').value) {
    $('e_password').textContent = 'รหัสใหม่ต้องไม่ซ้ำกับรหัสเดิม';
    return;
  }

  const btn = $('btnSave');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const s = loadSession();
    await changePassword(API_URL, s.empId, $('oldPw').value, $('password').value);
    $('stage1').classList.remove('on');
    $('stage2').classList.add('on');
  } catch (err) {
    alertMsg(err.message || 'เปลี่ยนรหัสผ่านไม่สำเร็จ');
    btn.disabled = false; btn.textContent = 'บันทึกรหัสผ่านใหม่ →';
  }
}

$('btnSave').addEventListener('click', save);
$('password2').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('btnSave').disabled) save(); });
$('oldPw').focus();
</script>
</body>
</html>
