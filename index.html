<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>DocScan</title>
</head>
<body>
<script type="module">
// เช็ค token ไม่ใช่แค่ empId + site เหมือนเดิม
// และเช็ควันหมดอายุด้วย ไม่งั้นคนที่ session หมดแล้วจะถูกพาไปหน้าที่ใช้งานไม่ได้
import { loadSession } from './js/auth.js';
const s = loadSession();
if (s) {
  if (s.mustChangePassword) location.replace('change-password.html');
  else location.replace(s.role === 'delivery' ? 'delivery.html' : 'batch.html');
} else {
  location.replace('login.html');
}
</script>
<noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
</body>
</html>
