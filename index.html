<title>DocScan</title>

<body>
<script type="module">
// เช็ค token ไม่ใช่แค่ empId + site เหมือนเดิม
// และเช็ควันหมดอายุด้วย ไม่งั้นคนที่ session หมดแล้วจะถูกพาไปหน้าที่ใช้งานไม่ได้
import { loadSession } from './js/auth.js?v=2.14.0';
import { homeFor } from './js/nav.js?v=2.14.0';
const s = loadSession();
if (s) {
  if (s.mustChangePassword) location.replace('change-password.html');
  else location.replace(homeFor(s.role));
} else {
  location.replace('login.html');
}
</script>
<noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
</body>
