<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%23f1f5f9'/%3E%3Crect x='11' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='14.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3Crect x='17' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='20.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocScan — ติดตามเอกสาร</title>
<script src="config.js"></script>
<link rel="stylesheet" href="css/auth.css">
<style>
  body{display:block;padding:0;align-items:stretch}
  .wrap{max-width:1340px;margin:0 auto;padding:22px 24px 90px}

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20}
  .topbar .back{color:var(--accent);text-decoration:none;font-size:13.5px}
  .tb-title{border-left:1px solid var(--border);padding-left:18px}
  .tb-name{font-size:16px;font-weight:600}
  .tb-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .tb-user{margin-left:auto;text-align:right;font-size:12.5px}
  .tb-site{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

  /* ช่องค้นหาเป็นพระเอกของหน้านี้ */
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:22px;margin-bottom:16px}
  .srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sbox{flex:1;min-width:280px;position:relative}
  .sbox input{width:100%;background:var(--surface2);border:1.5px solid var(--accent);
    border-radius:10px;color:var(--text);font-family:var(--mono);font-size:19px;
    padding:15px 15px 15px 48px;letter-spacing:.05em;outline:none}
  .sbox .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
  .btn{border:none;border-radius:var(--rs);padding:14px 24px;font-family:var(--font);
    font-size:14.5px;font-weight:600;cursor:pointer;background:var(--accent);color:#0f172a}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);
    font-weight:400;padding:10px 16px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  /* ตะกร้า */
.csum .cw{color:var(--warn)} .csum .cbad{color:var(--danger)}
.cfoot .btn{width:100%;padding:11px}
body.cart-on .wrap{padding-right:324px}

/* กล่องวางรายการ */
#dlgPaste{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);padding:22px;max-width:520px;width:92vw;margin:auto;inset:0}
#dlgPaste::backdrop{background:rgba(15,23,42,.82)}
#pasteBox{width:100%;height:210px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);font-family:var(--mono);font-size:13.5px;
  padding:12px;resize:vertical;line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.7}
  .hint code{font-family:var(--mono);color:var(--accent);background:var(--surface2);
    padding:1px 7px;border-radius:4px;cursor:pointer}

    .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11.5px;color:var(--muted)}
  .fld select,.fld input{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:13px;padding:8px 11px}

  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
  .kpi .n{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.15}
  .kpi .k{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .kpi.bad{border-color:rgba(248,113,113,.5)} .kpi.bad .n{color:var(--danger)}
  .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--success)}
  .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--accent)}

  .rhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .rhead h2{font-size:14px;font-weight:600}
  .rhead .c{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  .rhead .r{margin-left:auto;display:flex;gap:10px;align-items:center}

  .tw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--surface2);
    border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr.main{cursor:pointer}
  tbody tr.main:hover td{background:var(--surface2)}
  tbody tr.main.open td{background:var(--surface2)}
  .mono{font-family:var(--mono)}
  .ref{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.03em}
  .sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}

  .pill{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 9px;
    border-radius:11px;border:1px solid;white-space:nowrap}
  .p-ok{color:var(--success);border-color:var(--success)}
  .p-warn{color:var(--warn);border-color:var(--warn)}
  .p-bad{color:var(--danger);border-color:var(--danger)}
  .p-mute{color:var(--muted);border-color:var(--border)}

  /* จุดบอกความคืบหน้า อ่านเร็วกว่าตัวหนังสือเมื่อกวาดสายตาทั้งตาราง */
  .flow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
  .dot.on{background:var(--success)} .dot.now{background:var(--accent)}
  .dot.late{background:var(--danger)}

  .detail td{background:#16202f;padding:0}
  .dwrap{padding:20px 24px;display:grid;gap:26px;grid-template-columns:1.15fr 1fr}
  .dsec h4{font-size:11px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);margin-bottom:11px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13px}
  .kv .k{color:var(--muted)}
  .tl{border-left:2px solid var(--border);padding-left:16px;margin-left:5px}
  .ev{position:relative;padding-bottom:15px;font-size:12.5px}
  .ev:last-child{padding-bottom:0}
  .ev::before{content:'';position:absolute;left:-22px;top:4px;width:9px;height:9px;
    border-radius:50%;background:var(--success);border:2px solid var(--bg)}
  .ev .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ev .who{font-size:11.5px;color:var(--muted)}
  .boxcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
    padding:13px 15px;margin-top:12px;display:flex;gap:13px;align-items:center}
  .boxcard img{width:62px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0;
    cursor:zoom-in;border:1px solid var(--border)}
  .boxcard .ph{width:62px;height:62px;border-radius:6px;background:var(--bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:21px}
  .boxcard .bid{font-family:var(--mono);font-size:13.5px;font-weight:600}
  .boxcard .bl{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
  .dacts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .dacts a{text-decoration:none;display:inline-block}

  .empty{color:var(--muted);font-size:13.5px;padding:34px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--r);line-height:1.8}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
   }

/* ── หน้าติดตามเอกสาร ── */

.tab b{margin-left:6px;font-family:var(--mono)}
.grow{flex:1}
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:38px;text-align:center;color:var(--muted);font-size:13.5px}

.chk{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.ref{font-family:var(--mono);font-size:13.5px;font-weight:600}
.sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.sub.note{color:var(--text);opacity:.75;font-style:italic}
.bad{color:var(--danger)} .warn{color:var(--warn)} .ok{color:var(--success)}
tr.lv-over td{background:rgba(248,113,113,.07)}
tr.lv-over td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr.lv-critical td:first-child{box-shadow:inset 3px 0 0 var(--warn)}


#dlgReason{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);padding:20px;max-width:560px;width:94vw;
  margin:auto;inset:0;max-height:90vh;overflow:auto}
#dlgReason::backdrop{background:rgba(15,23,42,.82)}
 .rs-gl.bad{color:var(--danger)}
 .rs-gl.muted{color:var(--muted)}
.rs-fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.rs-fld input,.rs-fld select{width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--rs);color:var(--text);
  padding:9px 11px;font-family:var(--font);font-size:13px}
.rs-act .hint{margin-right:auto;text-align:left}

/* กล่องแจ้งข้อผิดพลาด — ถูกลบไปตอนตัด CSS ที่ไม่เกี่ยว
   ต้องมี ไม่งั้นข้อความผิดพลาดจะไม่แสดงอะไรเลย */
.shp-alert{display:none;background:rgba(248,113,113,.1);border:1px solid var(--danger);
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13px}
.shp-alert.on{display:block}

/* แถบเตือน */
.dupbanner{display:none;background:rgba(251,191,36,.1);border:1px solid var(--warn);
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13px;line-height:1.8}
.dupbanner.bad{background:rgba(248,113,113,.1);border-color:var(--danger)}

/* แถวที่ระบบยังไม่รู้จักไซต์ — ต้องเห็นชัดว่าต่างจากแถวปกติ */
tr.unk td{background:rgba(248,113,113,.07)}
tr.unk td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
.unk-tag{font-size:10.5px;color:var(--danger);margin-top:2px}

/* ตะกร้าเอกสารที่เลือก */
.cart{position:sticky;top:56px;z-index:30;background:var(--surface);
  border:1px solid var(--accent);border-radius:var(--r);
  padding:10px 14px;margin-bottom:14px}
.cart-h{display:flex;align-items:center;gap:10px;font-size:13.5px}
.cart-h b{font-size:15px}
.cart-h .btn{margin-left:auto}
.cart-h .btn+.btn{margin-left:6px}
.btn.sm{padding:4px 10px;font-size:12px}
.cart-list{max-height:190px;overflow:auto;margin-top:10px;
  border-top:1px solid var(--border);padding-top:9px}
.cart-item{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px}
.cart-item .ref{flex:none;width:140px}
.cart-item .to{color:var(--muted);flex:1}
.cart-item button{background:none;border:none;color:var(--danger);
  cursor:pointer;font-size:13px;padding:0 4px}

/* ── หน้าส่งเอกสารตัวจริง ── */
.shp-step{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;margin-bottom:14px}
.shp-step-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shp-step-n{width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:#0f172a;font-weight:700;font-size:13px;display:flex;
  align-items:center;justify-content:center;flex:none}
.shp-step-t{font-size:15px;font-weight:600}
.shp-step-s{font-size:12px;color:var(--muted);margin-left:auto}

.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.filters input,.filters select{background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:8px 11px;
  font-family:var(--font);font-size:13px}
.filters input{min-width:200px}

.dlist{max-height:340px;overflow:auto;border:1px solid var(--border);
  border-radius:var(--rs)}
.dlist table{margin:0}
.dlist thead th{position:sticky;top:0;background:var(--surface2);z-index:1}

.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.fld label .req{color:var(--danger)}
.fld input,.fld select{width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--rs);color:var(--text);
  padding:9px 11px;font-family:var(--font);font-size:13px}
.fld input:invalid{border-color:var(--danger)}

.bigbtn{width:100%;padding:14px;font-size:15px;margin-top:14px}

/* ใบปะหน้า — ต้องพิมพ์ออกมาแล้วอ่านง่ายบนกระดาษขาว
   จึงใช้สีตรงข้ามกับหน้าจอ ไม่ใช่สีเดียวกัน */

@media print{
  body>*:not(.cover-wrap){display:none !important}
  .cover-wrap,.cover{display:block !important;margin:0;padding:0}
  .cover{box-shadow:none;border-radius:0}
  .noprint{display:none !important}
}
.bldtag{position:fixed;right:8px;bottom:6px;z-index:5;font-family:var(--mono);
  font-size:10px;color:var(--muted);opacity:.5;pointer-events:none}
@media print{.bldtag{display:none}}

/* ============================================================
   ใบส่งมอบเอกสาร
   ============================================================
   ออกแบบให้ผู้รับตรวจของได้จากใบนี้โดยไม่ต้องเปิดระบบ
   ผู้ส่งกับผู้รับแยกกล่องกันชัด แบบใบปะหน้าพัสดุ
   ============================================================ */
.cover-wrap{display:none;max-width:1000px;margin:0 auto;padding:20px 24px 80px}
.cover{background:#fff;color:#111;border-radius:8px;padding:26px 30px;
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;line-height:1.5}

/* หัวเอกสาร — บาร์โค้ดอยู่ซ้ายสุด */
.cover .hd{display:flex;align-items:flex-start;gap:20px;
  padding-bottom:14px;border-bottom:2px solid #111;margin-bottom:16px}
.cover .hd-bc{flex:none}
.cover .hd-bc svg{display:block}
.cover .hd-tt{flex:1;padding-top:2px}
.cover .hd-tt h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.cover .hd-sub{font-size:11.5px;color:#666;margin-top:2px}
.cover .hd-no{text-align:right;flex:none;min-width:150px}
.cover .hd-no .k{font-size:9.5px;color:#666;text-transform:uppercase;
  letter-spacing:.05em}
.cover .hd-no .v{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700}
.cover .hd-no .v.sm{font-size:11.5px;font-weight:500}

/* ผู้ส่ง / ผู้รับ */
.cover .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cover .box{border:1px solid #bbb;border-radius:6px;padding:12px 14px}
.cover .box.to{border:2px solid #111;background:#fafafa}
.cover .box-t{font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:#666;padding-bottom:7px;margin-bottom:8px;
  border-bottom:1px solid #ddd}
.cover .box.to .box-t{color:#111}
.cover .row{display:flex;gap:10px;font-size:12.5px;padding:2.5px 0}
.cover .row .k{width:96px;flex:none;color:#666}
.cover .row .v{font-weight:600;flex:1}
.cover .row .v.big{font-size:15px}

.cover .note{border:1px solid #ddd;border-radius:5px;padding:8px 12px;
  font-size:12px;margin-bottom:14px;background:#fafafa}

/* รายการเอกสาร */
.cover table.items{width:100%;border-collapse:collapse;margin-bottom:20px;
  font-size:11.5px}
.cover .items th,.cover .items td{border:1px solid #ccc;padding:5px 7px;
  text-align:left;vertical-align:middle}
.cover .items th{background:#eee;font-weight:600;font-size:10.5px}
.cover .items td.c{text-align:center}
.cover .items td.r{text-align:right;font-weight:600}
.cover .items .mono{font-family:'IBM Plex Mono',monospace;font-weight:600}
.cover .items .sm{font-size:10.5px}
.cover .items .ar{color:#999}
/* ช่องให้ผู้รับติ๊กตอนตรวจนับ */
.cover .items .chkbox{width:34px}
.cover .items tbody .chkbox::after{content:'';display:block;width:13px;height:13px;
  border:1.5px solid #666;margin:0 auto}
.cover .items tfoot td{background:#f5f5f5;font-weight:700}

/* ลายเซ็น */
.cover .sign{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:8px}
.cover .sg{border:1px solid #ddd;border-radius:6px;padding:12px 14px}
.cover .sg-t{font-size:11.5px;font-weight:700;margin-bottom:16px}
.cover .ln{border-bottom:1px dotted #999;height:26px;margin-bottom:12px;
  font-size:10.5px;color:#888}
.cover .ft{margin-top:22px;padding-top:10px;border-top:1px solid #ddd;
  font-size:10px;color:#777;text-align:center;line-height:1.7}

.cover-act{display:flex;gap:10px;justify-content:center;margin-top:18px}

@media print{
  @page{size:A4 portrait;margin:10mm 12mm}
  body>*:not(.cover-wrap){display:none !important}
  .cover-wrap{display:block !important;max-width:none;margin:0;padding:0}
  .cover{border-radius:0;padding:0;box-shadow:none}
  .noprint{display:none !important}
  .cover .items{font-size:10.5px}
}
</style>
</head>
<body>

<div class="topbar noprint">
  <a class="back" href="home.html">← หน้าหลัก</a>
  <div class="tb-title">
    <div class="tb-name">ส่งเอกสารตัวจริง</div>
    <div class="tb-sub" id="scopeInfo">เลือกเอกสาร ระบุปลายทาง แล้วสร้างชุดส่ง</div>
  </div>
  <div class="tb-user">
    <span id="who">—</span>
    <div class="tb-site" id="whoSite"></div>
  </div>
</div>

<div class="wrap noprint" id="mainWrap">
  <div class="shp-alert" id="alert"></div>

  <div class="dupbanner bad" id="unkBanner" style="display:none"></div>

<!-- ตะกร้า — เห็นตลอดว่าเลือกอะไรไปแล้ว
     เดิมต้องเลื่อนหาว่าติ๊กใบไหนไว้ ซึ่งเสียเวลาและพลาดง่าย -->
<div class="cart" id="cart" style="display:none">
  <div class="cart-h">
    <b id="cartCount">0 ใบ</b>
    <button class="btn ghost sm" id="cartToggle">ดูรายการ</button>
    <button class="btn ghost sm" id="cartClear">ล้างทั้งหมด</button>
  </div>
  <div class="cart-list" id="cartList" style="display:none"></div>
</div>

  <div class="shp-step">
    <div class="shp-step-h">
      <div class="shp-step-n">1</div>
      <div class="shp-step-t">เลือกเอกสารที่จะส่ง</div>
      <div class="shp-step-s" id="pickInfo">—</div>
    </div>

    <div class="filters">
      <input id="q" placeholder="ค้นเลข Reference หรือปลายทาง" autocomplete="off">
      <select id="fFrom"><option value="">ต้นทางทั้งหมด</option></select>
      <select id="fDest"><option value="">ปลายทางทั้งหมด</option></select>
      <!-- กรองตามวันที่สแกน เพื่อให้หยิบงานที่เพิ่งทำไปได้เร็ว -->
      <select id="fScan">
        <option value="">สแกนเมื่อไหร่ก็ได้</option>
        <option value="0">วันนี้</option>
        <option value="1">ภายใน 2 วัน</option>
        <option value="7">ภายใน 7 วัน</option>
        <option value="30">ภายใน 30 วัน</option>
      </select>
      <button class="btn ghost" id="btnAll">เลือกทั้งหมดที่เห็น</button>
      <button class="btn ghost" id="btnNone">ยกเลิกการเลือก</button>
      <div class="grow"></div>
      <button class="btn ghost" id="btnReload">รีเฟรช</button>
    </div>

    <div class="dlist" id="dlist"></div>
  </div>

  <div class="shp-step">
    <div class="shp-step-h">
      <div class="shp-step-n">2</div>
      <div class="shp-step-t">รายละเอียดการส่ง</div>
    </div>

    <div class="form2">
      <!-- ถามช่องทางก่อน เพราะเป็นตัวกำหนดว่าต้องกรอกอะไรต่อ
           ถ้าเลือกเก็บไว้เอง ช่องที่เหลือไม่ต้องกรอกเลย -->
      <div class="fld">
        <label>ช่องทางการส่ง <span class="req">*</span></label>
        <select id="channel">
          <option value="">— เลือกช่องทาง —</option>
          <option value="company_van">รถบริษัท</option>
          <option value="courier">ขนส่งเอกชน</option>
          <option value="post">ไปรษณีย์</option>
          <option value="hand">คนถือไปเอง</option>
          <option value="keep_self">เก็บไว้เอง ไม่ได้ส่งออกไปไหน</option>
        </select>
        <div class="hint" id="chHint">เลือกก่อน แล้วจะขึ้นช่องที่ต้องกรอก</div>
      </div>
      <div class="fld" id="toSiteBox" style="display:none">
        <label>คลัง/โรงงานปลายทางที่จัดเก็บ <span class="req">*</span></label>
        <select id="toSite"><option value="">— เลือกคลัง/โรงงาน —</option></select>
        <div class="hint">สถานที่ที่เอกสารตัวจริงจะถูกส่งไปเก็บ</div>
      </div>
      <div class="fld" id="recvBox" style="display:none">
        <label>ผู้รับ <span class="req">*</span></label>
        <input id="receiver" placeholder="ชื่อผู้รับปลายทาง" maxlength="60">
      </div>
      <div class="fld" id="vehBox" style="display:none">
        <label id="vehLabel">ทะเบียนรถ</label>
        <input id="vehicle" placeholder="เช่น 70-1265" maxlength="40">
      </div>
    </div>

    <div class="fld" style="margin-top:12px">
      <label>หมายเหตุ (ไม่บังคับ)</label>
      <input id="note" placeholder="เช่น ฝากไว้ที่ป้อมยาม" maxlength="120">
    </div>

    <button class="btn bigbtn" id="btnCreate" disabled>เลือกเอกสารก่อน</button>
  </div>
</div>

<div class="cover-wrap" id="coverWrap" style="display:none"></div>

<script type="module">

import { authFetch, requireAuth, logout } from './js/auth.js';
/* installNav และ guardPage อยู่ใน nav.js ไม่ใช่ auth.js
   เขียนผิดไฟล์ทำให้โมดูลพังทั้งก้อน หน้าจึงว่างเปล่าเงียบ ๆ */
import { installNav, guardPage } from './js/nav.js';
import { installSupport, installErrorCapture } from './js/support.js';
import { installRefBar } from './js/refstatus.js';

const API = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);

const session = requireAuth();
if (session) {
  if (!guardPage(session)) throw new Error('no access');
  installNav(session, { onLogout: () => logout(API) });
  $('who').textContent = session.empName || session.empId || '';
  $('whoSite').textContent = session.site || '';

  /* ของเสริมต้องไม่ทำให้หน้าหลักพัง
     เดิมวางไว้ก่อนแสดงชื่อผู้ใช้ ถ้าตัวใดตัวหนึ่งพัง
     ทั้งหน้าจะหยุดตั้งแต่ต้น และไม่มีอะไรบอกว่าเพราะอะไร */
  try {
    installErrorCapture();
    installSupport(session, call);
  } catch (e) {
    console.error('[DocScan] ติดตั้งส่วนเสริมไม่สำเร็จ', e);
  }
}

async function call(action, payload = {}, timeoutMs) {
  try {
    return await authFetch(API, { action, ...payload },
      timeoutMs ? { timeoutMs } : undefined);
  } catch (err) {
    if (err.code === 'auth_required') { alert('เซสชันหมดอายุ'); location.href = 'login.html'; }
    throw err;
  }
}

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* แถบสถานะข้อมูลอ้างอิง — ต้องรู้ก่อนเริ่มทำอะไร
   ว่าข้อมูลมีไหม เก่าแค่ไหน และเชื่อมเซิร์ฟเวอร์ได้ไหม */
try { installRefBar(call); }
catch (e) { console.error('[DocScan] แถบสถานะติดตั้งไม่สำเร็จ', e); }

function fmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' });
}

const CHANNEL_LABEL = {
  keep_self: 'เก็บไว้เอง ไม่ได้ส่งออก',
  company_van: 'รถบริษัท', courier: 'ขนส่งเอกชน',
  post: 'ไปรษณีย์', hand: 'คนถือไปเอง'
};

/* ช่องรายละเอียดเปลี่ยนตามช่องทาง
   ถ้าถามทะเบียนรถตอนส่งไปรษณีย์ คนจะงงแล้วกรอกมั่ว */
const VEHICLE_LABEL = {
  keep_self: '',
  company_van: 'ทะเบียนรถ', courier: 'เลขพัสดุ / ชื่อบริษัทขนส่ง',
  post: 'เลข EMS', hand: 'ชื่อผู้ถือไป'
};

let allDocs = [], fromSite = '', lastDiag = null;
const selected = new Set();

/* ---------- โหลดเอกสารที่พร้อมส่ง ---------- */
async function load() {
  /* รายงานทุกขั้นบนหน้าจอ ไม่ใช่แค่ใน console
     เพราะถ้าพังก่อนถึง catch จะไม่มีอะไรบอกเลยว่าติดตรงไหน */
  var step = 'เริ่ม';
  function mark(s) {
    step = s;
    $('dlist').innerHTML = '<div class="empty">' + esc(s) + '…</div>';
    console.log('[DocScan] ' + s);
  }

  $('dlist').dataset.started = '1';
  mark('กำลังเรียกข้อมูลจากเซิร์ฟเวอร์');
  try {
    const r = await call('docsReadyToShip', {}, 60000);
    console.log('[DocScan] เซิร์ฟเวอร์ตอบ', r);

    /* ตรวจก่อนใช้เสมอ ถ้าเซิร์ฟเวอร์ตอบผิดรูปแบบ
       การไปอ่าน r.rows ตรง ๆ จะได้ error ที่ไม่บอกอะไร */
    if (!r) throw new Error('เซิร์ฟเวอร์ไม่ตอบกลับ');
    if (r.status !== 'ok') throw new Error(r.message || 'โหลดไม่สำเร็จ');
    if (!Array.isArray(r.rows)) {
      throw new Error('เซิร์ฟเวอร์ไม่ได้ส่งรายการกลับมา\n' +
        'มักเกิดเมื่อยังไม่ได้ Deploy Documents.gs เป็นเวอร์ชันใหม่');
    }

    mark('ได้ข้อมูลแล้ว ' + (r.rows || []).length + ' ใบ กำลังแสดงผล');

    allDocs = r.rows || [];
    fromSite = r.from_site || (session && session.site) || '';
    lastDiag = r.diag || null;
    selected.clear();
    if (lastDiag) console.log('[DocScan] เอกสารพร้อมส่ง', lastDiag);

    $('scopeInfo').textContent = 'ต้นทาง ' + (fromSite || 'ทุกไซต์') +
      ' · พร้อมส่ง ' + allDocs.length + ' ใบ';

    step = 'เติมตัวกรองปลายทาง';   fillDestFilter();
    step = 'เติมตัวกรองต้นทาง';    fillFromFilter();
    step = 'เติมรายชื่อคลัง';       await fillSiteOptions();
    step = 'วาดตาราง';              render();
  } catch (e) {
    console.error('[DocScan] พังตอน: ' + step, e);
    $('dlist').innerHTML =
      '<div class="empty">โหลดไม่สำเร็จตอน <b>' + esc(step) + '</b><br>' +
      '<span class="hint">' + esc(e.message || String(e)) + '</span></div>';
    showAlert('โหลดไม่สำเร็จตอน ' + step + ': ' + (e.message || e));
  }
}

function showAlert(m) {
  $('alert').textContent = m;
  $('alert').className = 'alert bad on';
}

/** ปลายทางที่มีจริงในข้อมูล ไม่ต้องให้เลือกอันที่ไม่มีเอกสาร */
/* เติมรายชื่อต้นทางจากข้อมูลจริง ไม่ให้พิมพ์เอง
   เพราะพิมพ์ผิดนิดเดียวก็กรองไม่เจอ */
function fillFromFilter() {
  const set = [...new Set(allDocs
    .map(d => d.transfer_from || d.site).filter(Boolean))].sort();
  const cur = $('fFrom').value;
  $('fFrom').innerHTML = '<option value="">ต้นทางทั้งหมด</option>' +
    set.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
  if (set.includes(cur)) $('fFrom').value = cur;
}

function fillDestFilter() {
  const dests = [...new Set(allDocs.map(d => d.dest_warehouse || d.transfer_to)
                                   .filter(Boolean))].sort();
  $('fDest').innerHTML = '<option value="">ปลายทางทั้งหมด</option>' +
    dests.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
}

/* รายชื่อคลัง/โรงงานที่จะส่งเอกสารไปเก็บ
 *
 * ดึงจากรายชื่อไซต์จริงของเรา ไม่ใช่ dest_warehouse ในเอกสาร
 * เพราะตัวนั้นคือปลายทางที่ส่งของ ซึ่งเป็นลูกค้าหรือสาขา
 * คนละเรื่องกับคลังที่เก็บเอกสารตัวจริง
 */
let siteOptionsLoaded = false;

async function fillSiteOptions() {
  if (siteOptionsLoaded) return;
  try {
    const r = await call('siteListForShip', {}, 30000);
    const list = (r && r.sites) || [];
    $('toSite').innerHTML = '<option value="">— เลือกคลัง/โรงงาน —</option>' +
      list.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
    siteOptionsLoaded = true;
  } catch (e) {
    console.error('[DocScan] โหลดรายชื่อคลังไม่สำเร็จ', e);
    $('toSite').innerHTML = '<option value="">โหลดรายชื่อไม่สำเร็จ</option>';
  }
}

/* ---------- ตาราง ---------- */
function shown() {
  const q = $('q').value.trim().toUpperCase();
  const dest = $('fDest').value;
  const from = $('fFrom').value;
  const scan = $('fScan').value;

  return allDocs.filter(d => {
    if (dest && (d.dest_warehouse || d.transfer_to) !== dest) return false;
    if (from && (d.transfer_from || d.site) !== from) return false;

    /* กรองตามวันที่สแกน — d.days คือจำนวนวันตั้งแต่สแกน
       0 = วันนี้ จึงเทียบแบบน้อยกว่าหรือเท่ากับ */
    if (scan !== '' && (d.days == null || d.days > Number(scan))) return false;

    if (!q) return true;
    return String(d.ref_no).toUpperCase().includes(q) ||
           String(d.dest_warehouse || '').toUpperCase().includes(q) ||
           String(d.transfer_to || '').toUpperCase().includes(q) ||
           String(d.transfer_from || '').toUpperCase().includes(q);
  });
}

function render() {
  const rows = shown();
  $('pickInfo').textContent = 'เลือกแล้ว ' + selected.size + ' จาก ' + rows.length + ' ใบ';

  /* เตือนเรื่องไซต์ที่ยังไม่รู้จัก ให้เห็นก่อนเลือก
     ถ้าซ่อนไว้ คนจะส่งเอกสารที่ไม่ใช่ของตัวเองไปโดยไม่รู้ */
  /* ตอนนี้ยังไม่กรองตามไซต์ จึงต้องบอกให้ชัดว่าบางใบไม่ใช่ของเรา
     ถ้าไม่บอก คนจะส่งเอกสารของไซต์อื่นไปโดยไม่รู้ */
  const other = rows.filter(d => d.other_site);
  const ub = $('unkBanner');
  if (ub) {
    if (other.length) {
      const names = [...new Set(other.map(d => d.site || d.dest_warehouse)
                                     .filter(Boolean))];
      ub.style.display = 'block';
      ub.innerHTML = '<b>แสดงเอกสารทุกไซต์อยู่</b> — ' +
        other.length + ' ใบจาก ' + rows.length + ' ใบไม่ใช่ของไซต์คุณ<br>' +
        'ไซต์ที่พบ: ' + names.slice(0, 6).map(esc).join(' · ') +
        (names.length > 6 ? ' และอีก ' + (names.length - 6) : '') + '<br>' +
        '<span class="hint">แถวที่มีแถบแดงคือของไซต์อื่น — ตรวจก่อนเลือกส่ง</span>';
    } else {
      ub.style.display = 'none';
    }
  }

  if (!rows.length) {
    /* บอกว่าทำไมถึงไม่มี ไม่ใช่แค่ "ไม่มีเอกสาร"
       คนจะได้รู้ว่าต้องไปแก้ที่ไหน แทนที่จะเดาหรือถามกลับ */
    $('dlist').innerHTML = '<div class="empty">' + emptyReason() + '</div>';
    updateCreateBtn();
    return;
  }

  $('dlist').innerHTML = '<table><thead><tr>' +
    '<th style="width:34px"><input type="checkbox" class="chk" id="selAll"></th>' +
    '<th style="width:150px">Reference</th>' +
    '<th style="width:150px">ต้นทาง</th>' +
    '<th>ปลายทาง</th>' +
    '<th style="width:90px">จำนวนพาเลท</th>' +
    '<th style="width:110px">สแกนไว้แล้ว</th>' +
    '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table>';

  $('dlist').querySelectorAll('.rowchk').forEach(cb =>
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(cb.dataset.ref); else selected.delete(cb.dataset.ref);
      afterSelect();
    }));

  $('selAll').addEventListener('change', () => {
    const on = $('selAll').checked;
    rows.forEach(d => { if (on) selected.add(d.ref_no); else selected.delete(d.ref_no); });
    $('dlist').querySelectorAll('.rowchk').forEach(cb => { cb.checked = on; });
    afterSelect();
  });

  renderCart();
  updateCreateBtn();
}

/** อธิบายว่าทำไมไม่มีรายการ จากตัวเลขที่เซิร์ฟเวอร์ส่งมา */
function emptyReason() {
  if (!lastDiag) return 'ไม่มีเอกสารที่พร้อมส่ง';

  const c = lastDiag.counts || {};
  const L = [];

  if (!lastDiag.sheet_rows) {
    return '<b>ยังไม่มีเอกสารในระบบเลย</b><br>' +
      '<span class="hint">ต้องนำเข้าเอกสารที่หน้า "นำเข้าเอกสาร" ก่อน</span>';
  }

  L.push('<b>ไม่มีเอกสารที่พร้อมส่ง</b>');
  L.push('<span class="hint">จากทั้งหมด ' + (c.total || 0) + ' ใบในระบบ</span>');

  const why = [];
  if (c.other_site) why.push(c.other_site + ' ใบเป็นของไซต์อื่น');
  if (c.not_scanned) why.push(c.not_scanned + ' ใบยังไม่ได้สแกน');
  if (c.shipped) why.push(c.shipped + ' ใบส่งไปแล้ว');
  if (c.closed) why.push(c.closed + ' ใบปิดงานแล้ว');
  if (why.length) L.push('<span class="hint">' + why.join(' · ') + '</span>');

  /* ชื่อไซต์ไม่ตรงกันเป็นสาเหตุที่พบบ่อยและมองไม่เห็น
     เช่นผู้ใช้อยู่ "คลังลาดหลุมแก้ว" แต่เอกสารเขียน "ลาดหลุมแก้ว" */
  if (c.other_site && c.other_site === c.total) {
    const mine = lastDiag.my_site || '(ไม่ระบุ)';
    const found = (lastDiag.sites_in_data || [])
      .map(x => x.site + ' (' + x.n + ')').join(' · ');
    L.push('<div class="hint" style="margin-top:10px;color:var(--warn)">' +
      'ไซต์ของคุณคือ <b>' + esc(mine) + '</b> แต่เอกสารในระบบอยู่ไซต์<br>' +
      esc(found || '—') + '<br>' +
      'ถ้าชื่อควรตรงกัน ให้แจ้งผู้ดูแลตรวจการตั้งค่าไซต์</div>');
  }

  return L.join('<br>');
}

function rowHtml(d) {
  /* สแกนไว้นานแล้วยังไม่ส่ง = ควรได้ส่งก่อน จึงเน้นให้เห็น */
  const late = d.days != null && d.days >= 3;
  return `<tr class="${d.other_site ? 'unk' : ''}">
    <td><input type="checkbox" class="chk rowchk" data-ref="${esc(d.ref_no)}"${
      selected.has(d.ref_no) ? ' checked' : ''}></td>
    <td><div class="ref">${esc(d.ref_no)}</div>
        <div class="sub">${fmt(d.doc_date)}</div></td>
    <td>${esc(d.transfer_from || d.site || '—')}${
      d.other_site ? '<div class="unk-tag">ไม่ใช่ไซต์ของคุณ</div>' : ''}</td>
    <td>${esc(d.dest_warehouse || d.transfer_to || '—')}</td>
    <td>${d.sent_qty || '—'}</td>
    <td>${d.days == null ? '—'
      : `<b class="${late ? 'warn' : ''}">${d.days} วัน</b>`}</td>
  </tr>`;
}

function afterSelect() {
  renderCart();
  $('pickInfo').textContent = 'เลือกแล้ว ' + selected.size + ' จาก ' + shown().length + ' ใบ';

  /* ไม่เดาคลังปลายทางจากเอกสาร
     เพราะ dest_warehouse คือปลายทางที่ส่งของ ไม่ใช่คลังที่เก็บเอกสาร
     เดาผิดแล้วคนอาจไม่ทันสังเกต */

  const all = $('selAll');
  if (all) {
    const rows = shown();
    const k = rows.filter(d => selected.has(d.ref_no)).length;
    all.checked = k > 0 && k === rows.length;
    all.indeterminate = k > 0 && k < rows.length;
  }
  updateCreateBtn();
}

/* ---------- ตรวจก่อนสร้าง ---------- */
function blockingReason() {
  if (!selected.size) return 'เลือกเอกสารก่อน';
  /* เก็บไว้เองไม่ต้องมีปลายทางและผู้รับ
     เพราะเอกสารไม่ได้ออกไปไหน */
  const selfKeep = $('channel').value === 'keep_self';
  if (!selfKeep && !$('toSite').value) return 'เลือกคลัง/โรงงานปลายทาง';
  if (!selfKeep && !$('receiver').value.trim()) return 'ระบุชื่อผู้รับ';
  if (!$('channel').value) return 'เลือกช่องทางการส่ง';

  /* ไม่ต้องตรวจว่าเอกสารไปปลายทางเดียวกันไหม
   *
   * เดิมเข้าใจผิดว่าต้องจำกัด แต่ dest_warehouse ในเอกสาร
   * คือปลายทางที่ส่งของ ซึ่งเป็นลูกค้าหรือสาขา มีหลายแห่งเป็นเรื่องปกติ
   *
   * สิ่งที่ต้องเป็นแห่งเดียวคือคลัง/โรงงานที่เก็บเอกสาร
   * ซึ่งเลือกจาก dropdown ได้อันเดียวอยู่แล้ว จึงไม่ต้องตรวจซ้ำ
   */

  /* เลือกของไซต์อื่นปนมา ไม่ห้าม แต่ต้องรู้ตัว
     เพราะตอนนี้ยังไม่กรอง จึงเลือกผิดได้ง่าย */
  const foreign = allDocs.filter(d => selected.has(d.ref_no) && d.other_site).length;
  if (foreign) return 'เลือกเอกสารของไซต์อื่น ' + foreign + ' ใบ — ตรวจก่อนสร้างชุด';

  return '';
}

/* แสดงตะกร้า — เลือกอะไรไปแล้วบ้าง กี่ใบ
   ต้องเห็นตลอด ไม่ใช่ต้องเลื่อนหาว่าติ๊กใบไหนไว้ */
function renderCart() {
  const box = $('cart');
  if (!box) return;

  if (!selected.size) { box.style.display = 'none'; return; }
  box.style.display = '';

  const picked = allDocs.filter(d => selected.has(d.ref_no));
  const qty = picked.reduce((a, d) => a + (Number(d.sent_qty) || 0), 0);

  $('cartCount').textContent = selected.size + ' ใบ' +
    (qty ? ' · ' + qty + ' พาเลท' : '');

  $('cartList').innerHTML = picked.map(d =>
    '<div class="cart-item">' +
      '<div class="ref">' + esc(d.ref_no) + '</div>' +
      '<div class="to">' + esc(d.transfer_from || d.site || '—') +
        ' → ' + esc(d.dest_warehouse || d.transfer_to || '—') + '</div>' +
      '<button data-drop="' + esc(d.ref_no) + '" title="เอาออก">✕</button>' +
    '</div>').join('');

  $('cartList').querySelectorAll('[data-drop]').forEach(b =>
    b.addEventListener('click', () => {
      selected.delete(b.dataset.drop);
      render();
    }));
}

function updateCreateBtn() {
  const why = blockingReason();
  const btn = $('btnCreate');
  btn.disabled = !!why;
  /* บอกให้ตรงว่ากำลังทำอะไร
     เก็บไว้เองไม่ใช่การส่ง จึงไม่ควรเขียนว่า "สร้างชุดส่ง" */
  const keep = $('channel').value === 'keep_self';
  btn.textContent = why ||
    (keep ? 'ปิดงาน ' + selected.size + ' ใบ (เก็บไว้เอง)'
          : 'สร้างชุดส่ง ' + selected.size + ' ใบ');
}

['q', 'fDest', 'fFrom', 'fScan'].forEach(id =>
  $(id).addEventListener('input', render));
['toSite', 'receiver', 'channel'].forEach(id =>
  $(id).addEventListener('input', updateCreateBtn));

$('channel').addEventListener('change', () => {
  const c = $('channel').value;

  /* ช่องที่เหลือขึ้นตามช่องทางที่เลือก
   *
   * ยังไม่เลือก  ซ่อนหมด ไม่ให้กรอกก่อนแล้วต้องลบทิ้ง
   * เก็บไว้เอง   ซ่อนหมด เพราะเอกสารไม่ได้ออกไปไหน
   * ส่งจริง      ขึ้นครบ
   */
  const show = c && c !== 'keep_self';
  ['toSiteBox', 'recvBox', 'vehBox'].forEach(id => {
    const el = $(id);
    if (el) el.style.display = show ? '' : 'none';
  });

  const hint = $('chHint');
  if (hint) {
    hint.textContent = !c ? 'เลือกก่อน แล้วจะขึ้นช่องที่ต้องกรอก'
      : c === 'keep_self'
        ? 'เอกสารอยู่ที่เดิม ระบบจะปิดงานให้ทันที ไม่ต้องรอใครรับ'
        : '';
    hint.style.display = hint.textContent ? '' : 'none';
  }

  updateCreateBtn();

  $('vehLabel').textContent = VEHICLE_LABEL[c] || 'รายละเอียดเพิ่มเติม';
  $('vehicle').placeholder = c === 'company_van' ? 'เช่น 70-1265'
    : c === 'courier' ? 'เช่น Kerry 1234567890'
    : c === 'post' ? 'เช่น EA123456789TH'
    : c === 'hand' ? 'ชื่อคนที่ถือไป' : '';
});

$('btnAll').addEventListener('click', () => {
  shown().forEach(d => selected.add(d.ref_no));
  render();
});
$('btnNone').addEventListener('click', () => { selected.clear(); render(); });

/* ปุ่มในตะกร้า */
$('cartToggle').addEventListener('click', () => {
  const l = $('cartList');
  const open = l.style.display !== 'none';
  l.style.display = open ? 'none' : '';
  $('cartToggle').textContent = open ? 'ดูรายการ' : 'ซ่อนรายการ';
});

$('cartClear').addEventListener('click', () => {
  if (!confirm('ล้างเอกสารที่เลือกไว้ทั้งหมด ' + selected.size + ' ใบ')) return;
  selected.clear();
  render();
});
$('btnReload').addEventListener('click', load);

/* ---------- สร้างชุดส่ง ---------- */
$('btnCreate').addEventListener('click', async () => {
  const refs = [...selected];
  const btn = $('btnCreate');
  const keep = $('channel').value === 'keep_self';

  /* เก็บไว้เองไม่ส่งค่าปลายทางและผู้รับ
     คนอาจกรอกไว้ก่อนแล้วเปลี่ยนใจ ช่องถูกซ่อนแต่ค่ายังอยู่
     ถ้าส่งไปด้วย จะบันทึกว่าส่งไปที่นั่นทั้งที่ไม่ได้ส่ง */
  const detail = {
    to_site:  keep ? '' : $('toSite').value,
    receiver: keep ? '' : $('receiver').value.trim(),
    channel:  $('channel').value,
    vehicle:  keep ? '' : $('vehicle').value.trim(),
    note:     $('note').value.trim(),
    from_site: fromSite
  };

  // ข้อความยืนยันต้องตรงกับสิ่งที่จะเกิดขึ้นจริง
  const lines = keep
    ? ['ปิดงาน ' + refs.length + ' ใบ', '',
       'เก็บเอกสารไว้เอง ไม่ได้ส่งออกไปไหน',
       'ระบบจะปิดงานทันที ไม่ต้องรอใครรับ']
    : ['สร้างชุดส่ง ' + refs.length + ' ใบ', '',
       'ปลายทาง: ' + detail.to_site,
       'ผู้รับ: ' + detail.receiver,
       'ช่องทาง: ' + (CHANNEL_LABEL[detail.channel] || detail.channel), '',
       'เอกสารเหล่านี้จะถูกบันทึกว่าส่งแล้ว'];

  if (!confirm(lines.join('\n'))) return;

  btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
  try {
    const r = await call('shipCreateBatch', { refs, ...detail }, 120000);
    if (r.status !== 'ok') { alert(r.message || 'สร้างไม่สำเร็จ'); return; }

    /* บอกให้ครบว่าใบไหนไม่ได้ไป
       ถ้าเงียบ คนจะคิดว่าส่งครบแล้วมาพบทีหลังว่าขาด */
    let msg = keep
      ? 'ปิดงาน ' + r.count + ' ใบ · เก็บไว้เอง\nเลขอ้างอิง ' + r.batch_id
      : 'สร้างชุด ' + r.batch_id + ' · ' + r.count + ' ใบ';
    if (r.already && r.already.length) msg += '\nส่งไปแล้ว ' + r.already.length + ' ใบ (ข้าม)';
    if (r.not_scanned && r.not_scanned.length) msg += '\nยังไม่ได้สแกน ' + r.not_scanned.length + ' ใบ (ข้าม)';
    if (r.not_found && r.not_found.length) msg += '\nไม่พบในระบบ ' + r.not_found.length + ' ใบ';
    alert(msg);

    /* เก็บไว้เองไม่ต้องมีใบปะหน้า เพราะไม่มีใครรับ
       พิมพ์ไปก็เปลืองกระดาษและทำให้สับสนว่าต้องส่งให้ใคร */
    if (keep) { load(); return; }

    showCover(r);
  } catch (e) {
    alert('สร้างไม่สำเร็จ: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    updateCreateBtn();
  }
});

/* ---------- ใบปะหน้า ---------- */
function showCover(r) {
  $('mainWrap').style.display = 'none';
  const w = $('coverWrap');
  w.style.display = 'block';

  const items = r.items || (r.shipped || []).map(x => ({ ref_no: x }));
  const totalQty = items.reduce((a, d) => a + (Number(d.sent_qty) || 0), 0);

  const rows = items.map((d, n) => `<tr>
      <td class="c">${n + 1}</td>
      <td class="mono">${esc(d.ref_no || '')}</td>
      <td class="mono sm">${esc(d.barcode || '—')}</td>
      <td>${esc(d.item_name || '—')}</td>
      <td class="sm">${esc(d.transfer_from || '—')} <span class="ar">→</span>
          ${esc(d.transfer_to || '—')}</td>
      <td class="c">${d.sent_qty || '—'}</td>
      <td class="chkbox"></td>
    </tr>`).join('');

  w.innerHTML = `
    <div class="cover">

      <!-- บาร์โค้ดมุมซ้ายบน ขนาดพอสแกน ไม่กินพื้นที่หัวเอกสาร -->
      <div class="hd">
        <div class="hd-bc"><svg id="coverBc"></svg></div>
        <div class="hd-tt">
          <h2>ใบส่งมอบเอกสาร</h2>
          <div class="hd-sub">DocScan — ระบบติดตามเอกสารพาเลท</div>
        </div>
        <div class="hd-no">
          <div class="k">เลขที่ชุด</div>
          <div class="v">${esc(r.batch_id)}</div>
          <div class="k" style="margin-top:6px">วันที่ส่ง</div>
          <div class="v sm">${new Date(r.created_at)
            .toLocaleString('th-TH', { day:'2-digit', month:'short', year:'numeric',
                                       hour:'2-digit', minute:'2-digit' })}</div>
        </div>
      </div>

      <!-- ผู้ส่งและผู้รับแยกกันชัดเจน แบบใบปะหน้าพัสดุ -->
      <div class="pair">
        <div class="box">
          <div class="box-t">ผู้ส่ง</div>
          <div class="row"><span class="k">คลัง/โรงงาน</span>
            <span class="v">${esc(r.from_site || '—')}</span></div>
          <div class="row"><span class="k">ผู้จัดส่ง</span>
            <span class="v">${esc(r.created_name || '—')}</span></div>
          <div class="row"><span class="k">ช่องทาง</span>
            <span class="v">${esc(CHANNEL_LABEL[r.channel] || r.channel || '—')}</span></div>
          ${r.vehicle ? `<div class="row"><span class="k">ทะเบียน/เลขพัสดุ</span>
            <span class="v">${esc(r.vehicle)}</span></div>` : ''}
        </div>

        <div class="box to">
          <div class="box-t">ผู้รับ</div>
          <div class="row"><span class="k">คลัง/โรงงาน</span>
            <span class="v big">${esc(r.to_site || '—')}</span></div>
          <div class="row"><span class="k">ชื่อผู้รับ</span>
            <span class="v">${esc(r.receiver || '—')}</span></div>
          <div class="row"><span class="k">จำนวนเอกสาร</span>
            <span class="v big">${r.count} ฉบับ</span></div>
          ${totalQty ? `<div class="row"><span class="k">รวมพาเลท</span>
            <span class="v">${totalQty}</span></div>` : ''}
        </div>
      </div>

      ${r.note ? `<div class="note"><b>หมายเหตุ</b> ${esc(r.note)}</div>` : ''}

      <table class="items">
        <thead><tr>
          <th style="width:28px">#</th>
          <th style="width:110px">Reference</th>
          <th style="width:92px">Barcode</th>
          <th>ประเภทเอกสาร</th>
          <th style="width:200px">โอนจาก → โอนไป</th>
          <th style="width:44px">พาเลท</th>
          <th style="width:34px">ตรวจ</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td colspan="5" class="r">รวม</td>
          <td class="c">${totalQty || '—'}</td>
          <td class="chkbox"></td>
        </tr></tfoot>
      </table>

      <div class="sign">
        <div class="sg">
          <div class="sg-t">ผู้ส่งมอบ (ทีมจัดส่ง)</div>
          <div class="ln">ลงชื่อ</div>
          <div class="ln">ชื่อ-สกุล</div>
          <div class="ln">วันที่ / เวลา</div>
        </div>
        <div class="sg">
          <div class="sg-t">ผู้รับมอบ (ทีมคลัง)</div>
          <div class="ln">ลงชื่อ</div>
          <div class="ln">ชื่อ-สกุล</div>
          <div class="ln">วันที่ / เวลา</div>
        </div>
      </div>

      <div class="ft">
        พิมพ์จากระบบ DocScan · ${esc(r.batch_id)} ·
        ${new Date().toLocaleString('th-TH')}
        <br>ผู้รับกรุณาตรวจนับตามรายการ แล้วยิงบาร์โค้ดชุดนี้ที่หน้า "รับเอกสาร"
      </div>
    </div>

    <div class="cover-act noprint">
      <button class="btn" onclick="window.print()">พิมพ์ใบส่งมอบ</button>
      <button class="btn ghost" id="backList">กลับไปหน้าส่งเอกสาร</button>
    </div>`;

  $('backList').addEventListener('click', () => {
    w.style.display = 'none';
    $('mainWrap').style.display = '';
    load();
  });

  drawBarcode(r.batch_id);
}

async function drawBarcode(text) {
  try {
    if (!window.JsBarcode) await loadScript('vendor/JsBarcode.all.min.js');
    /* ขนาดพอให้เครื่องสแกนอ่านได้ แต่ไม่กินพื้นที่หัวเอกสาร
       ความกว้างแท่ง 1.6 ที่ความสูง 40 อ่านได้ในระยะปกติ */
    JsBarcode('#coverBc', text, {
      format: 'CODE128', width: 1.6, height: 40,
      displayValue: true, fontSize: 11, margin: 2
    });
  } catch (e) {
    console.warn('[DocScan] วาดบาร์โค้ดไม่ได้', e);
  }
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = rej;
    document.head.appendChild(el);
  });
}

/* ถ้าโค้ดก่อนหน้าพัง จะไม่ถึงบรรทัดนี้ และหน้าจะว่างเปล่าเงียบ ๆ
   ดักไว้เพื่อให้เห็นว่าพังก่อนเริ่มโหลด */
window.addEventListener('error', function (e) {
  var el = document.getElementById('dlist');
  if (el && !el.dataset.started) {
    el.innerHTML = '<div class="empty">หน้านี้ทำงานไม่สำเร็จ<br>' +
      '<span class="hint">' + String(e.message || '') + '</span></div>';
  }
});

load();
</script>
