<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%23f1f5f9'/%3E%3Crect x='11' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='14.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3Crect x='17' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='20.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocScan — ติดตามเอกสาร</title>
<script src="config.js?v=2.14.0"></script>
<link rel="stylesheet" href="css/auth.css?v=2.14.0">
<style>
  body{display:block;padding:0;align-items:stretch}
  .wrap{max-width:1340px;margin:0 auto;padding:22px 24px 90px}

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20}
  .topbar .back{color:var(--accent);text-decoration:none;font-size:13.5px}
  .tb-title{border-left:1px solid var(--border);padding-left:18px}
  .tb-name{font-size:16px;font-weight:600}
  .tb-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .tb-user{margin-left:auto;text-align:right;font-size:12.5px}
  .tb-site{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

  /* ช่องค้นหาเป็นพระเอกของหน้านี้ */
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:22px;margin-bottom:16px}
  .srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sbox{flex:1;min-width:280px;position:relative}
  .sbox input{width:100%;background:var(--surface2);border:1.5px solid var(--accent);
    border-radius:10px;color:var(--text);font-family:var(--mono);font-size:19px;
    padding:15px 15px 15px 48px;letter-spacing:.05em;outline:none}
  .sbox .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
  .btn{border:none;border-radius:var(--rs);padding:14px 24px;font-family:var(--font);
    font-size:14.5px;font-weight:600;cursor:pointer;background:var(--accent);color:#0f172a}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);
    font-weight:400;padding:10px 16px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  /* ตะกร้า */
.csum .cw{color:var(--warn)} .csum .cbad{color:var(--danger)}
.cfoot .btn{width:100%;padding:11px}
body.cart-on .wrap{padding-right:324px}

/* กล่องวางรายการ */
#dlgPaste{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);padding:22px;max-width:520px;width:92vw;margin:auto;inset:0}
#dlgPaste::backdrop{background:rgba(15,23,42,.82)}
#pasteBox{width:100%;height:210px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);font-family:var(--mono);font-size:13.5px;
  padding:12px;resize:vertical;line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.7}
  .hint code{font-family:var(--mono);color:var(--accent);background:var(--surface2);
    padding:1px 7px;border-radius:4px;cursor:pointer}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;
    padding-top:16px;border-top:1px solid var(--border)}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11.5px;color:var(--muted)}
  .fld select,.fld input{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:13px;padding:8px 11px}

  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
  .kpi .n{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.15}
  .kpi .k{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .kpi.bad{border-color:rgba(248,113,113,.5)} .kpi.bad .n{color:var(--danger)}
  .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--success)}
  .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--accent)}

  .rhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .rhead h2{font-size:14px;font-weight:600}
  .rhead .c{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  .rhead .r{margin-left:auto;display:flex;gap:10px;align-items:center}

  .tw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--surface2);
    border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr.main{cursor:pointer}
  tbody tr.main:hover td{background:var(--surface2)}
  tbody tr.main.open td{background:var(--surface2)}
  .mono{font-family:var(--mono)}
  .ref{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.03em}
  .sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}

  .pill{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 9px;
    border-radius:11px;border:1px solid;white-space:nowrap}
  .p-ok{color:var(--success);border-color:var(--success)}
  .p-warn{color:var(--warn);border-color:var(--warn)}
  .p-bad{color:var(--danger);border-color:var(--danger)}
  .p-mute{color:var(--muted);border-color:var(--border)}

  /* จุดบอกความคืบหน้า อ่านเร็วกว่าตัวหนังสือเมื่อกวาดสายตาทั้งตาราง */
  .flow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
  .dot.on{background:var(--success)} .dot.now{background:var(--accent)}
  .dot.late{background:var(--danger)}

  .detail td{background:#16202f;padding:0}
  .dwrap{padding:20px 24px;display:grid;gap:26px;grid-template-columns:1.15fr 1fr}
  .dsec h4{font-size:11px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);margin-bottom:11px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13px}
  .kv .k{color:var(--muted)}
  .tl{border-left:2px solid var(--border);padding-left:16px;margin-left:5px}
  .ev{position:relative;padding-bottom:15px;font-size:12.5px}
  .ev:last-child{padding-bottom:0}
  .ev::before{content:'';position:absolute;left:-22px;top:4px;width:9px;height:9px;
    border-radius:50%;background:var(--success);border:2px solid var(--bg)}
  .ev .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ev .who{font-size:11.5px;color:var(--muted)}
  .boxcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
    padding:13px 15px;margin-top:12px;display:flex;gap:13px;align-items:center}
  .boxcard img{width:62px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0;
    cursor:zoom-in;border:1px solid var(--border)}
  .boxcard .ph{width:62px;height:62px;border-radius:6px;background:var(--bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:21px}
  .boxcard .bid{font-family:var(--mono);font-size:13.5px;font-weight:600}
  .boxcard .bl{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
  .dacts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .dacts a{text-decoration:none;display:inline-block}

  .empty{color:var(--muted);font-size:13.5px;padding:34px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--r);line-height:1.8}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
  @media (max-width:980px){ .dwrap{grid-template-columns:1fr} th:nth-child(3),td:nth-child(3){display:none} }

/* ── หน้าติดตามเอกสาร ── */

.tab b{margin-left:6px;font-family:var(--mono)}
.grow{flex:1}
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:38px;text-align:center;color:var(--muted);font-size:13.5px}

.chk{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.ref{font-family:var(--mono);font-size:13.5px;font-weight:600}
.sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.sub.note{color:var(--text);opacity:.75;font-style:italic}
.bad{color:var(--danger)} .warn{color:var(--warn)} .ok{color:var(--success)}
tr.lv-over td{background:rgba(248,113,113,.07)}
tr.lv-over td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr.lv-critical td:first-child{box-shadow:inset 3px 0 0 var(--warn)}


#dlgReason{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);padding:20px;max-width:560px;width:94vw;
  margin:auto;inset:0;max-height:90vh;overflow:auto}
#dlgReason::backdrop{background:rgba(15,23,42,.82)}
 .rs-gl.bad{color:var(--danger)}
 .rs-gl.muted{color:var(--muted)}
.rs-fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.rs-fld input,.rs-fld select{width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--rs);color:var(--text);
  padding:9px 11px;font-family:var(--font);font-size:13px}
.rs-act .hint{margin-right:auto;text-align:left}

/* กล่องแจ้งข้อผิดพลาด — ถูกลบไปตอนตัด CSS ที่ไม่เกี่ยว
   ต้องมี ไม่งั้นข้อความผิดพลาดจะไม่แสดงอะไรเลย */
.alert{display:none;background:rgba(248,113,113,.1);border:1px solid var(--danger);
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13px}
.alert.on{display:block}

/* ── หน้าส่งเอกสารตัวจริง ── */
.step{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:#0f172a;font-weight:700;font-size:13px;display:flex;
  align-items:center;justify-content:center;flex:none}
.step-t{font-size:15px;font-weight:600}
.step-s{font-size:12px;color:var(--muted);margin-left:auto}

.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.filters input,.filters select{background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:8px 11px;
  font-family:var(--font);font-size:13px}
.filters input{min-width:200px}

.dlist{max-height:340px;overflow:auto;border:1px solid var(--border);
  border-radius:var(--rs)}
.dlist table{margin:0}
.dlist thead th{position:sticky;top:0;background:var(--surface2);z-index:1}

.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.fld label .req{color:var(--danger)}
.fld input,.fld select{width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--rs);color:var(--text);
  padding:9px 11px;font-family:var(--font);font-size:13px}
.fld input:invalid{border-color:var(--danger)}

.bigbtn{width:100%;padding:14px;font-size:15px;margin-top:14px}

/* ใบปะหน้า — ต้องพิมพ์ออกมาแล้วอ่านง่ายบนกระดาษขาว
   จึงใช้สีตรงข้ามกับหน้าจอ ไม่ใช่สีเดียวกัน */
.cover{background:#fff;color:#111;border-radius:var(--r);padding:26px;margin-top:16px}
.cover h2{margin:0 0 4px;font-size:21px}
.cover .cid{font-family:var(--mono);font-size:31px;font-weight:700;letter-spacing:.04em}
.cover .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:11px;margin:18px 0;padding:14px 0;border-top:1px solid #ccc;border-bottom:1px solid #ccc}
.cover .mk{font-size:10.5px;color:#666;text-transform:uppercase;letter-spacing:.04em}
.cover .mv{font-size:14px;font-weight:600;margin-top:2px}
.cover table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.cover th,.cover td{border:1px solid #ccc;padding:5px 8px;text-align:left}
.cover th{background:#f0f0f0}
.cover .sign{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:34px}
.cover .sline{border-top:1px solid #333;padding-top:6px;font-size:11.5px;text-align:center}
.cover .bc{text-align:center;margin:14px 0}

@media print{
  body>*:not(.cover-wrap){display:none !important}
  .cover-wrap,.cover{display:block !important;margin:0;padding:0}
  .cover{box-shadow:none;border-radius:0}
  .noprint{display:none !important}
}
</style>
</head>
<body>

<div class="topbar noprint">
  <a class="back" href="home.html">← หน้าหลัก</a>
  <div class="tb-title">
    <div class="tb-name">ส่งเอกสารตัวจริง</div>
    <div class="tb-sub" id="scopeInfo">เลือกเอกสาร ระบุปลายทาง แล้วสร้างชุดส่ง</div>
  </div>
  <div class="tb-user">
    <span id="who">—</span>
    <div class="tb-site" id="whoSite"></div>
  </div>
</div>

<div class="wrap noprint" id="mainWrap">
  <div class="alert bad" id="alert"></div>

  <div class="step">
    <div class="step-h">
      <div class="step-n">1</div>
      <div class="step-t">เลือกเอกสารที่จะส่ง</div>
      <div class="step-s" id="pickInfo">—</div>
    </div>

    <div class="filters">
      <input id="q" placeholder="ค้นเลข Reference หรือปลายทาง" autocomplete="off">
      <select id="fDest"><option value="">ปลายทางทั้งหมด</option></select>
      <button class="btn ghost" id="btnAll">เลือกทั้งหมดที่เห็น</button>
      <button class="btn ghost" id="btnNone">ยกเลิกการเลือก</button>
      <div class="grow"></div>
      <button class="btn ghost" id="btnReload">รีเฟรช</button>
    </div>

    <div class="dlist" id="dlist"></div>
  </div>

  <div class="step">
    <div class="step-h">
      <div class="step-n">2</div>
      <div class="step-t">รายละเอียดการส่ง</div>
    </div>

    <div class="form2">
      <div class="fld">
        <label>ส่งไปที่ไซต์ <span class="req">*</span></label>
        <select id="toSite"><option value="">— เลือกไซต์ —</option></select>
      </div>
      <div class="fld">
        <label>ผู้รับ <span class="req">*</span></label>
        <input id="receiver" placeholder="ชื่อผู้รับปลายทาง" maxlength="60">
      </div>
      <div class="fld">
        <label>ช่องทางการส่ง <span class="req">*</span></label>
        <select id="channel">
          <option value="">— เลือกช่องทาง —</option>
          <option value="company_van">รถบริษัท</option>
          <option value="courier">ขนส่งเอกชน</option>
          <option value="post">ไปรษณีย์</option>
          <option value="hand">คนถือไปเอง</option>
        </select>
      </div>
      <div class="fld" id="vehBox">
        <label id="vehLabel">ทะเบียนรถ</label>
        <input id="vehicle" placeholder="เช่น 70-1265" maxlength="40">
      </div>
    </div>

    <div class="fld" style="margin-top:12px">
      <label>หมายเหตุ (ไม่บังคับ)</label>
      <input id="note" placeholder="เช่น ฝากไว้ที่ป้อมยาม" maxlength="120">
    </div>

    <button class="btn bigbtn" id="btnCreate" disabled>เลือกเอกสารก่อน</button>
  </div>
</div>

<div class="cover-wrap" id="coverWrap" style="display:none"></div>

<script type="module">

import { authFetch, requireAuth, installNav, guardPage, logout } from './js/auth.js?v=2.15.0';

const API = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);

const session = requireAuth();
if (session) {
  if (!guardPage(session)) throw new Error('no access');
  installNav(session, { onLogout: () => logout(API) });
  $('who').textContent = session.empName || session.empId || '';
  $('whoSite').textContent = session.site || '';
}

async function call(action, payload = {}, timeoutMs) {
  try {
    return await authFetch(API, { action, ...payload },
      timeoutMs ? { timeoutMs } : undefined);
  } catch (err) {
    if (err.code === 'auth_required') { alert('เซสชันหมดอายุ'); location.href = 'login.html'; }
    throw err;
  }
}

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' });
}

const CHANNEL_LABEL = {
  company_van: 'รถบริษัท', courier: 'ขนส่งเอกชน',
  post: 'ไปรษณีย์', hand: 'คนถือไปเอง'
};

/* ช่องรายละเอียดเปลี่ยนตามช่องทาง
   ถ้าถามทะเบียนรถตอนส่งไปรษณีย์ คนจะงงแล้วกรอกมั่ว */
const VEHICLE_LABEL = {
  company_van: 'ทะเบียนรถ', courier: 'เลขพัสดุ / ชื่อบริษัทขนส่ง',
  post: 'เลข EMS', hand: 'ชื่อผู้ถือไป'
};

let allDocs = [], fromSite = '';
const selected = new Set();

/* ---------- โหลดเอกสารที่พร้อมส่ง ---------- */
async function load() {
  $('dlist').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  try {
    const r = await call('docsReadyToShip', {}, 60000);
    if (r.status !== 'ok') throw new Error(r.message || 'โหลดไม่สำเร็จ');

    allDocs = r.rows || [];
    fromSite = r.from_site || session.site || '';
    selected.clear();

    $('scopeInfo').textContent = 'ต้นทาง ' + (fromSite || 'ทุกไซต์') +
      ' · พร้อมส่ง ' + allDocs.length + ' ใบ';

    fillDestFilter();
    fillSiteOptions();
    render();
  } catch (e) {
    $('dlist').innerHTML = '';
    showAlert('โหลดไม่สำเร็จ: ' + (e.message || e));
  }
}

function showAlert(m) {
  $('alert').textContent = m;
  $('alert').className = 'alert bad on';
}

/** ปลายทางที่มีจริงในข้อมูล ไม่ต้องให้เลือกอันที่ไม่มีเอกสาร */
function fillDestFilter() {
  const dests = [...new Set(allDocs.map(d => d.dest_warehouse || d.transfer_to)
                                   .filter(Boolean))].sort();
  $('fDest').innerHTML = '<option value="">ปลายทางทั้งหมด</option>' +
    dests.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
}

function fillSiteOptions() {
  const dests = [...new Set(allDocs.map(d => d.dest_warehouse || d.transfer_to)
                                   .filter(Boolean))].sort();
  $('toSite').innerHTML = '<option value="">— เลือกไซต์ —</option>' +
    dests.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
}

/* ---------- ตาราง ---------- */
function shown() {
  const q = $('q').value.trim().toUpperCase();
  const dest = $('fDest').value;
  return allDocs.filter(d => {
    if (dest && (d.dest_warehouse || d.transfer_to) !== dest) return false;
    if (!q) return true;
    return String(d.ref_no).toUpperCase().includes(q) ||
           String(d.dest_warehouse || '').toUpperCase().includes(q) ||
           String(d.transfer_to || '').toUpperCase().includes(q);
  });
}

function render() {
  const rows = shown();
  $('pickInfo').textContent = 'เลือกแล้ว ' + selected.size + ' จาก ' + rows.length + ' ใบ';

  if (!rows.length) {
    $('dlist').innerHTML = '<div class="empty">ไม่มีเอกสารที่พร้อมส่ง</div>';
    updateCreateBtn();
    return;
  }

  $('dlist').innerHTML = '<table><thead><tr>' +
    '<th style="width:34px"><input type="checkbox" class="chk" id="selAll"></th>' +
    '<th style="width:150px">Reference</th>' +
    '<th style="width:96px">วันที่เอกสาร</th>' +
    '<th>ปลายทาง</th>' +
    '<th style="width:110px">สแกนไว้แล้ว</th>' +
    '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table>';

  $('dlist').querySelectorAll('.rowchk').forEach(cb =>
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(cb.dataset.ref); else selected.delete(cb.dataset.ref);
      afterSelect();
    }));

  $('selAll').addEventListener('change', () => {
    const on = $('selAll').checked;
    rows.forEach(d => { if (on) selected.add(d.ref_no); else selected.delete(d.ref_no); });
    $('dlist').querySelectorAll('.rowchk').forEach(cb => { cb.checked = on; });
    afterSelect();
  });

  updateCreateBtn();
}

function rowHtml(d) {
  /* สแกนไว้นานแล้วยังไม่ส่ง = ควรได้ส่งก่อน จึงเน้นให้เห็น */
  const late = d.days != null && d.days >= 3;
  return `<tr>
    <td><input type="checkbox" class="chk rowchk" data-ref="${esc(d.ref_no)}"${
      selected.has(d.ref_no) ? ' checked' : ''}></td>
    <td><div class="ref">${esc(d.ref_no)}</div></td>
    <td>${fmt(d.doc_date)}</td>
    <td>${esc(d.dest_warehouse || d.transfer_to || '—')}</td>
    <td>${d.days == null ? '—'
      : `<b class="${late ? 'warn' : ''}">${d.days} วัน</b>`}</td>
  </tr>`;
}

function afterSelect() {
  $('pickInfo').textContent = 'เลือกแล้ว ' + selected.size + ' จาก ' + shown().length + ' ใบ';

  /* เลือกปลายทางให้เองถ้าทุกใบที่เลือกไปที่เดียวกัน
     ลดการกรอกและลดโอกาสเลือกผิด */
  const dests = new Set(allDocs.filter(d => selected.has(d.ref_no))
    .map(d => d.dest_warehouse || d.transfer_to).filter(Boolean));
  if (dests.size === 1 && !$('toSite').value) {
    $('toSite').value = [...dests][0];
  }

  const all = $('selAll');
  if (all) {
    const rows = shown();
    const k = rows.filter(d => selected.has(d.ref_no)).length;
    all.checked = k > 0 && k === rows.length;
    all.indeterminate = k > 0 && k < rows.length;
  }
  updateCreateBtn();
}

/* ---------- ตรวจก่อนสร้าง ---------- */
function blockingReason() {
  if (!selected.size) return 'เลือกเอกสารก่อน';
  if (!$('toSite').value) return 'เลือกไซต์ปลายทาง';
  if (!$('receiver').value.trim()) return 'ระบุชื่อผู้รับ';
  if (!$('channel').value) return 'เลือกช่องทางการส่ง';

  /* หนึ่งชุดไปไซต์เดียว ถ้าเลือกข้ามไซต์ ปลายทางจะได้ของที่ไม่ใช่ของตัวเอง
     แล้วต้องมาแยกเองซึ่งเสียเวลาและผิดพลาดง่าย */
  const dests = new Set(allDocs.filter(d => selected.has(d.ref_no))
    .map(d => d.dest_warehouse || d.transfer_to).filter(Boolean));
  if (dests.size > 1) {
    return 'เลือกข้ามปลายทาง ' + dests.size + ' แห่ง — หนึ่งชุดส่งได้ไซต์เดียว';
  }
  return '';
}

function updateCreateBtn() {
  const why = blockingReason();
  const btn = $('btnCreate');
  btn.disabled = !!why;
  btn.textContent = why || ('สร้างชุดส่ง ' + selected.size + ' ใบ');
}

['q', 'fDest'].forEach(id => $(id).addEventListener('input', render));
['toSite', 'receiver', 'channel'].forEach(id =>
  $(id).addEventListener('input', updateCreateBtn));

$('channel').addEventListener('change', () => {
  const c = $('channel').value;
  $('vehLabel').textContent = VEHICLE_LABEL[c] || 'รายละเอียดเพิ่มเติม';
  $('vehicle').placeholder = c === 'company_van' ? 'เช่น 70-1265'
    : c === 'courier' ? 'เช่น Kerry 1234567890'
    : c === 'post' ? 'เช่น EA123456789TH'
    : c === 'hand' ? 'ชื่อคนที่ถือไป' : '';
});

$('btnAll').addEventListener('click', () => {
  shown().forEach(d => selected.add(d.ref_no));
  render();
});
$('btnNone').addEventListener('click', () => { selected.clear(); render(); });
$('btnReload').addEventListener('click', load);

/* ---------- สร้างชุดส่ง ---------- */
$('btnCreate').addEventListener('click', async () => {
  const refs = [...selected];
  const btn = $('btnCreate');
  const detail = {
    to_site: $('toSite').value,
    receiver: $('receiver').value.trim(),
    channel: $('channel').value,
    vehicle: $('vehicle').value.trim(),
    note: $('note').value.trim(),
    from_site: fromSite
  };

  if (!confirm('สร้างชุดส่ง ' + refs.length + ' ใบ\n\n' +
      'ปลายทาง: ' + detail.to_site + '\n' +
      'ผู้รับ: ' + detail.receiver + '\n' +
      'ช่องทาง: ' + (CHANNEL_LABEL[detail.channel] || detail.channel) + '\n\n' +
      'เอกสารเหล่านี้จะถูกบันทึกว่าส่งแล้ว')) return;

  btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
  try {
    const r = await call('shipCreateBatch', { refs, ...detail }, 120000);
    if (r.status !== 'ok') { alert(r.message || 'สร้างไม่สำเร็จ'); return; }

    /* บอกให้ครบว่าใบไหนไม่ได้ไป
       ถ้าเงียบ คนจะคิดว่าส่งครบแล้วมาพบทีหลังว่าขาด */
    let msg = 'สร้างชุด ' + r.batch_id + ' · ' + r.count + ' ใบ';
    if (r.already && r.already.length) msg += '\nส่งไปแล้ว ' + r.already.length + ' ใบ (ข้าม)';
    if (r.not_scanned && r.not_scanned.length) msg += '\nยังไม่ได้สแกน ' + r.not_scanned.length + ' ใบ (ข้าม)';
    if (r.not_found && r.not_found.length) msg += '\nไม่พบในระบบ ' + r.not_found.length + ' ใบ';
    alert(msg);

    showCover(r);
  } catch (e) {
    alert('สร้างไม่สำเร็จ: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    updateCreateBtn();
  }
});

/* ---------- ใบปะหน้า ---------- */
function showCover(r) {
  $('mainWrap').style.display = 'none';
  const w = $('coverWrap');
  w.style.display = 'block';

  const refs = r.shipped || [];
  const per = 3;                       // แบ่งเป็นคอลัมน์ให้พิมพ์ลงหน้าเดียวได้มากขึ้น
  const rows = [];
  for (let i = 0; i < refs.length; i += per) rows.push(refs.slice(i, i + per));

  w.innerHTML = `
    <div class="cover">
      <div style="display:flex;align-items:flex-start">
        <div>
          <h2>ใบปะหน้าชุดส่งเอกสาร</h2>
          <div class="cid">${esc(r.batch_id)}</div>
        </div>
        <div style="margin-left:auto;text-align:right;font-size:12px">
          สร้างเมื่อ ${new Date(r.created_at).toLocaleString('th-TH')}<br>
          โดย ${esc(r.created_name || '')}
        </div>
      </div>

      <div class="bc"><svg id="coverBc"></svg></div>

      <div class="meta">
        <div><div class="mk">ต้นทาง</div><div class="mv">${esc(r.from_site || '—')}</div></div>
        <div><div class="mk">ปลายทาง</div><div class="mv">${esc(r.to_site)}</div></div>
        <div><div class="mk">ผู้รับ</div><div class="mv">${esc(r.receiver)}</div></div>
        <div><div class="mk">ช่องทาง</div><div class="mv">${
          esc(CHANNEL_LABEL[r.channel] || r.channel)}${
          r.vehicle ? ' · ' + esc(r.vehicle) : ''}</div></div>
        <div><div class="mk">จำนวน</div><div class="mv">${r.count} ใบ</div></div>
      </div>

      ${r.note ? `<div style="font-size:12.5px;margin-bottom:10px"><b>หมายเหตุ:</b> ${esc(r.note)}</div>` : ''}

      <table>
        <thead><tr>${Array(per).fill('<th>เลขเอกสาร</th>').join('')}</tr></thead>
        <tbody>${rows.map(row =>
          '<tr>' + row.map(x => `<td>${esc(x)}</td>`).join('') +
          Array(per - row.length).fill('<td></td>').join('') + '</tr>').join('')}
        </tbody>
      </table>

      <div class="sign">
        <div class="sline">ผู้ส่ง / วันที่</div>
        <div class="sline">ผู้รับ / วันที่</div>
      </div>
    </div>

    <div class="noprint" style="margin-top:16px;display:flex;gap:10px;justify-content:center">
      <button class="btn" id="btnPrint">พิมพ์ใบปะหน้า</button>
      <button class="btn ghost" id="btnNew">สร้างชุดใหม่</button>
    </div>`;

  drawBarcode(r.batch_id);

  $('btnPrint').addEventListener('click', () => window.print());
  $('btnNew').addEventListener('click', () => {
    w.style.display = 'none';
    $('mainWrap').style.display = '';
    ['receiver', 'vehicle', 'note'].forEach(id => { $(id).value = ''; });
    $('channel').value = ''; $('toSite').value = '';
    load();
  });
}

/** บาร์โค้ดของเลขชุด ให้ปลายทางยิงรับทั้งชุดทีเดียว */
async function drawBarcode(text) {
  try {
    if (!window.JsBarcode) await loadScript('vendor/JsBarcode.all.min.js');
    JsBarcode('#coverBc', text, {
      format: 'CODE128', width: 2.4, height: 62,
      displayValue: true, fontSize: 15, margin: 6
    });
  } catch (e) {
    console.warn('[DocScan] วาดบาร์โค้ดไม่ได้', e);
  }
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = rej;
    document.head.appendChild(el);
  });
}

load();
</script>
</body>
</html>
