<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocScan — ติดตามเอกสาร</title>
<script src="config.js?v=2.14.0"></script>
<link rel="stylesheet" href="css/auth.css?v=2.14.0">
<style>
  body{display:block;padding:0;align-items:stretch}
  .wrap{max-width:1340px;margin:0 auto;padding:22px 24px 90px}

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20}
  .topbar .back{color:var(--accent);text-decoration:none;font-size:13.5px}
  .tb-title{border-left:1px solid var(--border);padding-left:18px}
  .tb-name{font-size:16px;font-weight:600}
  .tb-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .tb-user{margin-left:auto;text-align:right;font-size:12.5px}
  .tb-site{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

  /* ช่องค้นหาเป็นพระเอกของหน้านี้ */
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:22px;margin-bottom:16px}
  .srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sbox{flex:1;min-width:280px;position:relative}
  .sbox input{width:100%;background:var(--surface2);border:1.5px solid var(--accent);
    border-radius:10px;color:var(--text);font-family:var(--mono);font-size:19px;
    padding:15px 15px 15px 48px;letter-spacing:.05em;outline:none}
  .sbox .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
  .btn{border:none;border-radius:var(--rs);padding:14px 24px;font-family:var(--font);
    font-size:14.5px;font-weight:600;cursor:pointer;background:var(--accent);color:#0f172a}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);
    font-weight:400;padding:10px 16px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.7}
  .hint code{font-family:var(--mono);color:var(--accent);background:var(--surface2);
    padding:1px 7px;border-radius:4px;cursor:pointer}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;
    padding-top:16px;border-top:1px solid var(--border)}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11.5px;color:var(--muted)}
  .fld select,.fld input{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:13px;padding:8px 11px}

  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
  .kpi .n{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.15}
  .kpi .k{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .kpi.bad{border-color:rgba(248,113,113,.5)} .kpi.bad .n{color:var(--danger)}
  .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--success)}
  .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--accent)}

  .rhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .rhead h2{font-size:14px;font-weight:600}
  .rhead .c{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  .rhead .r{margin-left:auto;display:flex;gap:10px;align-items:center}

  .tw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--surface2);
    border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr.main{cursor:pointer}
  tbody tr.main:hover td{background:var(--surface2)}
  tbody tr.main.open td{background:var(--surface2)}
  .mono{font-family:var(--mono)}
  .ref{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.03em}
  .sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}

  .pill{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 9px;
    border-radius:11px;border:1px solid;white-space:nowrap}
  .p-ok{color:var(--success);border-color:var(--success)}
  .p-warn{color:var(--warn);border-color:var(--warn)}
  .p-bad{color:var(--danger);border-color:var(--danger)}
  .p-mute{color:var(--muted);border-color:var(--border)}

  /* จุดบอกความคืบหน้า อ่านเร็วกว่าตัวหนังสือเมื่อกวาดสายตาทั้งตาราง */
  .flow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
  .dot.on{background:var(--success)} .dot.now{background:var(--accent)}
  .dot.late{background:var(--danger)}

  .detail td{background:#16202f;padding:0}
  .dwrap{padding:20px 24px;display:grid;gap:26px;grid-template-columns:1.15fr 1fr}
  .dsec h4{font-size:11px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);margin-bottom:11px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13px}
  .kv .k{color:var(--muted)}
  .tl{border-left:2px solid var(--border);padding-left:16px;margin-left:5px}
  .ev{position:relative;padding-bottom:15px;font-size:12.5px}
  .ev:last-child{padding-bottom:0}
  .ev::before{content:'';position:absolute;left:-22px;top:4px;width:9px;height:9px;
    border-radius:50%;background:var(--success);border:2px solid var(--bg)}
  .ev .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ev .who{font-size:11.5px;color:var(--muted)}
  .boxcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
    padding:13px 15px;margin-top:12px;display:flex;gap:13px;align-items:center}
  .boxcard img{width:62px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0;
    cursor:zoom-in;border:1px solid var(--border)}
  .boxcard .ph{width:62px;height:62px;border-radius:6px;background:var(--bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:21px}
  .boxcard .bid{font-family:var(--mono);font-size:13.5px;font-weight:600}
  .boxcard .bl{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
  .dacts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .dacts a{text-decoration:none;display:inline-block}

  .empty{color:var(--muted);font-size:13.5px;padding:34px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--r);line-height:1.8}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
  @media (max-width:980px){ .dwrap{grid-template-columns:1fr} th:nth-child(3),td:nth-child(3){display:none} }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="home.html">← หน้าหลัก</a>
  <div class="tb-title">
    <div class="tb-name">ติดตามเอกสาร</div>
    <div class="tb-sub" id="slaInfo">ค้นหาเอกสารที่นำเข้าระบบแล้ว</div>
  </div>
  <div class="tb-user">
    <span id="who">—</span>
    <div class="tb-site" id="whoSite"></div>
  </div>
</div>

<div class="wrap">
  <div class="alert bad" id="alert"></div>

  <div class="hero">
    <div class="srow">
      <div class="sbox">
        <span class="mag">🔎</span>
        <input id="q" placeholder="เลข Reference, บาร์โค้ด, ชื่อลูกค้า หรือรหัสกล่อง" autocomplete="off">
      </div>
      <button class="btn" id="btnSearch">ค้นหา</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="filters">
      <div class="fld"><label for="fPdf">สถานะ PDF</label>
        <select id="fPdf">
          <option value="">ทั้งหมด</option>
          <option value="scanned">สแกนแล้ว</option>
          <option value="verified">ตรวจแล้ว</option>
          <option value="sent">ส่งต่อแล้ว</option>
          <option value="closed">ปิดงาน</option>
        </select></div>
      <div class="fld"><label for="fPaper">สถานะเอกสารตัวจริง</label>
        <select id="fPaper">
          <option value="">ทั้งหมด</option>
          <option value="held">อยู่ที่จัดส่ง</option>
          <option value="shipped">ส่งแล้ว</option>
          <option value="received">คลังรับแล้ว</option>
          <option value="boxed">เข้ากล่องแล้ว</option>
        </select></div>
      <div class="fld"><label for="fBox">รหัสกล่อง</label>
        <input id="fBox" placeholder="BOX-2026-08-…" style="width:172px"></div>
      <div class="fld"><label for="fFrom">วันที่เอกสาร ตั้งแต่</label><input id="fFrom" type="date"></div>
      <div class="fld"><label for="fTo">ถึง</label><input id="fTo" type="date"></div>
      <div class="fld"><label>&nbsp;</label><button class="btn ghost" id="btnClear">ล้างตัวกรอง</button></div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="rhead">
    <h2 id="rTitle">รายการที่ต้องดำเนินการ</h2>
    <span class="c" id="rCount"></span>
    <div class="r">
      <button class="btn ghost" id="btnCsv">ดาวน์โหลด CSV</button>
      <button class="btn ghost" id="btnReload">รีเฟรช</button>
    </div>
  </div>

  <div id="view"></div>
</div>

<script type="module">
import { requireAuth, authFetch, logout } from './js/auth.js?v=2.14.0';
import { installNav } from './js/nav.js?v=2.14.0';

const API = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);
let dash = null, rowsData = [];

const session = requireAuth();
if (session) {
  installNav(session, { onLogout: () => { logout(API); location.replace('login.html'); } });
  $('who').textContent = session.empName || session.empId;
  $('whoSite').textContent = session.empId + ' · ' + session.site;
  load();
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

async function call(action, payload = {}) {
  try { return await authFetch(API, { action, ...payload }); }
  catch (err) {
    if (err.code === 'auth_required') { alert('เซสชันหมดอายุ'); location.href = 'login.html'; }
    throw err;
  }
}
function showError(m) { $('alert').textContent = m; $('alert').className = 'alert bad on'; }
function fmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? String(v)
    : d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });
}
function fmtT(v) {
  if (!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? String(v)
    : d.toLocaleString('th-TH', { day: '2-digit', month: 'short', year: '2-digit',
                                  hour: '2-digit', minute: '2-digit' });
}

const PDF_TH = { pending_scan:'รอสแกน', scanned:'สแกนแล้ว', verified:'ตรวจแล้ว',
                 sent:'ส่งต่อแล้ว', closed:'ปิดงาน' };
const PAPER_TH = { held:'อยู่ที่จัดส่ง', shipped:'ส่งแล้ว', received:'คลังรับแล้ว', boxed:'เข้ากล่องแล้ว' };
const PDF_SEQ = ['pending_scan','scanned','verified','sent','closed'];
const PAPER_SEQ = ['held','shipped','received','boxed'];

function flow(seq, cur, sla, days) {
  const i = Math.max(0, seq.indexOf(cur));
  const last = i >= seq.length - 1;
  const dots = seq.slice(1).map((_, k) => {
    if (k < i) return '<span class="dot on"></span>';
    if (k === i) return '<span class="dot ' + (sla === 'over' ? 'late' : 'now') + '"></span>';
    return '<span class="dot"></span>';
  }).join('');
  const label = last ? 'เสร็จใน ' + days + ' วัน'
    : sla === 'over' ? 'เกิน SLA ' + days + ' วัน' : days + ' วัน';
  return '<div class="flow">' + dots + ' ' + esc(label) + '</div>';
}
function pill(status, sla, th) {
  const cls = sla === 'over' ? 'p-bad'
    : (status === 'closed' || status === 'boxed') ? 'p-ok'
    : (sla === 'critical' || sla === 'warning') ? 'p-warn' : 'p-mute';
  return '<span class="pill ' + cls + '">' + esc(th[status] || status || '—') + '</span>';
}

/* ---------- โหลดสรุป ---------- */
async function load() {
  $('view').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  try {
    dash = await call('docsDashboard');
    const s = dash.summary, sla = dash.sla || {};
    $('slaInfo').textContent =
      'PDF ภายใน ' + sla.pdf_days + ' วัน · เอกสารตัวจริงภายใน ' + sla.paper_days + ' วัน';

    const k = (n, label, cls, act) =>
      '<div class="kpi ' + (cls || '') + (act ? ' click' : '') + '"' +
      (act ? ' data-act="' + act + '"' : '') + '>' +
      '<div class="n">' + n + '</div><div class="k">' + label + '</div></div>';

    $('kpis').innerHTML =
      k(s.total, 'เอกสารที่ยังไม่ปิดงาน') +
      k(s.scanned + s.verified + s.sent + s.closed, 'PDF พร้อมใช้งาน', 'ok') +
      k(s.pdf_over_sla, 'PDF เกิน SLA', s.pdf_over_sla ? 'bad' : 'ok', 'pdf_over') +
      k(s.paper_received, 'รอเข้ากล่องจัดเก็บ', s.paper_received ? 'warn' : '', 'to_box') +
      k(s.ocr_mismatch + s.missing_pdf, 'ต้องแก้ไข',
        (s.ocr_mismatch + s.missing_pdf) ? 'bad' : 'ok', 'fix');

    $('kpis').querySelectorAll('[data-act]').forEach(el =>
      el.addEventListener('click', () => quick(el.dataset.act)));

    const first = (dash.exceptions && dash.exceptions[0]) ? dash.exceptions[0].ref_no : '';
    $('hint').innerHTML = 'ลองค้น: ' +
      (first ? '<code data-q="' + esc(first) + '">' + esc(first) + '</code> ' : '') +
      '<code data-q="LOSCAM">LOSCAM</code> <code data-q="BOX-">BOX-</code>' +
      ' · ค้นได้เฉพาะเอกสารที่ยังไม่ปิดงาน';
    $('hint').querySelectorAll('[data-q]').forEach(el =>
      el.addEventListener('click', () => { $('q').value = el.dataset.q; doSearch(); }));

    showExceptions();
  } catch (err) {
    $('view').innerHTML = '';
    showError('โหลดข้อมูลไม่สำเร็จ: ' + (err.message || err));
  }
}

function quick(act) {
  $('q').value = ''; $('fBox').value = '';
  $('fPdf').value = ''; $('fPaper').value = '';
  if (act === 'to_box') { $('fPaper').value = 'received'; doSearch(); return; }
  showExceptions(act);
}

function showExceptions(filter) {
  let ex = (dash && dash.exceptions) || [];
  if (filter === 'pdf_over') ex = ex.filter(e => /เกิน SLA/.test(e.reason));
  if (filter === 'fix') ex = ex.filter(e => /ไม่ตรง|ไม่มีไฟล์/.test(e.reason));

  $('rTitle').textContent = 'รายการที่ต้องดำเนินการ';
  $('rCount').textContent = ex.length + ' รายการ';
  rowsData = ex.map(e => ({
    ref_no: e.ref_no, barcode: e.barcode, doc_date: e.doc_date,
    dest_warehouse: e.dest_warehouse || e.site,
    pdf_status: e.pdf_status, paper_status: e.paper_status,
    sla_pdf: /PDF เกิน SLA/.test(e.reason) ? 'over' : 'normal', sla_pdf_days: e.pdf_days,
    sla_paper: /กระดาษยังไม่เข้ากล่อง/.test(e.reason) ? 'over' : 'normal',
    sla_paper_days: e.paper_days, box_id: '', reason: e.reason
  }));

  render(ex.length ? null :
    '<b>ไม่มีรายการที่ต้องดำเนินการ</b>ทุกอย่างอยู่ในกำหนด<br>' +
    'ใช้ช่องค้นหาด้านบนเพื่อดูเอกสารใบใดใบหนึ่ง');
}

/* ---------- ค้นหา ---------- */
$('btnSearch').addEventListener('click', doSearch);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
['fPdf', 'fPaper'].forEach(id => $(id).addEventListener('change', doSearch));
$('fBox').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
$('btnClear').addEventListener('click', () => {
  ['q', 'fBox', 'fFrom', 'fTo'].forEach(i => $(i).value = '');
  $('fPdf').value = ''; $('fPaper').value = '';
  showExceptions();
});
$('btnReload').addEventListener('click', () =>
  call('docsDashboard', { fresh: true })
    .then(d => { dash = d; load(); })
    .catch(e => showError(e.message)));

async function doSearch() {
  $('view').innerHTML = '<div class="empty">กำลังค้นหา…</div>';
  try {
    const r = await call('docsSearch', {
      q: $('q').value.trim(),
      filters: {
        pdf_status: $('fPdf').value, paper_status: $('fPaper').value,
        box_id: $('fBox').value.trim(),
        date_from: $('fFrom').value, date_to: $('fTo').value
      }
    });
    rowsData = r.results || [];
    $('rTitle').textContent = 'ผลการค้นหา';
    $('rCount').textContent = r.count + ' รายการ' + (r.truncated ? ' (แสดง 200 แรก)' : '');
    render(rowsData.length ? null :
      '<b>ไม่พบเอกสารที่ตรงกับเงื่อนไข</b>' +
      'ลองลดเงื่อนไขลง หรือตรวจว่าเอกสารถูกนำเข้าระบบแล้ว<br>' +
      'ค้นได้เฉพาะเอกสารที่ยังไม่ปิดงาน');
  } catch (err) {
    $('view').innerHTML = '<div class="empty">' + esc(err.message || err) + '</div>';
  }
}

/* ---------- ตาราง ---------- */
function render(emptyMsg) {
  if (emptyMsg) { $('view').innerHTML = '<div class="empty">' + emptyMsg + '</div>'; return; }

  $('view').innerHTML = '<div class="tw"><table><thead><tr>' +
    '<th style="width:170px">Reference</th>' +
    '<th style="width:112px">วันที่เอกสาร</th>' +
    '<th style="width:200px">ปลายทาง</th>' +
    '<th style="width:190px">PDF</th>' +
    '<th style="width:200px">เอกสารตัวจริง</th>' +
    '<th>กล่องจัดเก็บ</th>' +
    '</tr></thead><tbody>' +
    rowsData.map(rowHtml).join('') + '</tbody></table></div>';

  $('view').querySelectorAll('tr.main').forEach(tr =>
    tr.addEventListener('click', () => toggle(tr.dataset.ref)));
}

function rowHtml(d) {
  return '<tr class="main" data-ref="' + esc(d.ref_no) + '">' +
    '<td><div class="ref">' + esc(d.ref_no) + '</div>' +
      '<div class="sub">' + (esc(d.barcode) || '—') + '</div></td>' +
    '<td class="mono">' + fmt(d.doc_date) + '</td>' +
    '<td>' + (esc(d.dest_warehouse) || '—') + '</td>' +
    '<td>' + pill(d.pdf_status, d.sla_pdf, PDF_TH) +
      flow(PDF_SEQ, d.pdf_status, d.sla_pdf, d.sla_pdf_days) + '</td>' +
    '<td>' + pill(d.paper_status, d.sla_paper, PAPER_TH) +
      flow(PAPER_SEQ, d.paper_status, d.sla_paper, d.sla_paper_days) + '</td>' +
    '<td class="mono">' + (d.box_id ? esc(d.box_id)
      : '<span style="color:var(--muted)">ยังไม่เข้ากล่อง</span>') +
      (d.reason ? '<div class="sub" style="color:var(--danger)">' + esc(d.reason) + '</div>' : '') +
    '</td></tr>' +
    '<tr class="detail" data-d="' + esc(d.ref_no) + '" style="display:none"><td colspan="6"></td></tr>';
}

/* ---------- รายละเอียดกางในตาราง ---------- */
async function toggle(ref) {
  const sel = '[data-ref="' + CSS.escape(ref) + '"]';
  const row = $('view').querySelector('tr.main' + sel);
  const det = $('view').querySelector('tr.detail[data-d="' + CSS.escape(ref) + '"]');
  if (!det) return;

  if (det.style.display !== 'none') {
    det.style.display = 'none'; row.classList.remove('open'); return;
  }
  // เปิดทีละใบ ไม่งั้นตารางยาวจนหาแถวที่กำลังดูไม่เจอ
  $('view').querySelectorAll('tr.detail').forEach(x => x.style.display = 'none');
  $('view').querySelectorAll('tr.main').forEach(x => x.classList.remove('open'));

  det.style.display = 'table-row';
  row.classList.add('open');
  det.firstElementChild.innerHTML = '<div class="empty">กำลังโหลด…</div>';

  try {
    const r = await call('docsDetail', { ref_no: ref });
    det.firstElementChild.innerHTML = r.found ? detailHtml(r)
      : '<div class="empty">ไม่พบรายละเอียดของเอกสารนี้</div>';
  } catch (err) {
    det.firstElementChild.innerHTML = '<div class="empty">' + esc(err.message) + '</div>';
  }
}

const EV_TH = { scanned:'สแกนเข้าระบบ', with_delivery:'ทีมจัดส่งรับเอกสาร',
  with_warehouse:'ส่งเอกสารตัวจริงไปคลัง', received_warehouse:'คลังรับเอกสาร',
  archived:'จัดเก็บเข้ากล่อง', disputed:'แจ้งปัญหา', resolved:'แก้ไขปัญหาแล้ว',
  batch_closed:'ปิดชุดเอกสาร', lost_document:'ไม่พบเอกสาร' };

function drivePreview(url) {
  const m = String(url).match(/[-\w]{25,}/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w400' : url;
}

function detailHtml(r) {
  const d = r.doc, sla = r.sla, box = r.box;
  const kv = [
    ['บาร์โค้ด', esc(d.barcode) || '—'],
    ['วันที่เอกสาร', fmt(d.doc_date)],
    ['ประเภท', esc(d.item_name) || '—'],
    ['โอนจาก', esc(d.transfer_from) || '—'],
    ['โอนไป', esc(d.transfer_to) || '—'],
    ['จำนวน', (d.sent_qty || '—') + ' / ' + (d.received_qty || '—')],
    ['อ่านโดย', d.read_source === 'barcode' ? 'บาร์โค้ด'
              : d.read_source === 'ocr' ? 'OCR' : 'กรอกเอง'],
    ['สถานะ PDF', esc(PDF_TH[d.pdf_status] || d.pdf_status || '—') +
                  ' · ' + esc(sla.pdf.days) + ' วัน'],
    ['สถานะกระดาษ', esc(PAPER_TH[d.paper_status] || d.paper_status || '—')],
    ['ชุดที่ส่ง', esc(d.batch_id) || '—']
  ].map(p => '<div class="k">' + esc(p[0]) + '</div><div>' + p[1] + '</div>').join('');

  const boxCard = box
    ? '<div class="boxcard">' +
      (box.photo_url
        ? '<img src="' + drivePreview(box.photo_url) + '" alt="ตำแหน่งจัดเก็บ" ' +
          'onclick="window.open(\'' + esc(box.photo_url) + '\',\'_blank\')">'
        : '<div class="ph">📦</div>') +
      '<div><div class="bid">' + esc(box.box_name || box.box_id) + '</div>' +
      '<div class="bl">' + esc(box.box_id) + ' · ' + box.item_count + '/' + box.capacity + ' ใบ<br>' +
      (esc(box.location) || 'ยังไม่ระบุตำแหน่ง') +
      (box.destroy_after ? ' · ครบกำหนดทำลาย ' + fmt(box.destroy_after) : '') +
      '</div></div></div>'
    : '<div class="boxcard"><div class="ph">📦</div><div>' +
      '<div class="bid">ยังไม่เข้ากล่อง</div>' +
      '<div class="bl">เอกสารตัวจริงยังไม่ถูกจัดเก็บ</div></div></div>';

  const events = (r.events || []).length
    ? r.events.map(e => '<div class="ev">' +
        '<div class="t">' + fmtT(e.at) + '</div>' +
        '<div>' + esc(EV_TH[e.status] || e.status) +
          (e.note ? ' · ' + esc(e.note) : '') + '</div>' +
        '<div class="who">' + (esc(e.emp_name) || esc(e.emp_id) || '—') +
          (e.site ? ' · ' + esc(e.site) : '') + '</div></div>').join('')
    : '<div class="ev"><div>ยังไม่มีประวัติ</div></div>';

  return '<div class="dwrap"><div class="dsec">' +
    '<h4>ข้อมูลเอกสาร</h4><div class="kv">' + kv + '</div>' + boxCard +
    '<div class="dacts">' +
    (d.pdf_url
      ? '<a class="btn ghost" href="' + esc(d.pdf_url) + '" target="_blank">เปิดไฟล์ PDF</a>'
      : '<button class="btn ghost" disabled>ไม่มีไฟล์ PDF</button>') +
    '<button class="btn ghost" data-slip="' + esc(d.ref_no) + '">พิมพ์ใบขอเบิกเอกสาร</button>' +
    '</div></div>' +
    '<div class="dsec"><h4>ประวัติการดำเนินการ</h4><div class="tl">' + events + '</div></div>' +
    '</div>';
}

/* ---------- ใบขอเบิกเอกสาร ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-slip]');
  if (b) { e.stopPropagation(); printSlip(b.dataset.slip); }
});

async function printSlip(ref) {
  let r;
  try { r = await call('docsDetail', { ref_no: ref }); }
  catch (err) { alert(err.message); return; }
  if (!r.found) { alert('ไม่พบเอกสาร'); return; }

  const d = r.doc, box = r.box;
  const rows = [
    ['เลข Reference', '<span class="big">' + esc(d.ref_no) + '</span>'],
    ['บาร์โค้ด', '<span class="mono">' + (esc(d.barcode) || '—') + '</span>'],
    ['ประเภท', esc(d.item_name) || '—'],
    ['โอนจาก', esc(d.transfer_from) || '—'],
    ['โอนไป', esc(d.transfer_to) || '—'],
    ['วันที่เอกสาร', fmt(d.doc_date)],
    ['กล่องจัดเก็บ', box
      ? '<span class="mono">' + esc(box.box_id) + '</span>' +
        (box.box_name ? '<br>' + esc(box.box_name) : '')
      : 'ยังไม่เข้ากล่อง'],
    ['ตำแหน่ง', box ? (esc(box.location) || '—') : '—']
  ].map(p => '<tr><td class="k">' + esc(p[0]) + '</td><td>' + p[1] + '</td></tr>').join('');

  const w = window.open('', '_blank', 'width=780,height=920');
  if (!w) { alert('เบราว์เซอร์บล็อกหน้าต่างใหม่ — อนุญาต popup แล้วลองอีกครั้ง'); return; }

  w.document.write(
    '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">' +
    '<title>ใบขอเบิกเอกสาร ' + esc(ref) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">' +
    '<style>body{font-family:"IBM Plex Sans Thai",sans-serif;padding:40px;color:#111;line-height:1.7}' +
    'h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#666;margin-bottom:22px}' +
    'table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:22px}' +
    'td{padding:8px 10px;border-bottom:1px solid #ddd;vertical-align:top}' +
    'td.k{width:150px;color:#666}.mono{font-family:"IBM Plex Mono",monospace}' +
    '.big{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600}' +
    '.sig{margin-top:48px;display:flex;gap:44px}' +
    '.sig div{flex:1;border-top:1px solid #999;padding-top:8px;font-size:12.5px;color:#666}' +
    '@media print{body{padding:20px}}</style></head><body>' +
    '<h1>ใบขอเบิกเอกสารตัวจริง</h1>' +
    '<div class="sub">พิมพ์เมื่อ ' + new Date().toLocaleString('th-TH') +
      ' · โดย ' + esc(session.empName || session.empId) + '</div>' +
    '<table>' + rows + '</table>' +
    '<div class="sig"><div>ผู้ขอเบิก &nbsp; วันที่</div>' +
    '<div>ผู้อนุมัติ &nbsp; วันที่</div><div>ผู้คืนเอกสาร &nbsp; วันที่</div></div>' +
    '</body></html>');
  w.document.close();
  setTimeout(() => { try { w.print(); } catch (e) {} }, 600);
}

/* ---------- ดาวน์โหลด CSV ---------- */
$('btnCsv').addEventListener('click', () => {
  if (!rowsData.length) { alert('ไม่มีข้อมูลให้ดาวน์โหลด'); return; }
  const cols = ['ref_no','barcode','doc_date','dest_warehouse','pdf_status',
                'sla_pdf_days','paper_status','sla_paper_days','box_id'];
  const head = ['Reference','บาร์โค้ด','วันที่เอกสาร','ปลายทาง','สถานะ PDF',
                'PDF (วัน)','สถานะกระดาษ','กระดาษ (วัน)','กล่องจัดเก็บ'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  // ใส่ BOM เพื่อให้ Excel เปิดภาษาไทยไม่เพี้ยน
  const csv = '\ufeff' + [head.map(q).join(',')]
    .concat(rowsData.map(r => cols.map(c => q(r[c])).join(','))).join('\r\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'docscan-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
</script>
