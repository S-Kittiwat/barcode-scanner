<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%23f1f5f9'/%3E%3Crect x='11' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='14.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3Crect x='17' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='20.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocScan — ติดตามเอกสาร</title>
<script src="config.js"></script>
<link rel="stylesheet" href="css/auth.css">
<style>
  body{display:block;padding:0;align-items:stretch}
  .wrap{max-width:1340px;margin:0 auto;padding:22px 24px 90px}

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20}
  .topbar .back{color:var(--accent);text-decoration:none;font-size:13.5px}
  .tb-title{border-left:1px solid var(--border);padding-left:18px}
  .tb-name{font-size:16px;font-weight:600}
  .tb-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .tb-user{margin-left:auto;text-align:right;font-size:12.5px}
  .tb-site{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

  /* ช่องค้นหาเป็นพระเอกของหน้านี้ */
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:22px;margin-bottom:16px}
  .srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sbox{flex:1;min-width:280px;position:relative}
  .sbox input{width:100%;background:var(--surface2);border:1.5px solid var(--accent);
    border-radius:10px;color:var(--text);font-family:var(--mono);font-size:19px;
    padding:15px 15px 15px 48px;letter-spacing:.05em;outline:none}
  .sbox .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
  .btn{border:none;border-radius:var(--rs);padding:14px 24px;font-family:var(--font);
    font-size:14.5px;font-weight:600;cursor:pointer;background:var(--accent);color:#0f172a}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);
    font-weight:400;padding:10px 16px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  /* ตะกร้า */
.csum .cw{color:var(--warn)} .csum .cbad{color:var(--danger)}
.cfoot .btn{width:100%;padding:11px}
body.cart-on .wrap{padding-right:324px}

/* กล่องวางรายการ */
#dlgPaste{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);padding:22px;max-width:520px;width:92vw;margin:auto;inset:0}
#dlgPaste::backdrop{background:rgba(15,23,42,.82)}
#pasteBox{width:100%;height:210px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);font-family:var(--mono);font-size:13.5px;
  padding:12px;resize:vertical;line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.7}
  .hint code{font-family:var(--mono);color:var(--accent);background:var(--surface2);
    padding:1px 7px;border-radius:4px;cursor:pointer}

    .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11.5px;color:var(--muted)}
  .fld select,.fld input{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--rs);color:var(--text);font-family:var(--font);font-size:13px;padding:8px 11px}

  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
  .kpi .n{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.15}
  .kpi .k{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .kpi.bad{border-color:rgba(248,113,113,.5)} .kpi.bad .n{color:var(--danger)}
  .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--success)}
  .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--accent)}

  .rhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .rhead h2{font-size:14px;font-weight:600}
  .rhead .c{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  .rhead .r{margin-left:auto;display:flex;gap:10px;align-items:center}

  .tw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--surface2);
    border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr.main{cursor:pointer}
  tbody tr.main:hover td{background:var(--surface2)}
  tbody tr.main.open td{background:var(--surface2)}
  .mono{font-family:var(--mono)}
  .ref{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.03em}
  .sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}

  .pill{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 9px;
    border-radius:11px;border:1px solid;white-space:nowrap}
  .p-ok{color:var(--success);border-color:var(--success)}
  .p-warn{color:var(--warn);border-color:var(--warn)}
  .p-bad{color:var(--danger);border-color:var(--danger)}
  .p-mute{color:var(--muted);border-color:var(--border)}

  /* จุดบอกความคืบหน้า อ่านเร็วกว่าตัวหนังสือเมื่อกวาดสายตาทั้งตาราง */
  .flow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
  .dot.on{background:var(--success)} .dot.now{background:var(--accent)}
  .dot.late{background:var(--danger)}

  .detail td{background:#16202f;padding:0}
  .dwrap{padding:20px 24px;display:grid;gap:26px;grid-template-columns:1.15fr 1fr}
  .dsec h4{font-size:11px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);margin-bottom:11px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13px}
  .kv .k{color:var(--muted)}
  .tl{border-left:2px solid var(--border);padding-left:16px;margin-left:5px}
  .ev{position:relative;padding-bottom:15px;font-size:12.5px}
  .ev:last-child{padding-bottom:0}
  .ev::before{content:'';position:absolute;left:-22px;top:4px;width:9px;height:9px;
    border-radius:50%;background:var(--success);border:2px solid var(--bg)}
  .ev .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ev .who{font-size:11.5px;color:var(--muted)}
  .boxcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
    padding:13px 15px;margin-top:12px;display:flex;gap:13px;align-items:center}
  .boxcard img{width:62px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0;
    cursor:zoom-in;border:1px solid var(--border)}
  .boxcard .ph{width:62px;height:62px;border-radius:6px;background:var(--bg);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:21px}
  .boxcard .bid{font-family:var(--mono);font-size:13.5px;font-weight:600}
  .boxcard .bl{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
  .dacts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .dacts a{text-decoration:none;display:inline-block}

  .empty{color:var(--muted);font-size:13.5px;padding:34px;text-align:center;
    border:1px dashed var(--border);border-radius:var(--r);line-height:1.8}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
   }

/* ── หน้าติดตามเอกสาร ── */

.tab b{margin-left:6px;font-family:var(--mono)}
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:38px;text-align:center;color:var(--muted);font-size:13.5px}

.ref{font-family:var(--mono);font-size:13.5px;font-weight:600}
.sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.sub.note{color:var(--text);opacity:.75;font-style:italic}
.bad{color:var(--danger)} .warn{color:var(--warn)} .ok{color:var(--success)}
tr.lv-over td{background:rgba(248,113,113,.07)}
tr.lv-over td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr.lv-critical td:first-child{box-shadow:inset 3px 0 0 var(--warn)}


#dlgReason{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);padding:20px;max-width:560px;width:94vw;
  margin:auto;inset:0;max-height:90vh;overflow:auto}
#dlgReason::backdrop{background:rgba(15,23,42,.82)}
 .rs-gl.bad{color:var(--danger)}
 .rs-gl.muted{color:var(--muted)}
.rs-fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.rs-fld input,.rs-fld select{width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--rs);color:var(--text);
  padding:9px 11px;font-family:var(--font);font-size:13px}
.rs-act .hint{margin-right:auto;text-align:left}

/* กล่องแจ้งข้อผิดพลาด — ถูกลบไปตอนตัด CSS ที่ไม่เกี่ยว
   ต้องมี ไม่งั้นข้อความผิดพลาดจะไม่แสดงอะไรเลย */
.shp-alert{display:none;background:rgba(248,113,113,.1);border:1px solid var(--danger);
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13px}
.shp-alert.on{display:block}

/* แถบเตือน */
.dupbanner{display:none;background:rgba(251,191,36,.1);border:1px solid var(--warn);
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13px;line-height:1.8}
.dupbanner.bad{background:rgba(248,113,113,.1);border-color:var(--danger)}

/* แถวที่ระบบยังไม่รู้จักไซต์ — ต้องเห็นชัดว่าต่างจากแถวปกติ */

/* ตะกร้าเอกสารที่เลือก */
.btn.sm{padding:4px 10px;font-size:12px}

/* ── หน้าส่งเอกสารตัวจริง ── */





/* ใบปะหน้า — ต้องพิมพ์ออกมาแล้วอ่านง่ายบนกระดาษขาว
   จึงใช้สีตรงข้ามกับหน้าจอ ไม่ใช่สีเดียวกัน */

@media print{
  body>*:not(.cover-wrap){display:none !important}
  .cover-wrap,.cover{display:block !important;margin:0;padding:0}
  .cover{box-shadow:none;border-radius:0}
  .noprint{display:none !important}
}
.bldtag{position:fixed;right:8px;bottom:6px;z-index:5;font-family:var(--mono);
  font-size:10px;color:var(--muted);opacity:.5;pointer-events:none}
@media print{.bldtag{display:none}}

/* ============================================================
   ใบส่งมอบเอกสาร
   ============================================================
   ออกแบบให้ผู้รับตรวจของได้จากใบนี้โดยไม่ต้องเปิดระบบ
   ผู้ส่งกับผู้รับแยกกล่องกันชัด แบบใบปะหน้าพัสดุ
   ============================================================ */
.cover-wrap{display:none;max-width:1000px;margin:0 auto;padding:20px 24px 80px}
.cover{background:#fff;color:#111;border-radius:8px;padding:18px 22px;
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;line-height:1.4}

/* หัวเอกสาร — บาร์โค้ดอยู่ซ้ายสุด */
.cover .hd{display:flex;align-items:flex-start;gap:16px;
  padding-bottom:9px;border-bottom:2px solid #111;margin-bottom:10px}
.cover .hd-bc{flex:none}
.cover .hd-bc svg{display:block}
.cover .hd-tt{flex:1;padding-top:2px}
.cover .hd-tt h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.cover .hd-sub{font-size:11.5px;color:#666;margin-top:2px}
.cover .hd-no{text-align:right;flex:none;min-width:150px}
.cover .hd-no .k{font-size:9.5px;color:#666;text-transform:uppercase;
  letter-spacing:.05em}
.cover .hd-no .v{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700}
.cover .hd-no .v.sm{font-size:11.5px;font-weight:500}

/* ผู้ส่ง / ผู้รับ */
.cover .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cover .hs-box{border:1px solid #bbb;border-radius:5px;padding:7px 10px}
.cover .hs-box.to{border:2px solid #111;background:#fafafa}
.cover .hs-box-t{font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:#666;padding-bottom:4px;margin-bottom:5px;
  border-bottom:1px solid #ddd}
.cover .hs-box.to .hs-box-t{color:#111}
.cover .row{display:flex;gap:8px;font-size:11.5px;padding:1px 0}
.cover .row .k{width:84px;flex:none;color:#666}
.cover .row .v{font-weight:600;flex:1}
.cover .row .v.big{font-size:13px}

.cover .note{border:1px solid #ddd;border-radius:5px;padding:8px 12px;
  font-size:12px;margin-bottom:14px;background:#fafafa}

/* รายการเอกสาร */
.cover table.items{width:100%;border-collapse:collapse;margin-bottom:12px;
  font-size:10.5px}
.cover .items th,.cover .items td{border:1px solid #ccc;padding:2.5px 5px;
  text-align:left;vertical-align:middle}
.cover .items th{background:#eee;font-weight:600;font-size:9.5px}
/* หัวตารางซ้ำทุกหน้าเวลาพิมพ์ เพราะ 200 รายการกินหลายหน้า */
.cover .items thead{display:table-header-group}
.cover .items tr{page-break-inside:avoid}
.cover .items td.c{text-align:center}
.cover .items td.r{text-align:right;font-weight:600}
.cover .items .mono{font-family:'IBM Plex Mono',monospace;font-weight:600}
.cover .items .sm{font-size:10.5px}
.cover .items .ar{color:#999}
/* ช่องให้ผู้รับติ๊กตอนตรวจนับ */
.cover .items .chkbox{width:34px}
.cover .items tbody .chkbox::after{content:'';display:block;width:13px;height:13px;
  border:1.5px solid #666;margin:0 auto}
.cover .items tfoot td{background:#f5f5f5;font-weight:700}

/* ลายเซ็น */
.cover .sign{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:4px;
  page-break-inside:avoid}
.cover .sg{border:1px solid #ddd;border-radius:5px;padding:8px 10px}
.cover .sg-t{font-size:10.5px;font-weight:700;margin-bottom:8px}
.cover .ln{border-bottom:1px dotted #999;height:19px;margin-bottom:7px;
  font-size:9.5px;color:#888}
.cover .ft{margin-top:12px;padding-top:7px;border-top:1px solid #ddd;
  font-size:9px;color:#777;text-align:center;line-height:1.6}

.cover-act{display:flex;gap:10px;justify-content:center;margin-top:18px}

@media print{
  @page{size:A4 portrait;margin:10mm 12mm}
  body>*:not(.cover-wrap){display:none !important}
  .cover-wrap{display:block !important;max-width:none;margin:0;padding:0}
  .cover{border-radius:0;padding:0;box-shadow:none}
  .noprint{display:none !important}
  .cover .items{font-size:9.5px}
  .cover .items th,.cover .items td{padding:2px 4px}
}

/* ── หน้าชุดที่ส่งไปแล้ว ── */
.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);padding:8px 11px;
  font-family:var(--font);font-size:13px}
.filters input{min-width:210px}
/* ช่องวันที่แคบกว่าช่องค้นหา และปรับสีปุ่มปฏิทินให้เข้ากับธีมมืด */
.filters input[type=date]{min-width:auto;width:140px;color-scheme:dark}
.grow{flex:1}

.blist{display:flex;flex-direction:column;gap:11px}

.bcard{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px}
.bcard.cancelled{opacity:.6;border-style:dashed}
.bcard.received,.bcard.kept{border-color:rgba(52,211,153,.4)}
/* ชุดที่ค้างนานต้องเห็นชัด ไม่งั้นจะค้างไปเรื่อยโดยไม่มีใครสังเกต */
.bcard.late{border-color:var(--danger)}

.bc-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bc-id{font-family:var(--mono);font-size:17px;font-weight:700}
.bc-when{font-size:11.5px;color:var(--muted);margin-top:2px}
.bc-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;
  border:1px solid var(--border);color:var(--muted)}
.bc-badge.sent{border-color:var(--warn);color:var(--warn)}
.bc-badge.got{border-color:var(--success);color:var(--success)}
.bc-badge.cx{border-color:var(--danger);color:var(--danger)}
.bc-act{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}

.bc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
.bk{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bv{font-size:13px;font-weight:600;margin-top:2px}

.bc-refs{margin-top:11px;font-size:11.5px;color:var(--muted);
  font-family:var(--mono);line-height:1.8;word-break:break-all}
.bc-note{margin-top:9px;font-size:12px;color:var(--warn);line-height:1.6}

.btn.sm{padding:5px 11px;font-size:12px}
/* ลิงก์ที่ใช้เป็นปุ่ม ต้องจัดกึ่งกลางเองเพราะ a ไม่ใช่ flex โดยปริยาย */
a.btn{display:inline-flex;align-items:center;text-decoration:none}
</style>
</head>
<body>

<div class="topbar noprint">
  <a class="back" href="home.html">← หน้าหลัก</a>
  <div class="tb-title">
    <div class="tb-name">ชุดที่จะมาถึง</div>
    <div class="tb-sub" id="scopeInfo">เอกสารที่ต้นทางส่งมาให้คลังนี้</div>
  </div>
  <div class="tb-user">
    <span id="who">—</span>
    <div class="tb-site" id="whoSite"></div>
  </div>
</div>

<div class="wrap noprint" id="mainWrap">
  <div class="shp-alert" id="alert"></div>

  <div class="filters">
    <input id="q" placeholder="ค้นเลขชุด ต้นทาง หรือเลข Reference" autocomplete="off">
    <select id="fStatus">
      <option value="waiting">รอรับ</option>
      <option value="">ทุกสถานะ</option>
      <option value="received">รับแล้ว</option>
      <option value="cancelled">ยกเลิกแล้ว</option>
    </select>
    <select id="fDate">
      <option value="">ทุกวัน</option>
      <option value="0">วันนี้</option>
      <option value="1">เมื่อวาน</option>
      <option value="7">7 วันล่าสุด</option>
      <option value="30">30 วันล่าสุด</option>
    </select>
    <div class="grow"></div>
    <span class="hint" id="cnt"></span>
    <button class="btn ghost" id="btnReload">รีเฟรช</button>
  </div>

  <div class="blist" id="blist"></div>
</div>

<script type="module">

import { authFetch, requireAuth, logout } from './js/auth.js';
import { installNav, guardPage } from './js/nav.js';
import { installSupport, installErrorCapture } from './js/support.js';
import { installRefBar } from './js/refstatus.js';

const API = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);

const session = requireAuth();
if (session) {
  if (!guardPage(session)) throw new Error('no access');
  installNav(session, { onLogout: () => logout(API) });
  $('who').textContent = session.empName || session.empId || '';
  $('whoSite').textContent = session.site || '';

  try {
    installErrorCapture();
    installSupport(session, call);
  } catch (e) {
    console.error('[DocScan] ติดตั้งส่วนเสริมไม่สำเร็จ', e);
  }
}

async function call(action, payload = {}, timeoutMs) {
  try {
    return await authFetch(API, { action, ...payload },
      timeoutMs ? { timeoutMs } : undefined);
  } catch (err) {
    if (err.code === 'auth_required') {
      alert('เซสชันหมดอายุ'); location.href = 'login.html';
    }
    throw err;
  }
}

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

try { installRefBar(call); }
catch (e) { console.error('[DocScan] แถบสถานะติดตั้งไม่สำเร็จ', e); }

const CHANNEL_LABEL = {
  company_van: 'รถบริษัท', courier: 'ขนส่งเอกชน',
  post: 'ไปรษณีย์', hand: 'คนถือไปเอง',
  keep_self: 'เก็บไว้เอง ไม่ได้ส่งออก'
};

function fmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleString('th-TH', { day:'2-digit', month:'short', year:'2-digit',
                                     hour:'2-digit', minute:'2-digit' });
}

/** กี่วันแล้วตั้งแต่ส่ง — ใช้เตือนชุดที่ค้างนาน */
function daysSince(v) {
  if (!v) return null;
  const d = new Date(v);
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

let batches = [];
let isAll = false;      // เห็นทุกไซต์หรือเฉพาะของตัวเอง

async function load() {
  $('blist').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  try {
    const r = await call('shipBatchList', {}, 60000);
    if (!r || r.status !== 'ok') throw new Error((r && r.message) || 'โหลดไม่สำเร็จ');
    if (!Array.isArray(r.rows)) {
      throw new Error('เซิร์ฟเวอร์ไม่ได้ส่งรายการกลับมา\n' +
        'มักเกิดเมื่อยังไม่ได้ Deploy Documents.gs เป็นเวอร์ชันใหม่');
    }

    /* หน้านี้คือ "ของที่กำลังมาหาเรา" จึงเอาเฉพาะที่ปลายทางเป็นไซต์เรา
     *
     * บัญชีที่ไซต์เป็น ALL หรือเป็นผู้ดูแล เห็นทุกชุด
     * เพราะต้องดูภาพรวมว่ามีอะไรค้างที่ไหนบ้าง
     */
    const mySite = String((session && session.site) || '').trim();
    const role = String((session && session.role) || '').toLowerCase();
    isAll = role === 'admin' || role === 'central' ||
            mySite.toUpperCase() === 'ALL';

    batches = isAll ? r.rows : r.rows.filter(b =>
      String(b.to_site || '').trim() === mySite);

    $('scopeInfo').textContent = isAll
      ? 'เอกสารที่กำลังส่งมา — ทุกคลัง'
      : 'เอกสารที่ต้นทางส่งมาให้ ' + mySite;

    render();
  } catch (e) {
    console.error('[DocScan] โหลดชุดที่จะมาถึงไม่สำเร็จ', e);
    $('blist').innerHTML = '<div class="empty">โหลดไม่สำเร็จ<br>' +
      '<span class="hint">' + esc(e.message || String(e)) + '</span></div>';
  }
}

function statusOf(b) {
  if (String(b.status || '') === 'cancelled') return 'cancelled';
  if (b.channel === 'keep_self') return 'kept';
  if (b.received_at) return 'received';
  return 'waiting';
}

function inDateRange(b) {
  const mode = $('fDate').value;
  if (!mode) return true;
  const t = new Date(b.created_at);
  if (isNaN(t.getTime())) return false;
  t.setHours(0, 0, 0, 0);

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const n = Number(mode);
  if (n === 1) return t.getTime() === today.getTime() - 86400000;
  return t.getTime() >= today.getTime() - n * 86400000 &&
         t.getTime() <= today.getTime();
}

function shown() {
  const q = $('q').value.trim().toUpperCase();
  const st = $('fStatus').value;
  return batches.filter(b => {
    if (st && statusOf(b) !== st) return false;
    if (!inDateRange(b)) return false;
    if (!q) return true;
    return String(b.batch_id).toUpperCase().includes(q) ||
           String(b.from_site || '').toUpperCase().includes(q) ||
           (b.refs || []).some(r => String(r).toUpperCase().includes(q));
  });
}

function render() {
  const rows = shown();

  /* ชุดที่รอรับนานสุดขึ้นก่อน เพราะเป็นตัวที่ต้องตามมากที่สุด */
  rows.sort((a, b) => {
    const wa = statusOf(a) === 'waiting', wb = statusOf(b) === 'waiting';
    if (wa !== wb) return wa ? -1 : 1;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  const waiting = batches.filter(b => statusOf(b) === 'waiting');
  const docs = waiting.reduce((a, b) => a + (Number(b.doc_count) || 0), 0);
  $('cnt').textContent = rows.length + ' ชุด' +
    (waiting.length ? ' · รอรับ ' + waiting.length + ' ชุด ' + docs + ' ฉบับ' : '');

  if (!rows.length) {
    $('blist').innerHTML = '<div class="empty">' +
      (batches.length ? 'ไม่มีชุดที่ตรงกับที่ค้น' : 'ยังไม่มีเอกสารส่งมา') +
      '</div>';
    return;
  }

  $('blist').innerHTML = rows.map(cardHtml).join('');

  $('blist').querySelectorAll('[data-refs]').forEach(b =>
    b.addEventListener('click', () => {
      const box = document.getElementById('refs-' + b.dataset.refs);
      const open = box.style.display !== 'none';
      box.style.display = open ? 'none' : '';
      b.textContent = open ? 'ดูรายการ' : 'ซ่อนรายการ';
    }));
}

function cardHtml(b) {
  const st = statusOf(b);
  const age = daysSince(b.created_at);

  /* ส่งมานานแล้วยังไม่รับ = ต้องตามต่อ
     ถ้าไม่เน้นให้เห็น จะค้างไปเรื่อยโดยไม่มีใครสังเกต */
  const late = st === 'waiting' && age != null && age >= 2;

  const badge = st === 'cancelled'
      ? '<span class="bc-badge cx">ยกเลิกแล้ว</span>'
    : st === 'kept'
      ? '<span class="bc-badge got">ต้นทางเก็บไว้เอง</span>'
    : st === 'received'
      ? '<span class="bc-badge got">รับแล้ว ' + fmt(b.received_at) + '</span>'
      : '<span class="bc-badge ' + (late ? 'cx' : 'sent') + '">' +
        (age != null ? 'รอรับ ' + age + ' วัน' : 'รอรับ') + '</span>';

  return `<div class="bcard ${st}${late ? ' late' : ''}">
    <div class="bc-top">
      <div>
        <div class="bc-id">${esc(b.batch_id)}</div>
        <div class="bc-when">ส่งเมื่อ ${fmt(b.created_at)} · โดย ${esc(b.created_name || '—')}</div>
      </div>
      ${badge}
      <div class="bc-act">
        <button class="btn ghost sm" data-refs="${esc(b.batch_id)}">ดูรายการ</button>
        ${st === 'waiting'
          ? `<a class="btn sm" href="receive_batch.html?b=${encodeURIComponent(b.batch_id)}">รับเอกสาร →</a>`
          : ''}
      </div>
    </div>

    <div class="bc-meta">
      <div><div class="bk">ส่งมาจาก</div><div class="bv">${esc(b.from_site || '—')}</div></div>
      ${isAll ? `<div><div class="bk">ปลายทาง</div>
        <div class="bv">${esc(b.to_site || '—')}</div></div>` : ''}
      <div><div class="bk">ผู้รับ</div><div class="bv">${esc(b.receiver || '—')}</div></div>
      <div><div class="bk">ช่องทาง</div><div class="bv">${
        esc(CHANNEL_LABEL[b.channel] || b.channel || '—')}${
        b.vehicle ? ' · ' + esc(b.vehicle) : ''}</div></div>
      <div><div class="bk">จำนวน</div><div class="bv">${b.doc_count || 0} ฉบับ</div></div>
    </div>

    ${b.note ? `<div class="bc-note">${esc(b.note)}</div>` : ''}

    <div class="bc-refs" id="refs-${esc(b.batch_id)}" style="display:none">
      ${(b.refs || []).map(esc).join(' · ') || '—'}
    </div>
  </div>`;
}

$('btnReload').addEventListener('click', load);
['q', 'fStatus', 'fDate'].forEach(id =>
  $(id).addEventListener('input', render));

load();

</script>
</body>
</html>
