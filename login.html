<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%23f1f5f9'/%3E%3Crect x='11' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='14.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3Crect x='17' y='10' width='2' height='12' fill='%230f172a'/%3E%3Crect x='20.5' y='10' width='1' height='12' fill='%230f172a'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DocScan — เข้าสู่ระบบ</title>
<script src="config.js?v=2.15.2"></script>
<link rel="stylesheet" href="css/auth.css?v=2.14.0">
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5">
        <rect x="3" y="4" width="3" height="16" rx="1"/><rect x="8" y="4" width="1.5" height="16" rx="0.5"/>
        <rect x="11" y="4" width="3" height="16" rx="1"/><rect x="16" y="4" width="1.5" height="16" rx="0.5"/>
        <rect x="19" y="4" width="2" height="16" rx="1"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">DocScan</div>
      <div class="brand-sub">Pallet Tracking System</div>
    </div>
  </div>

  <div class="box">
    <div class="box-title">เข้าสู่ระบบ</div>
    <div class="box-sub">ใช้รหัสพนักงานและรหัสผ่านที่ตั้งไว้</div>

    <div class="alert bad" id="alert"></div>

    <div class="field">
      <label class="label" for="empId">รหัสพนักงาน</label>
      <input class="input" id="empId" type="text" autocomplete="username"
             placeholder="กรอกรหัสพนักงาน" autocapitalize="characters">
    </div>

    <div class="field">
      <label class="label" for="password">รหัสผ่าน</label>
      <input class="input" id="password" type="password" autocomplete="current-password"
             placeholder="กรอกรหัสผ่าน">
    </div>

    <button class="submit-btn" id="submitBtn" disabled>เข้าสู่ระบบ →</button>

    <div class="links">
      <a class="link" href="forgot-password.html">ลืมรหัสผ่าน</a>
      <a class="link" href="register.html">สมัครใช้งาน</a>
    </div>
  </div>

  <div class="footer">Palletmanagement@brs-group.com · <span id="ver"></span></div>
</div>

<script type="module">
import { login, loadSession, consumeReturnTo } from './js/auth.js?v=2.15.2';
import { homeFor } from './js/nav.js?v=2.15.2';

const API_URL = DOCSCAN_CONFIG.API_URL;
const $ = id => document.getElementById(id);
$('ver').textContent = 'v' + (DOCSCAN_CONFIG.VERSION || '');

// หน้าแรกตาม role มาจาก js/nav.js ที่เดียว

// มี session อยู่แล้วก็ข้ามไปเลย
const existing = loadSession();
if (existing) location.replace(homeFor(existing.role));

function check() {
  $('submitBtn').disabled = !($('empId').value.trim() && $('password').value);
}
$('empId').addEventListener('input', check);
$('password').addEventListener('input', check);

function showError(msg) {
  const a = $('alert');
  a.textContent = msg;
  a.className = 'alert bad on';
}

async function doLogin() {
  const btn = $('submitBtn');
  const empId = $('empId').value.trim();
  const pw = $('password').value;
  if (!empId || !pw) return;

  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';
  $('alert').className = 'alert bad';

  try {
    const s = await login(API_URL, empId, pw);
    // รหัสที่ผู้ดูแลตั้งให้ ต้องเปลี่ยนก่อนใช้งาน
    location.href = s.mustChangePassword ? 'change-password.html' : consumeReturnTo(homeFor(s.role));
  } catch (err) {
    showError(err.message || 'เข้าสู่ระบบไม่สำเร็จ');
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ →';
    $('password').value = '';
    $('password').focus();
  }
}

$('submitBtn').addEventListener('click', doLogin);
[$('empId'), $('password')].forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));

$('empId').focus();
</script>
</body>
</html>
